      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes iosSheetSlideDown {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      100% {
        opacity: 0;
        transform: translate3d(0, 36px, 0);
      }
    }

    @keyframes iosBackdropFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }

    @keyframes iosBackdropFadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

      100% { opacity: 1; transform: translate3d(0, 0, 0); }

    @keyframes sectionSlideNext {

      100% { opacity: 1; transform: translate3d(0, 0, 0); }

      100% { opacity: 1; transform: translate3d(0, 0, 0); }

      100% { opacity: 1; transform: translate3d(0, 0, 0); }

      }

        transform: scale3d(0.88, 0.88, 1);
      }
      100% {
        opacity: 1;
        transform: scale3d(1, 1, 1);
      }

      transition: opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity;

    .ios-opening-overlay.is-dismissing {

      will-change: transform, opacity;

      transform: scale3d(1.04, 1.04, 1);

      100% { transform: translate3d(-18px, 0, 0) scaleX(0.92); }

      50% { transform: translate3d(12px, 0, 0); }
      100% { transform: translate3d(-12px, 0, 0); }

      50% { opacity: 0.48; }

      100% { opacity: 1; }

      will-change: transform;

      animation: tabSlideNext 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .tab-slide-prev {
      animation: tabSlidePrev 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

      0% {
        opacity: 0.35;
        transform: translate3d(18px, 0, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      0% {
        opacity: 0.35;
        transform: translate3d(-18px, 0, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      animation: sectionSlideNext 0.19s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .section-slide-prev {
      animation: sectionSlidePrev 0.19s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .section-fade-soft {
      animation: sectionFadeSoft 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .schedule-load-next {
      animation: scheduleLoadNext 0.19s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .schedule-load-prev {
      animation: scheduleLoadPrev 0.19s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform, opacity;
      backface-visibility: hidden;

      animation: iosExpandIn 0.20s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

      touch-action: manipulation;
      transition: transform 0.10s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.10s ease;
    }
    .ios-card-press:active {
      transform: scale3d(0.982, 0.982, 1);
    }

    }
    button:active {

const getWbblCrestUri = (name) => {
  const low = String(name || '').toLowerCase().trim();
  const norm = normalizeCricketTeamName(name).toLowerCase().trim();
  const key = WBBL_OFFICIAL_CRESTS[low] ? low : WBBL_OFFICIAL_CRESTS[`${norm} women`] ? `${norm} women` : WBBL_OFFICIAL_CRESTS[norm] ? norm : null;
  if (!key) return null;
  return `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(WBBL_OFFICIAL_CRESTS[key])))}`;
};

// ⚡ HIGH-PERFORMANCE SWR CACHE & PRE-WARMING ENGINE
// ==========================================

const STORAGE_CACHE_KEY = 'sidelines_fast_cache_v21';
const TODAY_CRICKET_ARCHIVE_KEY = 'sideline_cricket_today_v21';
const cache = new Map();
const inflight = new Map();
const standingsParsedCache = new Map();
const knockoutCache = new Map();
const fallbackLogoCache = new Map();
const cricketLeagueLogoCache = new Map();
const cricketLogoCache = new Map();
const soccerLogoCache = new Map();
const CACHE_TTL = 300000; // 5 minutes fresh TTL

try {
  const rawSaved = localStorage.getItem(STORAGE_CACHE_KEY);
  if (rawSaved) {
    const parsed = JSON.parse(rawSaved);
    Object.entries(parsed).forEach(([k, v]) => {
      if (v && v.data !== undefined) cache.set(k, v);
    });
  }
} catch {}

let persistTimer = null;
const scheduleCachePersist = () => {
  if (persistTimer) return;
  persistTimer = setTimeout(() => {
    persistTimer = null;
    runWhenIdle(() => {
      try {
        const obj = {};
        let count = 0;
        const entries = Array.from(cache.entries()).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
        for (const [k, v] of entries) {
          if (count >= 25) break;
          const serialized = JSON.stringify(v);
          if (serialized.length < 400000) {
            obj[k] = v;
            count++;
          }
        }
        localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(obj));
      } catch {}
    }, 300);
  }, 2200);
};

const getCachedSync = (url) => {
  if (cache.has(url)) return cache.get(url).data;
  return null;
};

const fetchWithCache = async (url, forceRefresh = false, timeoutMs = 8000) => {
  const existing = cache.get(url);
  if (!forceRefresh && existing && (Date.now() - existing.timestamp < CACHE_TTL)) {
    return existing.data;
  }
  if (inflight.has(url)) return inflight.get(url);

  const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;

  const promise = fetch(url, controller ? { signal: controller.signal } : undefined)
    .then(res => {
      if (timer) clearTimeout(timer);
      if (!res.ok) throw new Error('API Error');
      return res.json();
    })
    .then(json => {
      const isEmptyArray = Array.isArray(json) && json.length === 0;
      const isErrorPayload = json && typeof json === 'object' && !Array.isArray(json) && (json.error || json.detail === 'Not Found');
      if (!isEmptyArray && !isErrorPayload) {
        cache.set(url, { data: json, timestamp: Date.now() });
        scheduleCachePersist();
      }
      inflight.delete(url);
      return json;
    })
    .catch(err => {
      if (timer) clearTimeout(timer);
      inflight.delete(url);
      if (existing) return existing.data;
      throw err;
    });

  inflight.set(url, promise);
  return promise;
};

const runWhenIdle = (fn, fallbackDelay = 100) => {
  if (typeof window !== 'undefined' && typeof window.requestIdleCallback === 'function') {
    window.requestIdleCallback(fn, { timeout: 1200 });
  } else {
    setTimeout(fn, fallbackDelay);
  }
};

/**
 * Extracts ONLY a concise year token like "2026-27" or "2026".
 * Never returns league names or duplicate tokens.
 */
const extractSeasonYear = (raw) => {
  if (raw === null || raw === undefined) return '';
  const str = String(raw).trim();
  const match = str.match(/\b(20\d{2}\s*[-/]\s*\d{2,4}|20\d{2})\b/);
  if (!match) return '';
  const token = match[1].replace(/\s+/g, '').replace('/', '-');
  const parts = token.split('-');
  if (parts.length === 2) {
    const startY = parts[0];
    const endY = parts[1].length === 4 ? parts[1].slice(-2) : parts[1].padStart(2, '0');
    return `${startY}-${endY}`;
  }
  return parts[0];
};

/**
 * Strips all year tokens (e.g. 2026-27, 2026/27, 2026-2027, 2026) and cleans separators.
 */
const stripSeasonYear = (raw) => {
  if (!raw) return '';
  return String(raw)
    .replace(/\b20\d{2}\s*[-/]\s*\d{2,4}\b/g, '')
    .replace(/\b20\d{2}\b/g, '')
    .replace(/\(\s*\)/g, '')
    .replace(/^[\s•\-:|]+|[\s•\-:|]+$/g, '')
    .replace(/\s+/g, ' ')
    .trim();
};

  /\bspanish laliga\b/ig,
  /\blaliga ea sports\b/ig,
  /\blaliga\b/ig,

  /\bworld cup\b/ig,
  /\buefa european championship\b/ig,
  /\buefa euro\b/ig,
  /\beuro\b/ig
];

/**
 * Normalizes a group/table header so it NEVER duplicates the league title or season year.
 * Returns 'Standings' when the raw name merely repeats the league title/year (e.g. "2026-27 English Premier League"),
 * or returns only the distinct sub-group label (e.g. "Group A", "Eastern Conference", "League Phase").
 */
const cleanGroupTitle = (groupName, leagueName, fallbackLabel = 'Standings') => {
  let cleaned = stripSeasonYear(groupName || '');
  const cleanLeague = stripSeasonYear(leagueName || '');

  if (cleanLeague) {
    const escaped = cleanLeague.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    cleaned = cleaned.replace(new RegExp(escaped, 'ig'), '');
    LEAGUE_SYNONYM_PATTERNS.forEach(re => {
      if (re.test(cleanLeague)) {
        cleaned = cleaned.replace(re, '');
      }
    });
  }

  cleaned = cleaned
    .replace(/^[\s•\-:|,]+|[\s•\-:|,]+$/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  const low = cleaned.toLowerCase();
  const genericSet = new Set([
    '', 'standings', 'overall', 'league', 'league table', 'league stage',
    'points table', 'table', 'english', 'spanish', 'italian', 'uefa', 'fifa',
    'regular season', 'season'
  ]);

  }
  return cleaned;
};

const isSameDay = (d1, d2) => {
  if (!d1 || !d2) return false;
  const a = new Date(d1);
  const b = new Date(d2);
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
};

const toLocalIsoDate = (d) => {
  const dt = d instanceof Date ? d : new Date(d);
  if (isNaN(dt)) return '';
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};

const decodeEntities = (str) => {
  if (!str) return '';
  return String(str)
    .replace(/&(dagger|Dagger);|&#8224;|&#8225;|&#x2020;|&#x2021;/ig, '')
    .replace(/[†‡✝✚➕+]/g, '')
    .replace(/&amp;/ig, '&')
    .replace(/&nbsp;/ig, ' ')
    .replace(/&copy;/ig, '©')
    .replace(/&#39;/g, "'")
    .replace(/&quot;/g, '"')
    .replace(/&ast;/ig, '*')
    .replace(/\s+/g, ' ')
    .trim();
};

const cleanPlayerName = (str) => {
  if (!str) return '';
  return decodeEntities(str).replace(/\s*[+†‡✝✚➕]+\s*/g, ' ').replace(/\s+/g, ' ').trim();
};

const stripHtml = (html) => html ? decodeEntities(String(html).replace(/<[^>]+>/g, '')).trim() : '';
const titleCase = (str) => str ? String(str).toLowerCase().replace(/\b\w/g, s => s.toUpperCase()) : "";
const capitalize = (str) => str ? str.charAt(0).toUpperCase() + str.slice(1).toLowerCase() : "";

const get24HourTime = (dateString) => {
  if (!dateString) return '';
  const d = new Date(dateString);
  return isNaN(d) ? dateString : `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
};

const getFavFormattedDate = (dateString, hideDate = false) => {
  if (!dateString) return '';
  const d = new Date(dateString);
  const time = get24HourTime(dateString);
  if (hideDate || d.toDateString() === new Date().toDateString()) return time;
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${d.getDate()} ${months[d.getMonth()]} • ${time}`;
};

const getRelativeTime = (dateStr) => {
  if (!dateStr) return 'Just now';
  const diff = Math.floor((new Date() - new Date(dateStr)) / 1000);
  if (diff < 60) return `${Math.max(1, diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
};

const categorizeNews = (headline, desc, categories = []) => {
  const h = String(headline || '').trim();
  const d = String(desc || '').trim();
  const catHints = (Array.isArray(categories) ? categories : [])
    .map(c => (typeof c === 'string' ? c : (c?.description || c?.name || c?.type || '')))
    .join(' ');

  let best = { label: 'News', color: THEME.accent, score: 0 };

  for (const rule of NEWS_CATEGORY_RULES) {
    let score = 0;
    if (rule.strong.test(h)) score += 6;
    if (rule.medium.test(h)) score += 3;
    if (rule.strong.test(d)) score += 3;
    if (rule.medium.test(d)) score += 1;
    if (catHints && rule.strong.test(catHints)) score += 2;

    if (score > best.score) {
      best = { label: rule.label, color: rule.color, score };
    }
  }

  return best.score >= 3 ? { label: best.label, color: best.color } : { label: 'News', color: THEME.accent };
};

const getFallbackLogo = (name, customColors = null) => {
  const cacheKey = `${String(name || 'T')}|${customColors ? customColors.join(',') : ''}`;
  if (fallbackLogoCache.has(cacheKey)) return fallbackLogoCache.get(cacheKey);

  const cleanName = String(name || 'T').replace(/[^a-zA-Z0-9\s]/g, '').trim() || 'T';
  const words = cleanName.split(/\s+/);
  let initials = 'T';
  if (customColors?.[2]) {
    initials = customColors[2];
  } else if (words.length > 1 && words[0].length > 0 && words[1].length > 0) {
    initials = (words[0][0] + words[1][0]).toUpperCase();
  } else if (words.length > 0 && words[0].length > 0) {
    initials = words[0].substring(0, 3).toUpperCase();
  }

  let c1, c2;
  if (customColors) {
    c1 = customColors[0];
    c2 = customColors[1];
  } else {
    let hash = 0;
    for (let i = 0; i < cleanName.length; i++) hash = cleanName.charCodeAt(i) + ((hash << 5) - hash);
    const h = Math.abs(hash) % 360;
    const s = 68 + (Math.abs(hash) % 20);
    const l = 38 + (Math.abs(hash) % 15);
    c1 = `hsl(${h}, ${s}%, ${l + 14}%)`;
    c2 = `hsl(${h}, ${s}%, ${l}%)`;
  }

  const fontSize = initials.length > 2 ? 28 : 34;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${c1}"/>
              <stop offset="100%" stop-color="${c2}"/>
          </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3" />
      <text x="50" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="${fontSize}" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">${initials}</text>
  </svg>`;
  const uri = `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}`;
  fallbackLogoCache.set(cacheKey, uri);
  return uri;
};

const DARK_MONOCHROME_LOGO_RE = /(juventus|tottenham|spurs|derby county|swansea|champions league|premier league|championship|league one|fa cup|ligue 1|europa league|world cup|euro)/i;
const DARK_COLORED_CREST_RE = /(inter milan|internazionale|^inter$|newcastle|fulham|everton|st\. pauli|paok|besiktas|millwall|preston|birmingham|west brom|club brugge|freiburg|blackburn|hull city|sheffield wednesday|bochum|augsburg|udinese|cagliari|torino|porto|fenerbahce|anderlecht|sturm graz|d\.c\. united|dc united|cf montreal|san jose|columbus crew|lafc|los angeles fc|houston dynamo|new york city|nycfc|austin fc)/i;

const getDarkLogoStyle = (nameOrTeam) => {
  const raw = typeof nameOrTeam === 'string'
    ? nameOrTeam
    : (nameOrTeam?.shortDisplayName || nameOrTeam?.name || nameOrTeam?.displayName || '');
  const clean = String(raw || '').trim();
  if (!clean) return undefined;
  if (DARK_COLORED_CREST_RE.test(clean)) {
    return { filter: 'brightness(1.28) contrast(1.06)' };
  }
  return undefined;
};

const handleImageError = (e, fallbackName) => {
  const img = e.target;
  const curSrc = String(img.src || '');
  // If official ESPN 500-dark asset is unavailable, gracefully downgrade once to /500/
  if (curSrc.includes('/500-dark/') && !img.dataset.darkFallback) {
    img.dataset.darkFallback = '1';
    if (DARK_MONOCHROME_LOGO_RE.test(String(fallbackName || ''))) {
      img.style.filter = 'invert(1) brightness(1.08)';
    } else {
      img.style.filter = 'brightness(1.25) contrast(1.06)';
    }
    img.src = curSrc.replace('/500-dark/', '/500/');
    return;
  }
  img.onerror = null;
  img.style.filter = '';
  const wbblCrest = getWbblCrestUri(fallbackName);
  if (wbblCrest) {
    img.src = wbblCrest;
    return;
  }
  const low = String(fallbackName || '').toLowerCase().trim();
  const norm = normalizeCricketTeamName(fallbackName).toLowerCase().trim();
  const custom = WBBL_TEAM_BADGES[low] || WBBL_TEAM_BADGES[norm] || CRICKET_TEAM_COLORS[low] || CRICKET_TEAM_COLORS[norm] || null;
  img.src = getFallbackLogo(fallbackName, custom);
};

const normalizeCricketTeamName = (name) => {
  if (!name) return '';
  let clean = String(name).replace(/\([^)]+\)/g, ' ').replace(/[-–]\s*(A|W|U19)\b/ig, ' ');
  clean = clean.replace(/\b(W|Women|Women's|Men|Men's|A|B|U19|U19s|Under-19|Under-19s|Under 19|Under 19s|1st XI|2nd XI|XI|Academy|Emerging|Rising Stars|Shaheens|Lions|Wolves|Development)\b/ig, '');
  return clean.replace(/\s+/g, ' ').trim();
};

const normalizeApiLogoUrl = (raw) => {
  if (!raw || typeof raw !== 'string') return '';
  const trimmed = raw.trim();
  if (!trimmed || /default|placeholder|no[-_]?image/i.test(trimmed)) return '';
  if (trimmed.startsWith('https://') || trimmed.startsWith('http://')) return trimmed;
  if (trimmed.startsWith('//')) return `https:${trimmed}`;
  if (trimmed.startsWith('/db/') || trimmed.startsWith('db/')) {
    const cleanPath = trimmed.replace(/^\/+/, '');
    return `https://img1.hscicdn.com/image/upload/f_auto,t_ds_square_w_160,q_50/lsci/${cleanPath}`;
  }
  return '';
};

const getCricketCountryFlagUrl = (searchName, rawLower, shortLower) => {
  for (const { code, keys } of CRICKET_COUNTRY_ALIASES) {
    for (const key of keys) {
      if (key === searchName || key === shortLower || key === rawLower || new RegExp(`\\b${key}\\b`, 'i').test(searchName)) {
        return `https://flagcdn.com/w160/${code.toLowerCase()}.png`;
      }
    }
  }
  return '';
};

const getCricketLogoCandidates = (team) => {
  if (!team) return [getFallbackLogo('T')];
  if (typeof team === 'string') return getCricketLogoCandidates({ name: team });

  const rawName = team.team_name || team.name || team.short_name || team.displayName || 'Team';
  const shortRaw = team.short_name || team.abbreviation || '';
  const tid = String(team.team_id || team.id || '').trim();
  const rawApiLogo = team.logo || team.team_logo || team.image_url || team.imageUrl || team.team_image || team.image_path || '';
  const apiLogo = normalizeApiLogoUrl(rawApiLogo);

  const cacheKey = `cand_v23|${tid}|${rawName}|${shortRaw}|${apiLogo}`;
  if (cricketLogoCache.has(cacheKey)) return cricketLogoCache.get(cacheKey);

  const tName = normalizeCricketTeamName(rawName);
  const searchName = tName.toLowerCase().trim();
  const rawLower = String(rawName).toLowerCase().trim();
  const shortLower = String(shortRaw).toLowerCase().trim();

  const candidates = [];
  const pushUnique = (u) => {
    if (u && !candidates.includes(u)) candidates.push(u);
  };

  // 1. Original logo URL directly from the Render Cricket API
  if (apiLogo) pushUnique(apiLogo);

  // 2. Official ESPN CDN cricket logo via exact numeric team_id (works for every franchise, international, A-team, Women's & domestic club)
  if (tid && /^\d+$/.test(tid)) {
    pushUnique(`https://a.espncdn.com/i/teamlogos/cricket/500/${tid}.png`);
  }

  // 3. Verified official original cricket team logo map (ICC boards, IPL, WPL, BBL/WBBL, PSL, SA20, CPL, The Hundred, ILT20, MLC)
  const mappedLogo = CRICKET_FRANCHISE_LOGOS[rawLower] || CRICKET_FRANCHISE_LOGOS[searchName] || CRICKET_FRANCHISE_LOGOS[shortLower];
  if (mappedLogo) pushUnique(mappedLogo);

  // 4. Country flag fallback for national / A / Women's / U19 sides
  const flagUrl = getCricketCountryFlagUrl(searchName, rawLower, shortLower);
  if (flagUrl) pushUnique(flagUrl);

  // 5. Final vector crest / monogram fallback
  const wbblCrest = getWbblCrestUri(rawName);
  if (wbblCrest) pushUnique(wbblCrest);
  const customColors = WBBL_TEAM_BADGES[rawLower] || WBBL_TEAM_BADGES[searchName] || CRICKET_TEAM_COLORS[rawLower] || CRICKET_TEAM_COLORS[searchName] || null;
  pushUnique(getFallbackLogo(shortRaw || rawName, customColors));

  cricketLogoCache.set(cacheKey, candidates);
  return candidates;
};

const getCricketLogo = (team) => getCricketLogoCandidates(team)[0];

const handleCricketImageError = (e, team) => {
  const img = e.target;
  const candidates = getCricketLogoCandidates(team);
  const curIdx = parseInt(img.dataset.logoIdx || '0', 10);
  const nextIdx = curIdx + 1;
  if (nextIdx < candidates.length) {
    img.dataset.logoIdx = String(nextIdx);
    img.src = candidates[nextIdx];
    return;
  }
  img.onerror = null;
  const fallbackName = typeof team === 'string' ? team : (team?.short_name || team?.name || team?.team_name || team?.displayName || 'T');
  img.src = getFallbackLogo(fallbackName);
};

const getFootballLeagueLogo = (matchOrLeagueId, leagueName = '') => {

  return getCricketLeagueLogo(leagueName || 'FOOTBALL');
};

const toEspnDarkLogoUrl = (url) => {
  if (!url) return '';
  const s = String(url);
  if (s.includes('espncdn.com') && s.includes('/500/') && !s.includes('/500-dark/')) {
    return s.replace('/500/', '/500-dark/');
  }
  return s;
};

const getSafeFootballLogo = (team) => {
  if (!team) return getFallbackLogo('T');
  const logoArr = team?.logos || team?.team?.logos || [];
  const darkEntry = Array.isArray(logoArr)
    ? logoArr.find(l => l?.href && ((Array.isArray(l.rel) && l.rel.includes('dark')) || String(l.href).includes('500-dark')))
    : null;
  const rawApiLogo = darkEntry?.href || team?.logo || logoArr?.[0]?.href || team?.imageUrl || team?.team?.logo || '';
  const tid = team?.id || team?.team?.id || '';
  const name = team?.shortDisplayName || team?.name || team?.displayName || 'T';
  const cacheKey = `dark_v1|${tid}|${rawApiLogo}|${name}`;
  if (soccerLogoCache.has(cacheKey)) return soccerLogoCache.get(cacheKey);

  let resolved;
  if (rawApiLogo && !String(rawApiLogo).includes('default-team-logo')) {
    resolved = toEspnDarkLogoUrl(rawApiLogo);
  } else if (tid && /^\d+$/.test(String(tid))) {
    resolved = `https://a.espncdn.com/i/teamlogos/soccer/500-dark/${tid}.png`;
  } else {
    resolved = getFallbackLogo(name);
  }
  soccerLogoCache.set(cacheKey, resolved);
  return resolved;
};

// --- CRICKET API MERGER, TODAY ARCHIVE & DATE NORMALIZATION (100% RENDER API) ---
const extractCricketArray = (res) => {
  if (!res) return [];
  if (Array.isArray(res)) return res;
  if (Array.isArray(res.matches)) return res.matches;
  if (Array.isArray(res.data)) return res.data;
  if (Array.isArray(res.events)) return res.events;
  if (Array.isArray(res.schedule)) return res.schedule;
  if (Array.isArray(res.live)) return res.live;
  if (Array.isArray(res.results)) return res.results;
  return [];
};

const parseSafeCricketDate = (raw) => {
  if (raw === null || raw === undefined || raw === '') return null;
  if (raw instanceof Date) return isNaN(raw.getTime()) ? null : raw;
  if (typeof raw === 'number') {
    const ms = raw < 1e12 ? raw * 1000 : raw;
    const d = new Date(ms);
    return isNaN(d.getTime()) ? null : d;
  }
  const s = String(raw).trim();
  if (!s) return null;
  if (/^\d{10,13}$/.test(s)) {
    const num = Number(s);
    const d = new Date(num < 1e12 ? num * 1000 : num);
    return isNaN(d.getTime()) ? null : d;
  }
  // Normalize space-separated SQL timestamps for iOS Safari
  const normalized = /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(s) ? s.replace(/\s+/, 'T') : s;
  const d = new Date(normalized);
  return isNaN(d.getTime()) ? null : d;
};

const extractRawIsoDay = (raw) => {
  if (!raw) return '';
  const m = String(raw).match(/(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : '';
};

const isCricketMatchFinished = (m) => {
  if (!m) return false;
  const st = String(m.status || '').toUpperCase().trim();
  const stTxt = String(m.status_text || '').toUpperCase();
  const upd = String(m.match_update || '').toUpperCase();
  const combined = `${st} ${stTxt} ${upd}`;
  if (st === 'POST' || st === 'FINAL' || st === 'COMPLETED' || st === 'FINISHED' || st === 'ENDED' || st === 'RESULT') return true;
  if (/\b(WON BY|MATCH TIED|MATCH DRAWN|NO RESULT|ABANDONED|CANCELLED|CANCELED|SUPER OVER|FINAL|RESULT|MATCH OVER|MATCH ENDED)\b/i.test(combined)) {
    return true;
  }
  return false;
};

const isCricketMatchUpcoming = (m) => {
  if (!m || isCricketMatchFinished(m)) return false;
  const st = String(m.status || '').toUpperCase().trim();
  if (st === 'PRE' || st === 'SCHEDULED' || st === 'UPCOMING' || st === 'NOT STARTED') return true;
  if (st === 'IN' || st === 'LIVE' || m._fromLive) return false;
  const parsed = parseSafeCricketDate(m.start_time || m.startTime || m.date);
  return Boolean(parsed && parsed.getTime() > Date.now());
};

// Same-day archive so finished matches seen earlier today NEVER vanish if /live drops them before /schedule refreshes
const loadTodayCricketArchive = () => {
  try {
    const todayKey = toLocalIsoDate(new Date());
    const raw = JSON.parse(localStorage.getItem(TODAY_CRICKET_ARCHIVE_KEY) || 'null');
    if (raw && raw.dateKey === todayKey && Array.isArray(raw.items)) {
      return raw.items;
    }
  } catch {}
  return [];
};

const saveTodayCricketArchive = (matches) => {
  try {
    const todayKey = toLocalIsoDate(new Date());
    const clean = (Array.isArray(matches) ? matches : [])
      .filter(m => m && m.match_id && Array.isArray(m.teams) && m.teams.length >= 2)
      .slice(0, 80);
    localStorage.setItem(TODAY_CRICKET_ARCHIVE_KEY, JSON.stringify({ dateKey: todayKey, items: clean }));
  } catch {}
};

const mergeCricketSources = (schedData, liveData, archiveData, isViewingToday) => {
  const byId = new Map();

  const upsert = (raw, sourceType = 'sched') => {
    if (!raw || !Array.isArray(raw.teams) || raw.teams.length < 2) return;
    const rawId = raw.match_id ?? raw.id;
    const startVal = raw.start_time || raw.startTime || raw.date || raw.start_date || raw.match_date || '';
    const idKey = rawId !== undefined && rawId !== null && String(rawId).trim() !== ''
      ? String(rawId).trim()
      : `${String(raw.teams[0]?.name || '')}_${String(raw.teams[1]?.name || '')}_${startVal}`;

    const rawFinished = isCricketMatchFinished(raw);
    const isActuallyLive = sourceType === 'live' && !rawFinished;
    const prev = byId.get(idKey);

    if (!prev) {
      byId.set(idKey, {
        ...raw,
        match_id: String(rawId ?? idKey),
        start_time: startVal,
        _fromLive: isActuallyLive
      });
      return;
    }

    const prevFinished = isCricketMatchFinished(prev);
    // If an earlier fresh source already knows the match is finished and an older/archive source doesn't, keep the finished state
    if (sourceType === 'archive' && (prevFinished || prev._fromLive)) return;

    const mergedTeams = raw.teams.map((t, idx) => ({
      ...(prev.teams?.[idx] || {}),
      ...t,
      score: t.score || prev.teams?.[idx]?.score || '',
      logo: t.logo || prev.teams?.[idx]?.logo || ''
    }));

    byId.set(idKey, {
      ...prev,
      ...raw,
      match_id: prev.match_id || String(rawId ?? idKey),
      start_time: raw.start_time || prev.start_time || startVal,
      end_date: raw.end_date || raw.end_time || prev.end_date || prev.end_time,
      league: raw.league || prev.league,
      series: raw.series || prev.series,
      title: raw.title || prev.title,
      venue: raw.venue || prev.venue,
      status: rawFinished ? (raw.status || 'POST') : (prevFinished && sourceType !== 'live' ? prev.status : (raw.status || prev.status)),
      status_text: raw.status_text || prev.status_text,
      match_update: raw.match_update || prev.match_update,
      teams: mergedTeams,
      _fromLive: rawFinished ? false : Boolean(isActuallyLive || (sourceType !== 'sched' && prev._fromLive))
    });
  };

  // Priority order (lowest -> highest):
  // 1. Same-day archive (keeps finished matches visible even if /live dropped them)
  if (isViewingToday) {
    extractCricketArray(archiveData).forEach(m => upsert(m, 'archive'));
  }
  // 2. Schedule data (fresh Render /schedule overwrites stale archive/cache)
  extractCricketArray(schedData).forEach(m => upsert(m, 'sched'));
  // 3. Live data (highest priority for active live scores on Today, preserving /schedule metadata)
  if (isViewingToday) {
    extractCricketArray(liveData).forEach(m => upsert(m, 'live'));
  }

  return Array.from(byId.values());
};

const filterAndSortCricketForDate = (mergedList, targetDate) => {
  const selectedDateStr = toLocalIsoDate(targetDate);
  const selectedDayStart = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
  const isViewingToday = isSameDay(targetDate, new Date());

  const filtered = (mergedList || []).filter(m => {
    const combinedTitle = String([m.title, m.match_title, m.league, m.series, m.format, m.teams?.[0]?.name, m.teams?.[1]?.name].filter(Boolean).join(' ')).toLowerCase();
    if (!CRICKET_ALWAYS_ALLOW_REGEX.test(combinedTitle) && CRICKET_DOMESTIC_LEAGUE_REGEX.test(combinedTitle)) {
      return false;
    }

    const finished = isCricketMatchFinished(m);
    const statUpper = String(m.status || m.status_text || '').toUpperCase();
    const isMatchActive = !finished && (Boolean(m._fromLive) || statUpper === 'LIVE' || statUpper === 'IN' ||
      statUpper.includes('DAY ') || statUpper.includes('STUMPS') || statUpper.includes('RAIN') ||
      statUpper.includes('TEA') || statUpper.includes('LUNCH') || statUpper.includes('BREAK'));

    const rawStart = m.start_time || m.startTime || m.date || m.start_date || m.match_date || '';
    const parsedStart = parseSafeCricketDate(rawStart);
    const localStartStr = parsedStart ? toLocalIsoDate(parsedStart) : '';
    const utcStartStr = parsedStart ? parsedStart.toISOString().split('T')[0] : '';
    const rawStartDay = extractRawIsoDay(rawStart);

    // Live matches from /live must always appear on Today even if start_time is absent or began on an earlier day
    if (isViewingToday && Boolean(m._fromLive)) return true;

    // Check explicit completion/end date too so matches that started late yesterday and finished today stay visible on Today
    const rawEnd = m.end_date || m.end_time || m.completed_at || '';
    const parsedEnd = parseSafeCricketDate(rawEnd);
    const localEndStr = parsedEnd ? toLocalIsoDate(parsedEnd) : '';
    const utcEndStr = parsedEnd ? parsedEnd.toISOString().split('T')[0] : '';
    const rawEndDay = extractRawIsoDay(rawEnd);
    if (localEndStr === selectedDateStr || utcEndStr === selectedDateStr || rawEndDay === selectedDateStr) return true;

    if (!rawStart && !parsedStart) return false;
    if (localStartStr === selectedDateStr || utcStartStr === selectedDateStr || rawStartDay === selectedDateStr) return true;

    const baseStartStr = localStartStr || rawStartDay;
    if (!baseStartStr) return false;
    const [sy, sm, sd] = baseStartStr.split('-').map(Number);
    const startDayObj = new Date(sy, sm - 1, sd);

    let endDayObj = new Date(startDayObj);
    const endIso = localEndStr || rawEndDay;
    if (endIso) {
      const [ey, em, ed] = endIso.split('-').map(Number);
      endDayObj = new Date(ey, em - 1, ed);
    } else if (combinedTitle.includes('test')) {
      endDayObj.setDate(startDayObj.getDate() + 4);
    } else if (combinedTitle.includes('first class') || combinedTitle.includes('4-day') || combinedTitle.includes('four-day') || combinedTitle.includes('fc')) {
      endDayObj.setDate(startDayObj.getDate() + 3);
    }

    if (selectedDayStart >= startDayObj && selectedDayStart <= endDayObj) return true;
    if (isViewingToday && isMatchActive && startDayObj <= selectedDayStart) return true;
    return false;
  });

  // Sort cleanly: Live first -> Upcoming chronological -> Finished/Completed most recent
  return filtered.sort((a, b) => {
    const rankOf = (m) => {
      if (isCricketMatchFinished(m)) return 2;
      const st = String(m.status || '').toUpperCase();
      if (isViewingToday && (m._fromLive || st === 'IN' || st === 'LIVE')) return 0;
      if (isCricketMatchUpcoming(m)) return 1;
      return 2;
    };
    const ra = rankOf(a);
    const rb = rankOf(b);
    if (ra !== rb) return ra - rb;
    const ta = parseSafeCricketDate(a.start_time)?.getTime() || 0;
    const tb = parseSafeCricketDate(b.start_time)?.getTime() || 0;
    return ra === 2 ? (tb - ta) : (ta - tb);
  });
};

// --- CRICKET STATUS, SCORE & FORM HELPERS ---
const formatCricketScore = (str) => {
  if (!str || str === "1" || str === "0") return { runs: "", overs: "", inn: "" };
  let activeStr = String(str);
  let inn = "";

  if (activeStr.includes('&')) {
    const parts = activeStr.split('&').map(s => s.trim());
    activeStr = parts[parts.length - 1];
    inn = `Inn ${parts.length}`;
  }

  const isFollowOn = activeStr.toLowerCase().includes('f/o');
  if (isFollowOn) activeStr = activeStr.replace(/f\/o/ig, '').replace(/\(\s*\)/g, '').trim();

  const parts = activeStr.split(' (');
  let oversStr = parts[1] ? `(${parts[1]}` : "";

  if (oversStr.toLowerCase().includes('super over')) {
    inn = "Super Over";
    oversStr = oversStr.replace(/,? \s*super over/ig, '');
  }
  if (oversStr) {
    oversStr = oversStr.replace(/,?\s*target\s*\d+/ig, '').replace(/,\s*\)/g, ')').replace(/\s+\)/g, ')').trim();
  }
  if (isFollowOn) oversStr = oversStr ? `${oversStr.replace(')', '')} f/o)` : "(f/o)";
  if (inn && oversStr) oversStr = `${oversStr} • ${inn}`;
  else if (inn && !oversStr) oversStr = inn;

  return { runs: parts[0], overs: oversStr };
};

const formatCricketToss = (toss, teams) => {
  if (!toss) return '';
  let str = String(toss);
  if (teams && teams.length >= 2) {
    if (teams[0]?.name) str = str.replace(new RegExp(teams[0].name, 'ig'), teams[0].short_name || teams[0].name);
    if (teams[1]?.name) str = str.replace(new RegExp(teams[1].name, 'ig'), teams[1].short_name || teams[1]?.name);
  }
  return str.replace(/\s*,\s*elected to/ig, ' elected to').replace(/elected to field first/ig, 'elected to field').replace(/elected to bat first/ig, 'elected to bat').replace(/\s+/g, ' ').trim();
};

const getCricketMatchStatus = (match, selectedDate) => {
  if (!match) return { isLive: false, isActionLive: false, displayLabel: '', color: THEME.muted, detailedStatus: '', allUpdates: [] };

  const statUpper = String(match.status_text || match.status || '').toUpperCase();
  const rawUpdates = String(match.match_update || '').split('|').map(s => s.trim()).filter(Boolean);
  let parsedUpdates = [];
  let umps = [];
  let resultString = '';

  rawUpdates.forEach(u => {
    if (/^\d{4}$/.test(u) || /^\d+ [A-Za-z]+ \d{4}/.test(u) || /^Result$/i.test(u)) return;
    if (/(won by| 2, .* 0| 0, .* 2|drawn|tied|abandoned|no result)/i.test(u) && !u.toLowerCase().includes('innings')) resultString = u;
    let text = u.replace(/\b202\d\b/g, '').replace(/\s+/g, ' ').trim();
    if (!text) return;
    if (/^[A-Z][a-z]+ [A-Z][a-z]+$/.test(text) && !text.toLowerCase().includes('innings') && !text.toLowerCase().includes('match')) {
      umps.push(text);
      return;
    }
    parsedUpdates.push(text);
  });

  const primaryUpdate = parsedUpdates.length > 0 ? parsedUpdates[0].toUpperCase() : '';
  if (umps.length > 0) parsedUpdates.unshift(`Match Officials: ${umps.join(', ')}`);
  if (parsedUpdates.length === 0 && (match.status === 'POST' || statUpper.includes('FINAL') || statUpper.includes('WON'))) {
    if (match.status_text) parsedUpdates.push(match.status_text);
  }

  let isLive = false;
  let displayLabel = statUpper;
  let isActionLive = false;
  let color = THEME.accent;
  const isViewingToday = !selectedDate || isSameDay(selectedDate, new Date());

  const isFinished = isCricketMatchFinished(match);
  if (!isFinished && (match.status === 'IN' || statUpper.includes('LIVE')) && isViewingToday) {
    isLive = true;
    isActionLive = true;
    const checkText = statUpper === 'LIVE' && primaryUpdate ? primaryUpdate : statUpper;
    if (checkText.includes('STUMPS') || checkText.includes('END OF DAY')) { isActionLive = false; displayLabel = "STUMPS"; color = THEME.warning; }
    else if (checkText.includes('RAIN') || checkText.includes('DELAY') || checkText.includes('WET')) { isActionLive = false; displayLabel = "DELAYED"; color = THEME.danger; }
    else if (checkText.includes('TEA')) { isActionLive = false; displayLabel = "TEA BREAK"; color = THEME.warning; }
    else if (checkText.includes('LUNCH')) { isActionLive = false; displayLabel = "LUNCH BREAK"; color = THEME.warning; }
    else if (checkText.includes('INNINGS BREAK')) { isActionLive = false; displayLabel = "INNINGS BREAK"; color = THEME.warning; }
    else if (checkText.includes('TOSS')) { isActionLive = false; displayLabel = "TOSS"; }
    else { displayLabel = "LIVE"; color = THEME.success; }
  } else if (statUpper.includes('ABANDON') || statUpper.includes('CANCEL') || statUpper.includes('NO RESULT')) {
    displayLabel = 'ABANDONED';
    color = THEME.danger;
  } else if (isFinished || match.status === 'POST' || statUpper.includes('FINAL') || statUpper.includes('WON') || statUpper.includes('RESULT') || statUpper.includes('TIED') || statUpper.includes('DRAWN') || statUpper.includes('OVER')) {
    displayLabel = match.status_text || 'FT';
    color = THEME.muted;
  } else {
    displayLabel = match.status_text && !statUpper.includes('LIVE') ? match.status_text : 'UPCOMING';
    color = THEME.muted;
  }

  let detailedStatus = resultString || primaryUpdate || match.status_text || '';
  const genericTerms = ['FINAL', 'RESULT', 'MATCH ENDED', 'MATCH OVER', 'SCHEDULED', 'POST', 'ABANDONED', 'LIVE', 'UPCOMING'];
  if (genericTerms.includes(String(detailedStatus).toUpperCase()) || String(detailedStatus).toUpperCase() === displayLabel.toUpperCase()) detailedStatus = '';

  return { isLive, isActionLive, displayLabel, color, detailedStatus, allUpdates: parsedUpdates };
};

const cleanCricketDismissalText = (dismissalStr, isOut) => {
  if (!isOut) return 'not out';
  if (!dismissalStr) return '';
  let cleanStr = decodeEntities(String(dismissalStr));
  const match = cleanStr.match(/\s+(c\s.*?|b\s.*?|lbw\b|run out\b|st\s.*?|hit wicket\b|retired\b)(?=\s+\d+\s*\()/i);
  if (match) return match[1].trim();
  return cleanStr.replace(/\d+\s*\(\d+m\s*\d+b.*\)/i, '').replace(/SR:\s*\d+(\.\d+)?/i, '').replace(/^[A-Z\s]+(?=\s(c|b|lbw|run out|st|hit wicket))/i, '').trim();
};

const getShortLeagueName = (league) => {
  if (!league) return "Match";
  const clean = stripSeasonYear(league);
  const known = {
    "Indian Premier League": "IPL",
    "Women's Premier League": "WPL",
    "Pakistan Super League": "PSL",
    "SA20": "SA20",
    "Big Bash League": "BBL",
    "Caribbean Premier League": "CPL",
    "The Hundred": "The Hundred",
    "T20 Blast": "Blast"
  };
  if (known[clean]) return known[clean];
  const words = String(clean || league).split(' ').filter(Boolean);
  return words.length > 2 ? words.map(w => w[0]).join('').toUpperCase() : (clean || league);
};

const doesCricketTeamMatch = (t, targetTeam) => {
  if (!t || !targetTeam) return false;
  const tid1 = String(t.team_id || t.id || '').trim();
  const tid2 = String(targetTeam.team_id || targetTeam.id || '').trim();
  if (tid1 && tid2 && tid1 === tid2) return true;

  const names1 = [
    normalizeCricketTeamName(t.name || t.team_name),
    String(t.short_name || '').toLowerCase().trim(),
    String(t.name || t.team_name || '').toLowerCase().trim()
  ].filter(Boolean);

  const names2 = [
    normalizeCricketTeamName(targetTeam.name || targetTeam.team_name || targetTeam.displayName),
    String(targetTeam.short_name || '').toLowerCase().trim(),
    String(targetTeam.name || targetTeam.team_name || targetTeam.displayName || '').toLowerCase().trim()
  ].filter(Boolean);

  return names1.some(n1 => names2.some(n2 => n1 && n2 && n1.toLowerCase() === n2.toLowerCase()));
};

const deriveCricketRecentForm = (targetTeam, allMatches = [], teamProf = null, teamStats = null) => {
  const formItems = [];
  const completedMatches = [];

  if (Array.isArray(allMatches)) {
    const teamMatches = allMatches.filter(m => {
      if (!m?.teams || m.teams.length < 2) return false;
      if (!m.teams.some(t => doesCricketTeamMatch(t, targetTeam))) return false;
      const st = String(m.status || '').toUpperCase();
      const stTxt = String(m.status_text || m.match_update || '').toLowerCase();
      const hasScores = m.teams[0]?.score || m.teams[1]?.score;
      return st === 'POST' || st === 'FINAL' || st === 'COMPLETED' || st === 'RESULT' ||
        stTxt.includes('won by') || stTxt.includes('match tied') || stTxt.includes('no result') ||
        stTxt.includes('abandoned') || stTxt.includes('drawn') ||
        (hasScores && st !== 'PRE' && st !== 'SCHEDULED' && st !== 'LIVE' && st !== 'IN');
    }).sort((a, b) => new Date(b.start_time || 0) - new Date(a.start_time || 0));

    teamMatches.forEach(m => {
      const myTeamIdx = m.teams.findIndex(t => doesCricketTeamMatch(t, targetTeam));
      const myTeam = m.teams[myTeamIdx >= 0 ? myTeamIdx : 0];
      const oppTeam = m.teams[myTeamIdx === 0 ? 1 : 0];
      const combinedStatus = `${m.status_text || ''} | ${m.match_update || ''}`.toLowerCase();

      let badge = null;
      const myNames = [myTeam?.name, myTeam?.short_name, targetTeam?.name, targetTeam?.short_name, normalizeCricketTeamName(targetTeam?.name)].filter(Boolean).map(s => String(s).toLowerCase());
      const oppNames = [oppTeam?.name, oppTeam?.short_name, normalizeCricketTeamName(oppTeam?.name)].filter(Boolean).map(s => String(s).toLowerCase());

      if (combinedStatus.includes('abandoned') || combinedStatus.includes('no result') || combinedStatus.includes('cancelled')) badge = 'NR';
      else if (combinedStatus.includes('tied')) badge = 'T';
      else if (combinedStatus.includes('match drawn') || combinedStatus.includes('draw')) badge = 'D';
      else if (myNames.some(n => n.length >= 2 && combinedStatus.includes(`${n} won`))) badge = 'W';
      else if (oppNames.some(n => n.length >= 2 && combinedStatus.includes(`${n} won`))) badge = 'L';
      else {
        const r1 = parseInt(String(myTeam?.score || '').split('/')[0]?.replace(/[^\d]/g, ''), 10);
        const r2 = parseInt(String(oppTeam?.score || '').split('/')[0]?.replace(/[^\d]/g, ''), 10);
        if (!isNaN(r1) && !isNaN(r2) && (r1 > 0 || r2 > 0)) {
          badge = r1 > r2 ? 'W' : r2 > r1 ? 'L' : 'T';
        }
      }

      if (badge) {
        completedMatches.push({ ...m, _resultBadge: badge });
        if (formItems.length < 5) {
          formItems.push({
            result: badge,
            opp: oppTeam?.short_name || oppTeam?.name || 'OPP',
            score: myTeam?.score || '',
            oppScore: oppTeam?.score || '',
            date: m.start_time
          });
        }
      }
    });
  }

  if (formItems.length < 5 && teamProf?.last_five_results && Array.isArray(teamProf.last_five_results)) {
    teamProf.last_five_results.forEach(r => {
      if (formItems.length >= 5) return;
      const raw = typeof r === 'object' ? (r.result || r.outcome || r.status) : r;
      const upper = String(raw || '').toUpperCase().trim();
      let norm = null;
      if (upper === 'W' || upper.startsWith('WIN') || upper.startsWith('WON')) norm = 'W';
      else if (upper === 'L' || upper.startsWith('LOS')) norm = 'L';
      else if (upper === 'T' || upper.startsWith('TIE')) norm = 'T';
      else if (upper === 'D' || upper.startsWith('DRAW')) norm = 'D';
      else if (upper === 'NR' || upper === 'N/R' || upper.includes('NO RESULT')) norm = 'NR';
      if (norm) {
        formItems.push({
          result: norm,
          opp: typeof r === 'object' ? (r.opponent || r.vs || r.opp || '') : ''
        });
      }
    });
  }

  if (formItems.length === 0 && teamStats) {
    const w = parseInt(teamStats.matcheswon || teamStats.wins || 0, 10);
    const l = parseInt(teamStats.matcheslost || teamStats.losses || 0, 10);
    const t = parseInt(teamStats.matchestied || teamStats.ties || teamStats.noresult || 0, 10);
    const seq = [];
    let rw = w, rl = l, rt = t;
    while (seq.length < 5 && (rw > 0 || rl > 0 || rt > 0)) {
      if (rw > 0) { seq.push({ result: 'W', opp: '' }); rw--; }
      if (seq.length < 5 && rl > 0) { seq.push({ result: 'L', opp: '' }); rl--; }
      if (seq.length < 5 && rt > 0) { seq.push({ result: 'NR', opp: '' }); rt--; }
    }
    formItems.push(...seq);
  }

  return { formItems: formItems.slice(0, 5), completedMatches: completedMatches.slice(0, 5) };
};

// --- SOCCER HELPERS & DETAILED MATCH EVENTS EXTRACTOR ---
const getSafeFootballScore = (scoreData) => scoreData === null || scoreData === undefined ? '0' : typeof scoreData === 'object' ? scoreData.displayValue || scoreData.value || '0' : scoreData;

const getFootballMatchLeagueName = (m) => {
  if (m._leagueId && m._leagueId !== 'custom') {
    const found = FOOTBALL_LEAGUES.find(l => l.id === m._leagueId);
    if (found) return found.name;
  }
  return stripSeasonYear(m?.league?.name || m?.league?.shortName || m?.series || m?.season?.displayName || m?.competitions?.[0]?.notes?.[0]?.headline || "Match") || "Match";
};

const formatFootballShortName = (fullName) => {
  const cleaned = cleanPlayerName(fullName);
  if (!cleaned) return "Player";
  const parts = cleaned.split(/\s+/);
  return parts.length <= 1 ? cleaned : `${parts[0].charAt(0)}. ${parts[parts.length - 1]}`;
};

const formatMatchMinuteApostrophe = (rawVal) => {
  if (rawVal === null || rawVal === undefined) return null;
  const s = String(rawVal).trim();
  if (!s) return null;
  const cleaned = s.replace(/[’′]/g, "'");
  const m = cleaned.match(/(\d+(?:\s*\+\s*\d+)?)/);
  if (!m) return null;
  const token = m[1].replace(/\s+/g, '');
  return `${token}’`;
};

const extractFootballTime = (item) => {
  if (!item) return "0’";
  const txt = String(item.text || item.shortText || "").replace(/[’′]/g, "'").trim();

  const startMatch = txt.match(/^(\d+(?:\s*\+\s*\d+)?)\s*['’]?\s*(?:[-–—:]|\s|$)/);
  if (startMatch) {
    return `${startMatch[1].replace(/\s+/g, '')}’`;
  }

  const clockDisp = item.clock?.displayValue;
  if (clockDisp && String(clockDisp).trim() !== "0'" && String(clockDisp).trim() !== "0’") {
    const fmt = formatMatchMinuteApostrophe(clockDisp);
    if (fmt) return fmt;
  }

  const timeDisp = item.time?.displayValue;
  if (timeDisp && String(timeDisp).trim() !== "0'" && String(timeDisp).trim() !== "0’") {
    const fmt = formatMatchMinuteApostrophe(timeDisp);
    if (fmt) return fmt;
  }

  if (typeof item.clock?.value === 'number' && item.clock.value > 0) {
    const mins = Math.floor(item.clock.value / 60);
    return `${mins}’`;
  }

  const inlineMatch = txt.match(/\b(\d{1,3}(?:\+\d{1,2})?)['’]/);
  if (inlineMatch) {
    return `${inlineMatch[1]}’`;
  }

  return "0’";
};

const extractDetailedFootballEvents = (summary, homeComp, awayComp) => {
  const goals = [];
  const cards = [];
  const subs = [];
  if (!summary) return { goals, cards, subs };

  const homeTeamId = String(homeComp?.team?.id || summary?.rosters?.[0]?.team?.id || '');
  const awayTeamId = String(awayComp?.team?.id || summary?.rosters?.[1]?.team?.id || '');
  const homeTeamName = homeComp?.team?.shortDisplayName || homeComp?.team?.name || summary?.rosters?.[0]?.team?.displayName || 'Home';
  const awayTeamName = awayComp?.team?.shortDisplayName || awayComp?.team?.name || summary?.rosters?.[1]?.team?.displayName || 'Away';
  const homeLogo = getSafeFootballLogo(homeComp?.team || summary?.rosters?.[0]?.team);
  const awayLogo = getSafeFootballLogo(awayComp?.team || summary?.rosters?.[1]?.team);

  const playerTeamMap = new Map();
  (summary.rosters || []).forEach((r, idx) => {
    const isH = idx === 0;
    (r.roster || []).forEach(p => {
      const id = String(p.athlete?.id || '');
      const name = p.athlete?.displayName || p.athlete?.fullName || p.athlete?.shortName || '';
      if (id) playerTeamMap.set(id, { isHome: isH, teamName: isH ? homeTeamName : awayTeamName, teamLogo: isH ? homeLogo : awayLogo, jersey: p.jersey, name });
      if (name) playerTeamMap.set(name.toLowerCase(), { isHome: isH, teamName: isH ? homeTeamName : awayTeamName, teamLogo: isH ? homeLogo : awayLogo, jersey: p.jersey, name });
    });
  });

  const resolveSide = (ev, athlete) => {
    const tid = String(ev.team?.id || '');
    if (tid && tid === homeTeamId) return { isHome: true, teamName: homeTeamName, teamLogo: homeLogo };
    if (tid && tid === awayTeamId) return { isHome: false, teamName: awayTeamName, teamLogo: awayLogo };
    if (ev.team?.displayName || ev.team?.shortDisplayName) {
      const tn = String(ev.team.shortDisplayName || ev.team.displayName).toLowerCase();
      if (homeTeamName.toLowerCase().includes(tn) || tn.includes(homeTeamName.toLowerCase())) return { isHome: true, teamName: homeTeamName, teamLogo: homeLogo };
      if (awayTeamName.toLowerCase().includes(tn) || tn.includes(awayTeamName.toLowerCase())) return { isHome: false, teamName: awayTeamName, teamLogo: awayLogo };
    }
    const aid = String(athlete?.id || '');
    if (aid && playerTeamMap.has(aid)) return playerTeamMap.get(aid);
    const aname = String(athlete?.displayName || athlete?.shortName || '').toLowerCase();
    if (aname && playerTeamMap.has(aname)) return playerTeamMap.get(aname);
    return { isHome: true, teamName: homeTeamName, teamLogo: homeLogo };
  };

  const parseMinuteNum = (clockStr) => {
    if (!clockStr) return 0;
    const cleaned = String(clockStr).replace(/[’′]/g, "'");
    const m = cleaned.match(/(\d+)(?:\s*\+\s*(\d+))?/);
    if (!m) return 0;
    const base = parseInt(m[1], 10) || 0;
    const added = m[2] ? (parseInt(m[2], 10) || 0) : 0;
    return base * 100 + added;
  };

  const rawEvents = [
    ...(summary.scoringPlays || []),
    ...(summary.details || []),
    ...(summary.keyEvents || []),
    ...(summary.header?.competitions?.[0]?.details || [])
  ];

  const seenGoals = new Set();
  const seenCards = new Set();
  const seenSubs = new Set();

  rawEvents.forEach(ev => {
    const typeText = String(ev.type?.text || ev.text || ev.shortText || '').toLowerCase();
    const rawText = String(ev.text || ev.shortText || '').trim();
    const timeStr = extractFootballTime(ev);
    const minVal = parseMinuteNum(timeStr);
    const participants = ev.participants || ev.athletesInvolved || [];
    const p1 = participants[0]?.athlete || participants[0] || ev.athlete;
    const p2 = participants[1]?.athlete || participants[1];
    const side = resolveSide(ev, p1);

    const isGoal = (ev.scoringPlay || typeText.includes('goal') || typeText.includes('penalty - scored')) &&
      !typeText.includes('miss') && !typeText.includes('saved') && !typeText.includes('no goal') && !typeText.includes('attempt');

    if (isGoal) {
      let scorer = p1?.displayName || p1?.shortName || '';
      let assist = p2?.displayName || p2?.shortName || '';
      if (!scorer && rawText) {
        const m = rawText.match(/Goal!.*?\.\s*([^(\n]+?)\s*\(/i) || rawText.match(/^([^(\n]+?)\s*\d+'/i);
        if (m) scorer = m[1].trim();
      }
      if (!assist && rawText.toLowerCase().includes('assisted by')) {
        const am = rawText.match(/Assisted by\s+([^.\n,]+)/i);
        if (am) assist = am[1].trim();
      }
      const isOG = Boolean(ev.ownGoal || typeText.includes('own goal') || rawText.toLowerCase().includes('own goal'));
      const isPen = Boolean(ev.penaltyKick || typeText.includes('penalty') || rawText.toLowerCase().includes('penalty'));
      const key = `${timeStr}_${(scorer || rawText).toLowerCase()}`;
      if (!seenGoals.has(key)) {
        seenGoals.add(key);
        goals.push({ time: timeStr, min: minVal, scorer: scorer || 'Goalscorer', assist: assist || null, isOG, isPen, ...side });
      }
      return;
    }

    const isRed = Boolean(ev.redCard || typeText.includes('red card') || typeText.includes('second yellow'));
    const isYellow = !isRed && Boolean(ev.yellowCard || typeText.includes('yellow card') || typeText.includes('booking'));
    if (isRed || isYellow) {
      let player = p1?.displayName || p1?.shortName || '';
      if (!player && rawText) {
        const cm = rawText.match(/^([^(\n]+?)\s*\(/i);
        if (cm) player = cm[1].trim();
      }
      const key = `${timeStr}_${(player || rawText).toLowerCase()}_${isRed ? 'R' : 'Y'}`;
      if (!seenCards.has(key)) {
        seenCards.add(key);
        cards.push({ time: timeStr, min: minVal, player: player || 'Player', cardType: isRed ? 'red' : 'yellow', ...side });
      }
      return;
    }

    if (typeText.includes('substitut') || typeText.includes('sub')) {
      let playerIn = p1?.displayName || p1?.shortName || '';
      let playerOut = p2?.displayName || p2?.shortName || '';
      if (rawText) {
        const repMatch = rawText.match(/([A-Za-zÀ-ÿ\s.'-]+?)\s+replaces\s+([A-Za-zÀ-ÿ\s.'-]+)/i);
        if (repMatch) {
          playerIn = repMatch[1].replace(/^Substitution,.*?\.\s*/i, '').trim();
          playerOut = repMatch[2].replace(/\s*because of.*$/i, '').replace(/\.$/, '').trim();
        }
      }
      const key = `${timeStr}_${(playerIn || '').toLowerCase()}_${(playerOut || '').toLowerCase()}`;
      if ((playerIn || playerOut) && !seenSubs.has(key)) {
        seenSubs.add(key);
        subs.push({ time: timeStr, min: minVal, playerIn: playerIn || 'Sub In', playerOut: playerOut || 'Sub Out', ...side });
      }
    }
  });

  (summary.rosters || []).forEach((r, idx) => {
    const isH = idx === 0;
    const tName = isH ? homeTeamName : awayTeamName;
    const tLogo = isH ? homeLogo : awayLogo;

    (r.roster || []).forEach(p => {
      const pName = p.athlete?.displayName || p.athlete?.shortName || 'Player';
      (p.plays || []).forEach(play => {
        const t = String(play.type?.text || play.shortText || play.text || '').toLowerCase();
        const timeStr = play.clock?.displayValue || play.time?.displayValue || "0'";
        const minVal = parseMinuteNum(timeStr);

        if ((play.scoringPlay || t.includes('goal')) && seenGoals.size === 0) {
          const key = `${timeStr}_${pName.toLowerCase()}`;
          if (!seenGoals.has(key)) {
            seenGoals.add(key);
            goals.push({ time: timeStr, min: minVal, scorer: pName, assist: null, isOG: t.includes('own goal'), isPen: t.includes('penalty'), isHome: isH, teamName: tName, teamLogo: tLogo });
          }
        }
        if ((play.redCard || play.yellowCard || t.includes('yellow') || t.includes('red')) && seenCards.size === 0) {
          const isRed = Boolean(play.redCard || t.includes('red'));
          const key = `${timeStr}_${pName.toLowerCase()}_${isRed ? 'R' : 'Y'}`;
          if (!seenCards.has(key)) {
            seenCards.add(key);
            cards.push({ time: timeStr, min: minVal, player: pName, cardType: isRed ? 'red' : 'yellow', isHome: isH, teamName: tName, teamLogo: tLogo });
          }
        }
      });
    });
  });

  goals.sort((a, b) => a.min - b.min);
  cards.sort((a, b) => a.min - b.min);
  subs.sort((a, b) => a.min - b.min);

  return { goals, cards, subs };
};

const normalizeClubKey = (s) =>
  String(s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9\s.&'-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();

const findStadiumInDb = (namesToTry = []) => {
  const normalizedNames = namesToTry.map(normalizeClubKey).filter(Boolean);
  if (normalizedNames.length === 0) return null;

  const entries = Object.entries(FOOTBALL_STADIUM_DB);
  // 1. Exact normalized match
  for (const clean of normalizedNames) {
    for (const [key, val] of entries) {
      if (normalizeClubKey(key) === clean) return val;
    }
  }
  // 2. Safe substring match (keys >= 5 chars or word boundary)
  for (const clean of normalizedNames) {
    for (const [key, val] of entries) {
      const kNorm = normalizeClubKey(key);
      if (kNorm.length >= 5 && (clean.includes(kNorm) || (clean.length >= 5 && kNorm.includes(clean)))) {
        return val;
      }
    }
  }
  return null;
};

const extractHomeVenueFromSchedule = (events = [], teamId = null, teamNames = []) => {
  if (!Array.isArray(events) || events.length === 0) return null;
  const tidStr = teamId ? String(teamId) : '';
  const nameSet = new Set(teamNames.map(normalizeClubKey).filter(Boolean));
  let best = null;

  for (const ev of events) {
    const comp = ev?.competitions?.[0];
    const venue = comp?.venue || ev?.venue;
    if (!venue || (!venue.fullName && !venue.name)) continue;
    const homeComp = comp?.competitors?.find(c => c.homeAway === 'home');
    if (!homeComp) continue;

    const isSameTeam =
      (tidStr && String(homeComp.team?.id || '') === tidStr) ||
      nameSet.has(normalizeClubKey(homeComp.team?.displayName)) ||
      nameSet.has(normalizeClubKey(homeComp.team?.shortDisplayName)) ||
      nameSet.has(normalizeClubKey(homeComp.team?.name));

    if (!isSameTeam) continue;
    if (!best) best = venue;
    if (venue.fullName && (venue.address?.city || venue.city) && venue.capacity) {
      return venue;
    }
  }
  return best;
};

const buildFootballCommentaryFeed = (summary, corePlays = [], homeComp = null, awayComp = null) => {
  if (!summary && (!Array.isArray(corePlays) || corePlays.length === 0)) return [];

  const parseMinOrder = (it) => {
    const t = extractFootballTime(it).replace(/[’']/g, '');
    const parts = t.split('+').map(n => parseInt(n, 10) || 0);
    return (parts[0] || 0) * 100 + (parts[1] || 0);
  };

  const normalizeEntry = (ev) => {
    if (!ev) return null;
    const typeLabel = String(ev.type?.text || '').trim();
    const rawText = String(ev.text || ev.shortText || '').trim();
    const participants = (ev.participants || ev.athletesInvolved || [])
      .map(p => cleanPlayerName(p?.athlete?.displayName || p?.athlete?.shortName || p?.displayName || ''))
      .filter(Boolean);
    const teamName = ev.team?.shortDisplayName || ev.team?.displayName || '';

    let text = rawText;
    if (!text) {
      if (typeLabel && participants.length > 0) {
        text = teamName ? `${typeLabel} — ${participants.join(', ')} (${teamName})` : `${typeLabel} — ${participants.join(', ')}`;
      } else if (typeLabel) {
        text = teamName ? `${typeLabel} (${teamName})` : typeLabel;
      }
    }
    if (!text) return null;
    return {
      ...ev,
      text,
      shortText: ev.shortText || text,
      _typeLower: typeLabel.toLowerCase()
    };
  };

  // 1. Primary ESPN full text commentary (only if non-empty!)
  const commArr = Array.isArray(summary?.commentary) ? summary.commentary.map(normalizeEntry).filter(Boolean) : [];
  if (commArr.length > 0) {
    const list = [...commArr];
    if (list.length > 1 && parseMinOrder(list[0]) < parseMinOrder(list[list.length - 1])) list.reverse();
    return list;
  }

  // 2. ESPN Core Play-by-Play feed (covers leagues where summary.commentary is omitted)
  const playsArr = Array.isArray(corePlays) ? corePlays.map(normalizeEntry).filter(Boolean) : [];
  if (playsArr.length > 0) {
    const list = [...playsArr];
    if (list.length > 1 && parseMinOrder(list[0]) < parseMinOrder(list[list.length - 1])) list.reverse();
    return list;
  }

  // 3. ESPN keyEvents (goals, cards, subs, penalties, VAR, kickoff/HT/FT)
  const keyArr = Array.isArray(summary?.keyEvents) ? summary.keyEvents.map(normalizeEntry).filter(Boolean) : [];
  if (keyArr.length > 0) {
    const list = [...keyArr];
    if (list.length > 1 && parseMinOrder(list[0]) < parseMinOrder(list[list.length - 1])) list.reverse();
    return list;
  }

  // 4. Synthesized timeline from scoringPlays, header.competitions[0].details, details, and roster plays
  const { goals, cards, subs } = extractDetailedFootballEvents(summary, homeComp, awayComp);
  const synthesized = [];

  goals.forEach(g => {
    const tag = g.isPen ? ' (Penalty)' : g.isOG ? ' (Own Goal)' : '';
    const assistTxt = g.assist ? ` Assisted by ${cleanPlayerName(g.assist)}.` : '';
    synthesized.push({
      clock: { displayValue: g.time },
      text: `Goal! ${cleanPlayerName(g.scorer)}${tag} scores for ${g.teamName}.${assistTxt}`,
      _typeLower: 'goal',
      _minSort: g.min
    });
  });

  subs.forEach(s => {
    synthesized.push({
      clock: { displayValue: s.time },
      text: `Substitution (${s.teamName}): ${cleanPlayerName(s.playerIn)} replaces ${cleanPlayerName(s.playerOut)}.`,
      _typeLower: 'substitution',
      _minSort: s.min
    });
  });

  cards.forEach(c => {
    const label = c.cardType === 'red' ? 'Red card' : 'Yellow card';
    synthesized.push({
      clock: { displayValue: c.time },
      text: `${label} shown to ${cleanPlayerName(c.player)} (${c.teamName}).`,
      _typeLower: c.cardType === 'red' ? 'red card' : 'yellow card',
      _minSort: c.min
    });
  });

  if (synthesized.length > 0) {
    const matchState = String(summary?.header?.competitions?.[0]?.status?.type?.state || '').toLowerCase();
    if (matchState === 'post') {
      synthesized.push({
        clock: { displayValue: "90’" },
        text: `Full Time — ${summary?.header?.competitions?.[0]?.status?.type?.detail || 'Match ended'}.`,
        _typeLower: 'fulltime',
        _minSort: 99999
      });
    }
    synthesized.sort((a, b) => (b._minSort || 0) - (a._minSort || 0));
  }

  return synthesized;
};

const lookupFootballStadium = (namesToTry = [], apiVenue = null, scheduleVenue = null) => {
  const dbMatch = findStadiumInDb(namesToTry);
  const v = (apiVenue?.fullName || apiVenue?.name) ? apiVenue : (scheduleVenue?.fullName || scheduleVenue?.name) ? scheduleVenue : null;

  if (v) {
    const cityStr = v.address?.city || v.city || dbMatch?.city || v.address?.country || 'Home Ground';
    return {
      stadium: v.fullName || v.name || dbMatch?.name || 'Home Stadium',
      city: cityStr,
      capacity: v.capacity || dbMatch?.cap || null,
      stadiumImage: v.images?.[0]?.href || apiVenue?.images?.[0]?.href || scheduleVenue?.images?.[0]?.href || null
    };
  }
  if (dbMatch) {
    return { stadium: dbMatch.name, city: dbMatch.city, capacity: dbMatch.cap, stadiumImage: null };
  }
  return { stadium: 'Home Stadium', city: 'Venue TBD', capacity: null, stadiumImage: null };
};

const extractFootballStandingEntry = (stdRes, teamId, teamName) => {
  if (!stdRes) return null;
  let allEntries = [];
  if (stdRes?.children) {
    stdRes.children.forEach(c => {
      const groupName = c.name || c.abbreviation || 'League';
      const ents = c.standings?.entries || c.entries || [];
      ents.forEach((e, idx) => allEntries.push({ ...e, _groupName: groupName, _computedRank: idx + 1 }));
    });
  } else if (stdRes?.standings?.entries) {
    stdRes.standings.entries.forEach((e, idx) => allEntries.push({ ...e, _groupName: stdRes.name || 'League Standings', _computedRank: idx + 1 }));
  } else if (stdRes?.entries) {
    stdRes.entries.forEach((e, idx) => allEntries.push({ ...e, _groupName: 'League Standings', _computedRank: idx + 1 }));
  }

  return allEntries.find(e => {
    if (teamId && String(e.team?.id) === String(teamId)) return true;
    if (teamName) {
      const n = String(teamName).toLowerCase();
      return String(e.team?.displayName || '').toLowerCase() === n || String(e.team?.shortDisplayName || '').toLowerCase() === n;
    }
    return false;
  }) || null;
};

// 🏆 CURRENT SEASON & MULTI-STAGE KNOCKOUT BRACKET ENGINE

const getSeasonMetaFromYear = (yearNum, isSplitYearSport = true) => {
  const y = Number(yearNum);
  return {
    year: y,
    label: isSplitYearSport ? `${y}-${String((y + 1) % 100).padStart(2, '0')}` : String(y)
  };
};

const isFootballSeasonCurrent = (leagueId, stdJson, now = new Date()) => {
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();
  const expectedStartYear = currentMonth >= 6 ? currentYear : currentYear - 1;
  const leagueMeta = FOOTBALL_LEAGUES.find(l => l.id === leagueId);
  const isSplit = leagueMeta ? leagueMeta.isSplitSeason : true;
  const defaultYearLabel = getSeasonMetaFromYear(isSplit ? expectedStartYear : currentYear, isSplit).label;

  const rawSeason = stdJson?.seasons?.[0] || stdJson?.children?.[0]?.seasons?.[0] || stdJson?.standings?.season || null;
  const apiYear = rawSeason?.year ? Number(rawSeason.year) : null;
  const apiStart = rawSeason?.startDate ? new Date(rawSeason.startDate) : null;
  const apiEnd = rawSeason?.endDate ? new Date(rawSeason.endDate) : null;
  // Strictly extract ONLY the concise year token (never full league names)
  const apiCleanYear = extractSeasonYear(rawSeason?.displayName || stdJson?.season?.displayName || stdJson?.name || '');

  if (apiStart && apiEnd && !isNaN(apiStart) && !isNaN(apiEnd)) {
    const startWithGrace = new Date(apiStart);
    startWithGrace.setDate(startWithGrace.getDate() - 45);
    const endWithGrace = new Date(apiEnd);
    endWithGrace.setDate(endWithGrace.getDate() + 45);
    if (now >= startWithGrace && now <= endWithGrace) {
      return {
        isCurrent: true,
        seasonLabel: apiCleanYear || getSeasonMetaFromYear(apiYear || (isSplit ? expectedStartYear : currentYear), isSplit).label
      };
    }
    if (now > endWithGrace) {
      return { isCurrent: false, seasonLabel: defaultYearLabel };
    }
  }

  if (apiYear) {
    if (isSplit) {
      const isMatch = apiYear === expectedStartYear || apiYear === expectedStartYear + 1;
      return { isCurrent: isMatch, seasonLabel: apiCleanYear || defaultYearLabel };
    } else {
      const isMatch = apiYear === currentYear;
      return { isCurrent: isMatch, seasonLabel: apiCleanYear || String(currentYear) };
    }
  }

  return { isCurrent: true, seasonLabel: apiCleanYear || defaultYearLabel };
};

const isCricketTournamentCurrent = (leagueObj, allSched = [], now = new Date()) => {
  const rawTitle = String(leagueObj?.league || '').trim();
  if (!rawTitle || CRICKET_DOMESTIC_LEAGUE_REGEX.test(rawTitle.toLowerCase())) {
    return { isCurrent: false, seasonLabel: '', cleanTitle: rawTitle };
  }

  const currentYear = now.getFullYear();
  const explicitLabel = extractSeasonYear(rawTitle);
  const explicitYear = explicitLabel ? parseInt(explicitLabel.slice(0, 4), 10) : null;

  if (explicitYear && (explicitYear < currentYear - 1 || explicitYear > currentYear + 1)) {
    return { isCurrent: false, seasonLabel: explicitLabel, cleanTitle: stripSeasonYear(rawTitle) };
  }

  const cleanTitle = stripSeasonYear(rawTitle);
  const lowerClean = cleanTitle.toLowerCase();
  const matchingFixtures = (Array.isArray(allSched) ? allSched : []).filter(m => {
    const mSeries = String(m.league || m.series || m.title || '').toLowerCase();
    return mSeries && (mSeries.includes(lowerClean) || lowerClean.includes(mSeries));
  });

  if (matchingFixtures.length > 0) {
    const timestamps = matchingFixtures.map(m => new Date(m.start_time).getTime()).filter(ts => !isNaN(ts));
    if (timestamps.length > 0) {
      const minTs = Math.min(...timestamps);
      const maxTs = Math.max(...timestamps);
      const nowTs = now.getTime();
      const windowMs = 45 * 24 * 60 * 60 * 1000;
      if (nowTs < (minTs - windowMs) || nowTs > (maxTs + windowMs)) {
        return { isCurrent: false, seasonLabel: explicitLabel || String(currentYear), cleanTitle };
      }
    }
  } else if (explicitYear && explicitYear !== currentYear) {
    return { isCurrent: false, seasonLabel: explicitLabel, cleanTitle };
  }

  return { isCurrent: true, seasonLabel: explicitLabel || String(currentYear), cleanTitle };
};

const classifyKnockoutStage = (text) => {
  const t = String(text || '').toLowerCase();
  if (/(round of 32|last 32|r32|1\/16)/i.test(t)) return 'R32';
  if (/(wild card|wildcard)/i.test(t)) return 'WC';
  if (/(knockout round play-offs|knockout play-off)/i.test(t)) return 'KPO';
  if (/(round one|round 1)/i.test(t) && !t.includes('quarter') && !t.includes('semi')) return 'R1';
  if (/(round of 16|last 16|r16|1\/8|eighth)/i.test(t) && !t.includes('quarter') && !t.includes('semi')) return 'R16';
  if (/(3rd place|third place|bronze medal)/i.test(t)) return '3RD';
  if (/(super 8|super eight)/i.test(t)) return 'S8';
  if (/(qualifier 1|1st qualifier)/i.test(t)) return 'Q1';
  if (/(eliminator)/i.test(t)) return 'EL';
  if (/(qualifier 2|2nd qualifier|challenger)/i.test(t)) return 'Q2';
  if (/(quarter-final|quarterfinal|quarter final|quarters|\bqf\b|1\/4|conference semifinal)/i.test(t)) return 'QF';
  if (/(semi-final|semifinal|semi final|semis|\bsf\b|1\/2|conference final)/i.test(t) && !t.includes('conference semifinal')) return 'SF';
  if (/(\bfinal\b|championship|mls cup|summit clash)/i.test(t) && !t.includes('quarter') && !t.includes('semi') && !t.includes('1/') && !t.includes('conference')) return 'FINAL';
  return null;
};

const buildTbdKnockouts = (stageDef, startIndex) => {
  const ties = [];
  const tbdLogo = getFallbackLogo('TBD', ['#1C1C1E', '#2C2C2E', 'TBD']);
  const prefix = stageDef.feeder === 'SF Loser' ? 'Loser SF' : stageDef.feeder ? `Winner ${stageDef.feeder}` : 'TBD';

  for (let idx = startIndex; idx < stageDef.slots; idx++) {
    let homeLabel = 'TBD';
    let awayLabel = 'TBD';

    if (stageDef.id === 'Q1') {
      homeLabel = '1st Place (TBD)';
      awayLabel = '2nd Place (TBD)';
    } else if (stageDef.id === 'EL') {
      homeLabel = '3rd Place (TBD)';
      awayLabel = '4th Place (TBD)';
    } else if (stageDef.id === 'Q2') {
      homeLabel = 'Loser Qualifier 1';
      awayLabel = 'Winner Eliminator';
    } else if (stageDef.id === '3RD') {
      homeLabel = 'Loser SF 1';
      awayLabel = 'Loser SF 2';
    } else if (stageDef.feeder && stageDef.feeder !== 'Group' && stageDef.feeder !== 'League' && stageDef.feeder !== 'Conf' && stageDef.feeder !== 'Seed' && stageDef.feeder !== 'Q1/Q2') {
      homeLabel = `${prefix} ${idx * 2 + 1}`;
      awayLabel = `${prefix} ${idx * 2 + 2}`;
    } else if (stageDef.feeder === 'Q1/Q2') {
      homeLabel = 'Winner Qualifier 1';
      awayLabel = 'Winner Qualifier 2';
    } else {
      homeLabel = `Qualifier ${idx * 2 + 1} (TBD)`;
      awayLabel = `Qualifier ${idx * 2 + 2} (TBD)`;
    }

    ties.push({
      id: `tbd_${stageDef.id}_${idx}`,
      note: stageDef.slots > 1 ? `${stageDef.label} • Match ${idx + 1}` : stageDef.label,
      status: 'TBD',
      isTBD: true,
      home: { name: homeLabel, logo: tbdLogo, score: '—', winner: false, team: null, isTBD: true },
      away: { name: awayLabel, logo: tbdLogo, score: '—', winner: false, team: null, isTBD: true },
      rawEvent: null
    });
  }
  return ties;
};

const extractFootballKnockouts = async (leagueId, seasonLabel) => {
  const cacheKey = `soccer|${leagueId}|${seasonLabel}`;
  if (knockoutCache.has(cacheKey)) return knockoutCache.get(cacheKey);

  const template = TOURNAMENT_STAGE_TEMPLATES[leagueId];
  if (!template) return [];

  const stageMap = {};
  template.forEach(st => { stageMap[st.id] = []; });

  try {
    const res = await fetchWithCache(`${API_SOCCER_SCORE_BASE}/${leagueId}/scoreboard`).catch(() => null);
    (res?.events || []).forEach(ev => {
      const comp = ev.competitions?.[0];
      const note = comp?.notes?.[0]?.headline || '';
      const slug = ev.season?.slug || comp?.type?.text || '';
      const seriesTitle = comp?.series?.title || '';
      const stageId = classifyKnockoutStage(`${note} ${slug} ${seriesTitle}`);
      if (!stageId || !stageMap[stageId]) return;

      const h = comp?.competitors?.find(c => c.homeAway === 'home');
      const a = comp?.competitors?.find(c => c.homeAway === 'away');
      if (!h || !a) return;

      const state = ev.status?.type?.state;
      const isPre = state === 'pre';
      const isPost = state === 'post';
      const hName = h.team?.shortDisplayName || h.team?.name || 'TBD';
      const aName = a.team?.shortDisplayName || a.team?.name || 'TBD';
      const hIsTbd = !h.team?.id || hName.toUpperCase() === 'TBD';
      const aIsTbd = !a.team?.id || aName.toUpperCase() === 'TBD';

      const hScore = isPre ? '—' : getSafeFootballScore(h.score);
      const aScore = isPre ? '—' : getSafeFootballScore(a.score);
      const aggH = !isPre ? (h.aggregateScore?.value ?? h.aggregateScore?.displayValue) : null;
      const aggA = !isPre ? (a.aggregateScore?.value ?? a.aggregateScore?.displayValue) : null;
      const hNum = parseFloat(aggH ?? hScore);
      const aNum = parseFloat(aggA ?? aScore);

      stageMap[stageId].push({
        id: ev.id,
        stageId,
        note: stripSeasonYear(note || seriesTitle || stageId),
        date: ev.date,
        status: isPre ? (ev.date ? getFavFormattedDate(ev.date, false) : 'TBD') : (ev.status?.type?.shortDetail || 'FT'),
        state,
        isTBD: hIsTbd && aIsTbd,
        home: {
          name: hName,
          logo: hIsTbd ? getFallbackLogo('TBD', ['#1C1C1E', '#2C2C2E', 'TBD']) : getSafeFootballLogo(h.team),
          score: aggH !== undefined && aggH !== null ? `${hScore} (${aggH})` : hScore,
          winner: Boolean(isPost && (h.winner || h.advance || (!isNaN(hNum) && !isNaN(aNum) && hNum > aNum))),
          team: hIsTbd ? null : h.team,
          isTBD: hIsTbd
        },
        away: {
          name: aName,
          logo: aIsTbd ? getFallbackLogo('TBD', ['#1C1C1E', '#2C2C2E', 'TBD']) : getSafeFootballLogo(a.team),
          score: aggA !== undefined && aggA !== null ? `${aScore} (${aggA})` : aScore,
          winner: Boolean(isPost && (a.winner || a.advance || (!isNaN(aNum) && !isNaN(hNum) && aNum > hNum))),
          team: aIsTbd ? null : a.team,
          isTBD: aIsTbd
        },
        rawEvent: hIsTbd && aIsTbd ? null : { ...ev, _leagueId: leagueId }
      });
    });
  } catch {}

  const built = template.map(st => {
    const liveTies = stageMap[st.id] || [];
    const filledTies = liveTies.length < st.slots
      ? [...liveTies, ...buildTbdKnockouts(st, liveTies.length)]
      : liveTies;
    return {
      id: st.id,
      label: st.label,
      short: st.short,
      matches: filledTies,
      hasScheduled: liveTies.length > 0
    };
  });

  knockoutCache.set(cacheKey, built);
  return built;
};

const extractCricketKnockouts = (selectedLeague) => {
  if (!selectedLeague) return [];
  const cacheKey = `cricket_v7|${selectedLeague.id}|${selectedLeague.seasonLabel}|${selectedLeague.allSched?.length || 0}`;
  if (knockoutCache.has(cacheKey)) return knockoutCache.get(cacheKey);

  const template = getCricketStageTemplate(selectedLeague.cleanTitle || selectedLeague.title);
  const lTitle = String(selectedLeague.cleanTitle || selectedLeague.title || '').toLowerCase();
  const shortL = getShortLeagueName(selectedLeague.cleanTitle || selectedLeague.title).toLowerCase();

  const stageMap = {};
  template.forEach(st => { stageMap[st.id] = []; });
  const seenMatchIds = new Set();

  (selectedLeague.allSched || []).forEach(m => {
    if (!m?.match_id || seenMatchIds.has(m.match_id)) return;
    const mLeague = String(m.league || m.series || '').toLowerCase();
    if (!mLeague.includes(lTitle) && !lTitle.includes(mLeague) && (!shortL || !mLeague.includes(shortL))) return;

    const combinedText = `${m.title || ''} ${m.match_title || ''}`;
    if (/(group [a-h]|league match|^\d+(st|nd|rd|th) match|match \d+)/i.test(combinedText) && !/(semi-?final|quarter-?final|eliminator|qualifier|final)/i.test(combinedText)) {
      return;
    }

    const stageId = classifyKnockoutStage(combinedText);
    if (!stageId || !stageMap[stageId] || !m.teams || m.teams.length < 2) return;

    seenMatchIds.add(m.match_id);
    const h = m.teams[0];
    const a = m.teams[1];
    const isPre = m.status === 'PRE' || m.status === 'SCHEDULED' || (!h.score && !a.score);
    const isPost = m.status === 'POST' || m.status === 'FINAL' || m.status === 'COMPLETED' || /won by|match tied|super over|result/i.test(String(m.status_text || ''));

    const hName = h.short_name || h.name || 'TBD';
    const aName = a.short_name || a.name || 'TBD';
    const hIsTbd = hName.toUpperCase() === 'TBD' || hName.toUpperCase() === 'TBC';
    const aIsTbd = aName.toUpperCase() === 'TBD' || aName.toUpperCase() === 'TBC';

    const stLower = String(m.status_text || m.match_update || '').toLowerCase();
    const hNames = [h.name, h.short_name].filter(Boolean).map(s => s.toLowerCase());
    const aNames = [a.name, a.short_name].filter(Boolean).map(s => s.toLowerCase());
    const hWin = isPost && hNames.some(n => n.length >= 2 && stLower.includes(`${n} won`));
    const aWin = isPost && aNames.some(n => n.length >= 2 && stLower.includes(`${n} won`));

    stageMap[stageId].push({
      id: m.match_id,
      stageId,
      note: stripSeasonYear(m.title || stageId),
      date: m.start_time,
      isPost,
      status: isPre ? (m.start_time ? getFavFormattedDate(m.start_time, false) : 'TBD') : (m.status_text || m.status || 'LIVE'),
      isTBD: hIsTbd && aIsTbd,
      home: {
        name: hName,
        logo: hIsTbd ? getFallbackLogo('TBD', ['#1C1C1E', '#2C2C2E', 'TBD']) : getCricketLogo(h),
        score: isPre ? '—' : (h.score || '—'),
        winner: hWin,
        team: hIsTbd ? null : h,
        isTBD: hIsTbd
      },
      away: {
        name: aName,
        logo: aIsTbd ? getFallbackLogo('TBD', ['#1C1C1E', '#2C2C2E', 'TBD']) : getCricketLogo(a),
        score: isPre ? '—' : (a.score || '—'),
        winner: aWin,
        team: aIsTbd ? null : a,
        isTBD: aIsTbd
      },
      rawEvent: hIsTbd && aIsTbd ? null : m
    });
  });

  const finalMatches = stageMap.FINAL || [];
  const isFinalCompleted = finalMatches.length > 0 && finalMatches.every(m => !m.isTBD && m.isPost);

  const built = template.map(st => {
    const liveTies = (stageMap[st.id] || [])
      .filter(m => !m.isTBD)
      .sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));
    const cappedTies = st.id === 'FINAL' && liveTies.length > 1 ? liveTies.slice(-1) : liveTies;
    const filledTies = (!isFinalCompleted && cappedTies.length < st.slots)
      ? [...cappedTies, ...buildTbdKnockouts(st, cappedTies.length)]
      : cappedTies;
    return {
      id: st.id,
      label: st.label,
      short: st.short,
      matches: filledTies,
      hasScheduled: cappedTies.length > 0
    };
  }).filter(st => !isFinalCompleted || st.matches.length > 0);

  knockoutCache.set(cacheKey, built);
  return built;
};
