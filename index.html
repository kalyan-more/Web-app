function App() {
  const [activeSport, setActiveSport] = useState('soccer');
  const [view, setView] = useState('scores');
  const [viewDir, setViewDir] = useState(0);
  const [date, setDate] = useState(() => new Date());
  const [dateDir, setDateDir] = useState(1);

  const handleSelectDateSmooth = useCallback((nextDate) => {
    setDate(prev => {
      const prevDay = new Date(prev.getFullYear(), prev.getMonth(), prev.getDate()).getTime();
      const nextDay = new Date(nextDate.getFullYear(), nextDate.getMonth(), nextDate.getDate()).getTime();
      if (nextDay !== prevDay) setDateDir(nextDay > prevDay ? 1 : -1);
      return nextDate;
    });
  }, []);
  const [, startTransition] = useTransition();

  const [footballState, setFootballState] = useState({ dateKey: '', items: [] });
  const [cricketState, setCricketState] = useState({ dateKey: '', items: [] });
  const [favMatches, setFavMatches] = useState([]);
  const [loading, setLoading] = useState(false);
  const [refreshTick, setRefreshTick] = useState(0);
  const scheduleContainerRef = useRef(null);

  // Zero-rerender Pull-to-Refresh DOM refs (60/120fps drag without calling setState)
  const pullWrapRef = useRef(null);
  const pullIconRef = useRef(null);
  const pullTextRef = useRef(null);
  const [isRefreshing, setIsRefreshing] = useState(false);

  const setPullVisual = useCallback((dy, animate = false) => {
    const wrap = pullWrapRef.current;
    if (!wrap) return;
    wrap.style.transition = animate
      ? 'height 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.14s ease'
      : 'none';
    wrap.style.height = `${dy}px`;
    wrap.style.opacity = dy > 4 ? '1' : '0';
    const progress = Math.min(1, dy / 54);
    if (pullIconRef.current) {
      pullIconRef.current.style.transform = `translate3d(0,0,0) rotate(${progress * 270}deg)`;
    }
    if (pullTextRef.current) {
      pullTextRef.current.textContent = progress >= 1 ? 'RELEASE TO REFRESH' : 'PULL TO REFRESH';
    }
  }, []);

  useEffect(() => {
    if (isRefreshing) {
      setPullVisual(50, true);
    } else {
      setPullVisual(0, true);
    }
  }, [isRefreshing, setPullVisual]);

  useEffect(() => {
    if (typeof window !== 'undefined' && typeof window.__dismissSidelineSplash === 'function') {
      window.__dismissSidelineSplash();
    }
  }, []);

  const [activeMatch, setActiveMatch] = useState(null);
  const [activeTeam, setActiveTeam] = useState(null);

  const [favoritesList, setFavoritesList] = useState(() => {
    try {
      const savedUnified = JSON.parse(localStorage.getItem('sideline_unified_favorites') || 'null');
      const map = new Map();
      if (Array.isArray(savedUnified)) {
        savedUnified.forEach(item => {
          if (item && item.id && (item.sport === 'soccer' || item.sport === 'cricket')) {
            const idStr = String(item.id);
            map.set(`${item.sport}:${idStr}`, { id: idStr, sport: item.sport });
          }
        });
      }
      const legacySoccer = JSON.parse(localStorage.getItem('fav_teams') || '[]');
      if (Array.isArray(legacySoccer)) {
        legacySoccer.forEach(id => {
          if (id) {
            const idStr = String(id);
            map.set(`soccer:${idStr}`, { id: idStr, sport: 'soccer' });
          }
        });
      }
      const legacyCricket = JSON.parse(localStorage.getItem('fav_cricket_teams') || '[]');
      if (Array.isArray(legacyCricket)) {
        legacyCricket.forEach(id => {
          if (id) {
            const idStr = String(id);
            map.set(`cricket:${idStr}`, { id: idStr, sport: 'cricket' });
          }
        });
      }
      const migrated = Array.from(map.values());
      localStorage.setItem('sideline_unified_favorites', JSON.stringify(migrated));
      return migrated;
    } catch {
      return [];
    }
  });

  const persistUnifiedFavorites = useCallback((nextList) => {
    try {
      localStorage.setItem('sideline_unified_favorites', JSON.stringify(nextList));
      localStorage.setItem('fav_teams', JSON.stringify(nextList.filter(f => f.sport === 'soccer').map(f => f.id)));
      localStorage.setItem('fav_cricket_teams', JSON.stringify(nextList.filter(f => f.sport === 'cricket').map(f => f.id)));
    } catch {}
  }, []);

  const toggleFavorite = useCallback((sport, teamId) => {
    if (!teamId || !sport) return;
    const idStr = String(teamId);
    setFavoritesList(prev => {
      const exists = prev.some(f => f.sport === sport && String(f.id) === idStr);
      const next = exists
        ? prev.filter(f => !(f.sport === sport && String(f.id) === idStr))
        : [...prev, { id: idStr, sport }];
      persistUnifiedFavorites(next);
      return next;
    });
  }, [persistUnifiedFavorites]);

  const footballFavs = useMemo(
    () => favoritesList.filter(f => f.sport === 'soccer').map(f => f.id),
    [favoritesList]
  );
  const cricketFavs = useMemo(
    () => favoritesList.filter(f => f.sport === 'cricket').map(f => f.id),
    [favoritesList]
  );

  const toggleFootballFav = useCallback((teamId) => toggleFavorite('soccer', teamId), [toggleFavorite]);
  const toggleCricketFav = useCallback((teamId) => toggleFavorite('cricket', teamId), [toggleFavorite]);

  const dates = useMemo(() => {
    const r = [];
    for (let i = -10; i <= 10; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      r.push(d);
    }
    return r;
  }, []);

  const stepScoreDate = useCallback((deltaDays) => {
    setDateDir(deltaDays >= 0 ? 1 : -1);
    setDate(prev => {
      const next = new Date(prev);
      next.setDate(next.getDate() + deltaDays);
      return next;
    });
  }, []);

  const fetchSeqRef = useRef(0);

  const getCachedFootballForDateKey = useCallback((isoDateKey) => {
    const ds = isoDateKey.replace(/-/g, '');
    let hitCount = 0;
    const events = [];
    FOOTBALL_LEAGUES.forEach(l => {
      const c = getCachedSync(`${API_SOCCER_SCORE_BASE}/${l.id}/scoreboard?dates=${ds}`);
      if (c) {
        hitCount++;
        if (c.events) events.push(...c.events.map(e => ({ ...e, _leagueId: l.id })));
      }
    });
    return hitCount > 0 ? events : null;
  }, []);

  const activeViewKeyRef = useRef('');
  const lastCricketScheduleFetchRef = useRef(0);
  const todayCricketArchiveRef = useRef(loadTodayCricketArchive());

  const getAllCachedCricketSchedules = useCallback(() => {
    // Ordered oldest/widest -> most recent so fresh primary schedule always wins
    return [
      ...extractCricketArray(getCachedSync(`${API_CRICKET_BASE}/schedule?days_past=45&days_ahead=30`)),
      ...extractCricketArray(getCachedSync(`${API_CRICKET_BASE}/schedule?days_past=30&days_ahead=30`)),
      ...extractCricketArray(getCachedSync(`${API_CRICKET_BASE}/schedule?days_past=3&days_ahead=4`)),
      ...extractCricketArray(getCachedSync(CRICKET_SCHEDULE_EXT_URL)),
      ...extractCricketArray(getCachedSync(CRICKET_SCHEDULE_URL))
    ];
  }, []);

  const getCachedCricketForDate = useCallback((targetDate) => {
    const isViewingToday = isSameDay(targetDate, new Date());
    const cachedLive = getCachedSync(`${API_CRICKET_BASE}/live`);
    const combinedSched = getAllCachedCricketSchedules();
    const archive = isViewingToday ? todayCricketArchiveRef.current : [];
    if (!cachedLive && combinedSched.length === 0 && archive.length === 0) return null;
    const merged = mergeCricketSources(combinedSched, cachedLive, archive, isViewingToday);
    return filterAndSortCricketForDate(merged, targetDate);
  }, [getAllCachedCricketSchedules]);

  const fetchFootballMatches = useCallback(async (isSilent = false, forceRefresh = false) => {
    const dateKey = toLocalIsoDate(date);
    const expectedKey = `soccer|${dateKey}`;
    activeViewKeyRef.current = expectedKey;
    const reqId = isSilent ? fetchSeqRef.current : ++fetchSeqRef.current;
    const ds = dateKey.replace(/-/g, '');
    const cachedEvents = !forceRefresh ? getCachedFootballForDateKey(dateKey) : null;

    if (cachedEvents !== null) {
      setFootballState({ dateKey, items: cachedEvents });
      setLoading(false);
    } else if (!isSilent) {
      setLoading(true);
    }

    try {
      const results = await Promise.all(
        FOOTBALL_LEAGUES.map(l =>
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${l.id}/scoreboard?dates=${ds}`, isSilent || forceRefresh)
            .then(data => (data.events || []).map(e => ({ ...e, _leagueId: l.id })))
            .catch(() => [])
        )
      );
      if (activeViewKeyRef.current !== expectedKey || (!isSilent && reqId !== fetchSeqRef.current)) return;
      const nextEvents = results.flat();
      startTransition(() => setFootballState({ dateKey, items: nextEvents }));
    } catch {
      if (activeViewKeyRef.current !== expectedKey) return;
      if (!isSilent && cachedEvents === null) setFootballState({ dateKey, items: [] });
    } finally {
      if (activeViewKeyRef.current === expectedKey && !isSilent) setLoading(false);
    }
  }, [date, getCachedFootballForDateKey, startTransition]);

  const fetchCricketMatches = useCallback(async (isSilent = false, forceRefresh = false) => {
    const dateKey = toLocalIsoDate(date);
    const expectedKey = `cricket|${dateKey}`;
    activeViewKeyRef.current = expectedKey;
    const reqId = isSilent ? fetchSeqRef.current : ++fetchSeqRef.current;
    const now = new Date();
    const isViewingToday = isSameDay(date, now);
    const dayDiff = Math.round((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    const needExtendedRender = dayDiff < -5 || dayDiff > 5;
    const cachedItems = !forceRefresh ? getCachedCricketForDate(date) : null;

    if (cachedItems !== null) {
      setCricketState({ dateKey, items: cachedItems });
      setLoading(false);
    } else if (!isSilent) {
      setLoading(true);
    }

    // Don't hammer Render's /schedule endpoint every 15s during silent live polls:
    // Poll /live every 15s, and force-refresh /schedule at most once every 60s (or immediately on pull-to-refresh)
    const shouldRefreshSchedule = forceRefresh || !isSilent || (Date.now() - lastCricketScheduleFetchRef.current > 60000);

    const fetchRenderWithRetry = async (url, force) => {
      try {
        return await fetchWithCache(url, force, 25000);
      } catch {
        return await fetchWithCache(url, true, 25000).catch(() => []);
      }
    };

    try {
      const [schedRes, liveRes, schedExtRes] = await Promise.all([
        fetchRenderWithRetry(CRICKET_SCHEDULE_URL, forceRefresh || (isSilent && shouldRefreshSchedule)),
        isViewingToday ? fetchRenderWithRetry(`${API_CRICKET_BASE}/live`, isSilent || forceRefresh) : Promise.resolve([]),
        needExtendedRender ? fetchRenderWithRetry(CRICKET_SCHEDULE_EXT_URL, forceRefresh) : Promise.resolve([])
      ]);
      if (activeViewKeyRef.current !== expectedKey || (!isSilent && reqId !== fetchSeqRef.current)) return;

      const freshSched = extractCricketArray(schedRes);
      const freshExt = extractCricketArray(schedExtRes);
      const freshLive = extractCricketArray(liveRes);
      if (freshSched.length > 0 && shouldRefreshSchedule) {
        lastCricketScheduleFetchRef.current = Date.now();
      }

      // Priority: older cached schedules first -> fresh extended -> fresh primary schedule LAST (so fresh always wins!)
      const primarySched = [
        ...getAllCachedCricketSchedules(),
        ...freshExt,
        ...freshSched
      ];

      const archivePool = isViewingToday ? todayCricketArchiveRef.current : [];
      const merged = mergeCricketSources(primarySched, freshLive, archivePool, isViewingToday);
      const finalFiltered = filterAndSortCricketForDate(merged, date);

      if (isViewingToday && finalFiltered.length > 0) {
        todayCricketArchiveRef.current = finalFiltered;
        saveTodayCricketArchive(finalFiltered);

        // If a match was live earlier today and dropped off /live before /schedule marked it finished,
        // silently fetch its final result from Render /match/{id} so finished scores stay accurate.
        const liveIdSet = new Set(freshLive.map(m => String(m.match_id ?? m.id ?? '')));
        const staleLiveMatches = finalFiltered.filter(m => {
          const mid = String(m.match_id || '');
          return mid && !liveIdSet.has(mid) && !isCricketMatchFinished(m) && !isCricketMatchUpcoming(m);
        }).slice(0, 3);

        if (staleLiveMatches.length > 0) {
          Promise.all(
            staleLiveMatches.map(m =>
              fetchWithCache(`${API_CRICKET_BASE}/match/${m.match_id}`, true, 12000)
                .then(det => ({ id: String(m.match_id), det }))
                .catch(() => null)
            )
          ).then(resolvedDetails => {
            if (activeViewKeyRef.current !== expectedKey) return;
            const patchMap = new Map();
            resolvedDetails.filter(Boolean).forEach(({ id, det }) => {
              if (!det) return;
              const patch = {};
              if (det.status) patch.status = det.status;
              if (det.status_text) patch.status_text = det.status_text;
              if (det.match_update) patch.match_update = det.match_update;
              if (Array.isArray(det.innings) && det.innings.length > 0) patch._innings = det.innings;
              patchMap.set(id, patch);
            });
            if (patchMap.size === 0) return;
            const patchedList = finalFiltered.map(m => {
              const p = patchMap.get(String(m.match_id));
              if (!p) return m;
              const updatedTeams = p._innings && Array.isArray(m.teams)
                ? m.teams.map(t => {
                    const inn = p._innings.filter(i => i.team_name === t.name || i.team_name === t.short_name).pop();
                    return inn ? { ...t, score: `${inn.runs}/${inn.wickets} (${inn.overs} ov)` } : t;
                  })
                : m.teams;
              return {
                ...m,
                status: p.status || 'POST',
                status_text: p.status_text || m.status_text,
                match_update: p.match_update || m.match_update,
                teams: updatedTeams,
                _fromLive: false
              };
            });
            const resorted = filterAndSortCricketForDate(patchedList, date);

        const isLive = state === 'in';
        const isUpcoming = state === 'pre' || (!state && (isNaN(evTime) || evTime >= nowMs - 3600000));
        if (!isLive && !isUpcoming) return;

        if (seenIds.has(key)) return;
        seenIds.add(key);
        combined.push({
          ...event,
          _favSport: 'soccer',
          _isLive: isLive,
          _sortTs: isNaN(evTime) ? Number.MAX_SAFE_INTEGER : evTime
        });

        const events = [...(teamObj?.nextEvent || []), ...(teamObj?.events || [])];

          const comp = event.competitions[0];

          const isCompleted = state === 'post' || Boolean(comp?.status?.type?.completed);
          if (isCompleted) return;

          const evTime = new Date(event.date || 0).getTime();
          const isLive = state === 'in';
          const isUpcoming = state === 'pre' || (!state && (isNaN(evTime) || evTime >= nowMs - 3600000));
          if (!isLive && !isUpcoming) return;

          if (seenIds.has(key)) return;
          seenIds.add(key);

            _favSport: 'soccer',
            _isLive: isLive,
            _sortTs: isNaN(evTime) ? Number.MAX_SAFE_INTEGER : evTime

      (Array.isArray(cricketLive) ? cricketLive : []).forEach(m => {

      cricketPool.forEach((m) => {
        if (!m?.match_id) return;
        const matched = (m.teams || []).some(t =>

        if (!matched) return;

        const stUpper = String(m.status || '').toUpperCase();
        const stTxtUpper = String(m.status_text || '').toUpperCase();
        const evTime = new Date(m.start_time || 0).getTime();
        const isFinished = stUpper === 'POST' || stUpper === 'FINAL' || stUpper === 'COMPLETED' || stUpper === 'RESULT' ||

        const isLive = Boolean(m._isLive) || stUpper === 'IN' || stUpper === 'LIVE' || stTxtUpper.includes('LIVE') || stTxtUpper.includes('STUMPS') || stTxtUpper.includes('INNINGS BREAK');
        const isUpcoming = !isLive && (stUpper === 'PRE' || stUpper === 'SCHEDULED' || (!isNaN(evTime) && evTime >= nowMs - 3600000));
        if (!isLive && !isUpcoming) return;

          ...m,
          _favSport: 'cricket',
          _isLive: isLive,
          _sortTs: isNaN(evTime) ? Number.MAX_SAFE_INTEGER : evTime

              <EmptyState icon={Calendar} title="No Live or Upcoming Matches" message="Your favorite football and cricket teams don't have any live or upcoming fixtures right now." />
            ) : (
              favMatches.map((m, idx) =>
                m._favSport === 'soccer' ? (
                  <FootballMatchCard key={`fav-s-${m.id || idx}`} match={m} selectedDate={m._isLive ? new Date() : null} onOpen={openMatchModal} onOpenTeam={openTeamHub} hideDate={false} />
                ) : (
                  <CricketMatchCard key={`fav-c-${m.match_id || idx}`} match={m} selectedDate={m._isLive ? new Date() : null} onOpen={openMatchModal} onOpenTeam={openTeamHub} hideDate={false} />
                )
              )
            )}
          </div>
        )}

        {view === 'scores' && (() => {
          const curDateKey = toLocalIsoDate(date);
          const resolvedFootball = footballState.dateKey === curDateKey
            ? footballState.items
            : getCachedFootballForDateKey(curDateKey);
          const resolvedCricket = cricketState.dateKey === curDateKey
            ? cricketState.items
            : getCachedCricketForDate(date);
          const activeList = activeSport === 'soccer' ? resolvedFootball : resolvedCricket;
          const isSchedulePending = activeList === null || (loading && activeList.length === 0);

          return (
            <div className="flex-1 flex flex-col">
              <DateSelector dates={dates} selectedDate={date} onSelectDate={handleSelectDateSmooth} />
              <div
                ref={scheduleContainerRef}
                key={`${activeSport}-${curDateKey}`}
                className={`px-4 pb-36 ${dateDir >= 0 ? 'schedule-load-next' : 'schedule-load-prev'}`}
              >
                {isSchedulePending ? (
                  <WhitePillLoader className="py-20" />
                ) : activeSport === 'soccer' ? (
                  activeList.length === 0 ? (
                    <EmptyState icon={CircleDashed} title="No Broadcasts" message="There are no scheduled games for this date." />
                  ) : (
                    activeList.map(m => (
                      <FootballMatchCard key={m.id} match={m} selectedDate={date} onOpen={openMatchModal} onOpenTeam={openTeamHub} hideDate={true} />
                    ))
                  )
                ) : activeList.length === 0 ? (
                  <EmptyState icon={Activity} title="No Broadcasts" message="No cricket fixtures found for this date." />
                ) : (
                  activeList.map(m => (
                    <CricketMatchCard key={m.match_id} match={m} selectedDate={date} onOpen={openMatchModal} onOpenTeam={openTeamHub} hideDate={true} />
                  ))
                )}
              </div>
            </div>
          );
        })()}

        {view === 'standings' && (
          activeSport === 'soccer' ? (
            <FootballStandingsView key={`std-s-${refreshTick}`} onTeamPress={openTeamHub} onOpenMatch={openMatchModal} onSwipeEdge={stepMainView} />
          ) : (
            <CricketStandingsView key={`std-c-${refreshTick}`} onTeamPress={openTeamHub} onOpenMatch={openMatchModal} onSwipeEdge={stepMainView} />
          )
        )}

        {view === 'intel' && (
          activeSport === 'soccer' ? <FootballIntelView key={`intel-s-${refreshTick}`} /> : <CricketIntelView key={`intel-c-${refreshTick}`} />
        )}
      </div>

      <div ref={bottomPillSwipeRef} className="fixed bottom-[35px] left-1/2 rounded-full p-2 flex liquid-glass-pill z-40 shadow-2xl">
        {favoritesList.length > 0 && (
          <button onClick={() => navigateToView('home')} className="px-6 py-2.5 rounded-full">
            <Star size={26} color={view === 'home' ? THEME.text : THEME.muted} />
          </button>
        )}
        <button onClick={() => navigateToView('scores')} className="px-6 py-2.5 rounded-full">
          <Activity size={26} color={view === 'scores' ? THEME.text : THEME.muted} />
        </button>
        <button onTouchStart={() => warmSportOrView(activeSport, 'standings')} onClick={() => navigateToView('standings')} className="px-6 py-2.5 rounded-full">
          <Trophy size={26} color={view === 'standings' ? THEME.text : THEME.muted} />
        </button>
        <button onTouchStart={() => warmSportOrView(activeSport, 'intel')} onClick={() => navigateToView('intel')} className="px-6 py-2.5 rounded-full">
          <Zap size={26} color={view === 'intel' ? THEME.text : THEME.muted} />
        </button>
      </div>

      {activeMatch && activeMatch._sport === 'soccer' && (
        <FootballMatchModal match={activeMatch} onClose={() => setActiveMatch(null)} onOpenTeam={openTeamHub} />
      )}
      {activeMatch && activeMatch._sport === 'cricket' && (
        <CricketMatchModal match={activeMatch} selectedDate={date} onClose={() => setActiveMatch(null)} onOpenTeam={openTeamHub} />
      )}

      {activeTeam && activeTeam.sport === 'soccer' && (
        <FootballTeamModal
          team={activeTeam.team}
          leagueId={activeTeam.leagueId}
          existingStats={activeTeam.existingStats}
          standingRank={activeTeam.rank}
          favorites={footballFavs}
          onToggleFavorite={toggleFootballFav}
          onClose={() => setActiveTeam(null)}
          onOpenMatch={openMatchModal}
        />
      )}
      {activeTeam && activeTeam.sport === 'cricket' && (
        <CricketTeamModal
          team={activeTeam.team}
          existingStats={activeTeam.existingStats}
          favorites={cricketFavs}
          onToggleFavorite={toggleCricketFav}
          onClose={() => setActiveTeam(null)}
          onOpenMatch={openMatchModal}
        />
      )}
    </div>
  );
}


class SidelineErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div className="min-h-screen bg-[#000000] text-[#F5F5F7] flex flex-col items-center justify-center p-6 text-center">
          <div className="text-[#FF453A] font-extrabold text-[14px] mb-2">APP ERROR</div>
          <div className="text-[#8E8E93] text-[12px] max-w-[300px] mb-4 break-words">{String(this.state.error?.message || this.state.error)}</div>
          <button onClick={() => window.location.reload()} className="px-4 py-2 rounded-full liquid-glass text-[#F5F5F7] text-[12px] font-bold">
            Reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <SidelineErrorBoundary>
    <App />
  </SidelineErrorBoundary>
);

  </script>
  <script>
    (function bootSideline() {
      const launchStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      let splashDismissed = false;
      window.__dismissSidelineSplash = function() {
        if (splashDismissed) return;
        splashDismissed = true;
        const el = document.getElementById('sideline-opening');
        if (!el) return;
        const elapsed = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - launchStart;
        const waitMs = Math.max(0, 340 - elapsed);
        setTimeout(() => {
          requestAnimationFrame(() => {
            el.classList.add('is-dismissing');
            setTimeout(() => {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 260);
          });
        }, waitMs);
      };
      // Safety fallback if anything stalls
      setTimeout(() => { if (!splashDismissed) window.__dismissSidelineSplash(); }, 2200);

      function hashSource(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return (h >>> 0).toString(36) + '_' + str.length;
      }

      let started = false;
      function startApp() {
        if (started) return;
        if (!window.React || !window.ReactDOM) {
          requestAnimationFrame(startApp);
          return;
        }
        const jsxEl = document.getElementById('sideline-jsx');
        if (!jsxEl) return;
        const jsxSource = jsxEl.textContent;
        const cacheKey = 'sideline_compiled_v24_' + hashSource(jsxSource);

        let compiled = null;
        try {
          compiled = localStorage.getItem(cacheKey);
        } catch {}

        if (compiled) {
          started = true;
          try {
            new Function(compiled)();
            return;
          } catch {
            try { localStorage.removeItem(cacheKey); } catch {}
            started = false;
          }
        }

        if (!window.Babel) {
          setTimeout(startApp, 24);
          return;
        }

        started = true;
        compiled = window.Babel.transform(jsxSource, { presets: ['react'] }).code;
        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith('sideline_compiled_') && k !== cacheKey) {
              localStorage.removeItem(k);
            }
          }
          localStorage.setItem(cacheKey, compiled);
        } catch {}
        new Function(compiled)();
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') startApp();
      else document.addEventListener('DOMContentLoaded', startApp, { once: true });
      window.addEventListener('load', startApp, { once: true });
    })();
  </script>
