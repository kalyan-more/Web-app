                    <div className="absolute top-0 bottom-0 left-[13px] w-[2px] bg-[rgba(255,255,255,0.08)]" />
                    <div className="w-[28px] h-[28px] rounded-full flex items-center justify-center z-10 border-2 shrink-0" style={{ backgroundColor: `${item.color}33`, borderColor: item.color }}>
                      <IconComp size={14} color={item.color} />
                    </div>
                    <div className="flex-1 ml-4 flex flex-col justify-center">
                      <span className="text-[10px] font-extrabold uppercase tracking-[0.8px] mb-0.5" style={{ color: item.color }}>{item.label}</span>
                      <span className="text-[#F5F5F7] text-[13px] font-medium leading-[20px]">{item.text}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div className="mt-5 mb-10 w-full">
          <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Match Venue</span>
          <div className="h-[180px] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] bg-[#121212] relative">
            <img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=800&q=80" alt="Stadium" loading="lazy" decoding="async" className="absolute inset-0 w-full h-full object-cover" />
            <div className="absolute inset-0 bg-black/60" />
            <div className="relative z-10 h-full p-5 flex flex-col justify-end">
              <div className="flex items-center mb-3.5">
                <Landmark size={28} color={THEME.text} className="shrink-0" />
                <div className="flex-1 ml-4 min-w-0">
                  <span className="block text-white text-[20px] font-extrabold break-words leading-tight">{venueName}</span>
                  <span className="block text-[#ccc] text-[12px] font-bold tracking-[1px] mt-0.5 uppercase break-words leading-snug">{city}</span>
                </div>
              </div>
              {capacity && (
                <div className="flex border-t border-white/20 pt-3.5 gap-4">
                  <div>
                    <span className="block text-[#aaa] text-[10px] font-bold mb-1 uppercase">Capacity</span>
                    <span className="block text-white text-[14px] font-extrabold">{capacity.toLocaleString()}</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  };

  const renderScorecardTab = () => {
    const inning = matchDetails?.innings?.[activeInnings];
    if (!inning) return <EmptyState icon={CircleDashed} title="Scorecard Pending" message="Innings details will appear once the match data updates." />;

    const partnerships = inning.partnerships || [];
    const fow = inning.fall_of_wickets || [];

    return (
      <div className="px-4 pb-10">
        <div className="bg-[#121212] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)]">
          <div className="flex items-center gap-2 bg-[#1C1C1E] px-3.5 py-3.5 border-b border-[rgba(255,255,255,0.08)]">
            <span className="flex-1 min-w-0 pr-1 text-[#8E8E93] text-[11px] font-extrabold uppercase">Batter</span>
            <span className="w-[36px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">R</span>
            <span className="w-[36px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">B</span>
            <span className="w-[24px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">4s</span>
            <span className="w-[24px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">6s</span>
            <span className="w-[44px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">SR</span>
          </div>
          {(inning.batting || []).map((b, i) => (
            <div key={i} className="flex items-center gap-2 px-3.5 py-3.5 border-b border-[rgba(255,255,255,0.08)]">
              <div className="flex-1 min-w-0 pr-1">
                <span className="block text-[#F5F5F7] text-[13.5px] font-bold break-words leading-snug">{cleanPlayerName(b.name)}{!b.is_out && '*'}</span>
                <span className="block text-[#8E8E93] text-[11px] mt-1 font-medium break-words leading-snug">{cleanCricketDismissalText(b.dismissal, b.is_out)}</span>
              </div>
              <span className="w-[36px] shrink-0 text-right text-[#F5F5F7] text-[13px] font-bold tabular-nums">{b.runs}</span>
              <span className="w-[36px] shrink-0 text-right text-[#8E8E93] text-[13px] font-bold tabular-nums">{b.balls}</span>
              <span className="w-[24px] shrink-0 text-right text-[#8E8E93] text-[13px] font-bold tabular-nums">{b.fours || 0}</span>
              <span className="w-[24px] shrink-0 text-right text-[#8E8E93] text-[13px] font-bold tabular-nums">{b.sixes || 0}</span>
              <span className="w-[44px] shrink-0 text-right text-[#0A84FF] text-[13px] font-bold tabular-nums">{b.strike_rate || b.sr || ((b.runs / (b.balls || 1)) * 100).toFixed(1)}</span>
            </div>
          ))}
          <div className="flex justify-between p-5 bg-[#1C1C1E]">
            <span className="text-[#F5F5F7] text-[16px] font-extrabold">Total</span>
            <span className="text-[#F5F5F7] text-[18px] font-extrabold tabular-nums">
              {inning.runs}/{inning.wickets} <span className="text-[11px] text-[#8E8E93] font-semibold">({inning.overs} ov)</span>
            </span>
          </div>
        </div>

        <div className="bg-[#121212] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] mt-5">
          <div className="flex items-center gap-2 bg-[#1C1C1E] px-3.5 py-3.5 border-b border-[rgba(255,255,255,0.08)]">
            <span className="flex-1 min-w-0 pr-1 text-[#8E8E93] text-[11px] font-extrabold uppercase">Bowler</span>
            <span className="w-[34px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">O</span>
            <span className="w-[24px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">M</span>
            <span className="w-[36px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">R</span>
            <span className="w-[24px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">W</span>
            <span className="w-[44px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">ECON</span>
          </div>
          {(inning.bowling || []).map((b, i) => (
            <div key={i} className="flex items-center gap-2 px-3.5 py-3.5 border-b border-[rgba(255,255,255,0.08)]">
              <span className="flex-1 min-w-0 pr-1 text-[#F5F5F7] text-[13.5px] font-bold break-words leading-snug">{cleanPlayerName(b.name || 'Bowler')}</span>
              <span className="w-[34px] shrink-0 text-right text-[#8E8E93] text-[13px] font-bold tabular-nums">{b.overs}</span>
              <span className="w-[24px] shrink-0 text-right text-[#8E8E93] text-[13px] font-bold tabular-nums">{b.maidens || 0}</span>
              <span className="w-[36px] shrink-0 text-right text-[#F5F5F7] text-[13px] font-bold tabular-nums">{b.runs}</span>
              <span className="w-[24px] shrink-0 text-right text-[#0A84FF] text-[13px] font-bold tabular-nums">{b.wickets}</span>
              <span className="w-[44px] shrink-0 text-right text-[#0A84FF] text-[13px] font-bold tabular-nums">{b.economy || b.econ || (b.runs / (b.overs || 1)).toFixed(1)}</span>
            </div>
          ))}
        </div>

        {partnerships.length > 0 && (
          <div className="bg-[#121212] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] mt-5">
            <div className="flex items-center gap-2 bg-[#1C1C1E] px-3.5 py-3.5 border-b border-[rgba(255,255,255,0.08)]">
              <span className="flex-1 min-w-0 text-[#8E8E93] text-[11px] font-extrabold uppercase">Partnerships</span>
              <span className="w-[48px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">Runs</span>
              <span className="w-[48px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">Balls</span>
            </div>
            {partnerships.map((p, i) => {
              let names = 'Batters';
              if (p.batter_1 && p.batter_2) names = `${p.batter_1} & ${p.batter_2}`;
              else if (p.players && Array.isArray(p.players)) names = p.players.map(pl => pl.name || pl).join(' & ');
              else if (p.player1 && p.player2) names = `${p.player1.name || p.player1} & ${p.player2.name || p.player2}`;
              else if (p.bat1_name && p.bat2_name) names = `${p.bat1_name} & ${p.bat2_name}`;
              return (
                <div key={i} className="flex items-center gap-2 px-3.5 py-3.5 border-b border-[rgba(255,255,255,0.08)]">
                  <span className="flex-1 min-w-0 text-[#F5F5F7] text-[13.5px] font-bold pr-1 break-words leading-snug">{cleanPlayerName(names)}</span>
                  <span className="w-[48px] shrink-0 text-right text-[#F5F5F7] text-[13px] font-bold tabular-nums">{p.runs ?? '-'}</span>
                  <span className="w-[48px] shrink-0 text-right text-[#8E8E93] text-[13px] font-bold tabular-nums">{p.balls ?? '-'}</span>
                </div>
              );
            })}
          </div>
        )}

        {fow.length > 0 && (
          <div className="bg-[#121212] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] mt-5">
            <div className="flex items-center gap-2 bg-[#1C1C1E] px-3.5 py-3.5 border-b border-[rgba(255,255,255,0.08)]">
              <span className="flex-1 min-w-0 text-[#8E8E93] text-[11px] font-extrabold uppercase">Fall of Wickets</span>
              <span className="w-[56px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">Score</span>
              <span className="w-[46px] shrink-0 text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">Over</span>
            </div>
            {fow.map((w, i) => (
              <div key={i} className="flex items-center gap-2 px-3.5 py-3.5 border-b border-[rgba(255,255,255,0.08)]">
                <span className="flex-1 min-w-0 text-[#F5F5F7] text-[13.5px] font-bold pr-1 break-words leading-snug">{cleanPlayerName(w.player_name || 'Batter')}</span>
                <span className="w-[56px] shrink-0 text-right text-[#F5F5F7] text-[13px] font-bold tabular-nums">{w.score}-{w.wicket_number}</span>
                <span className="w-[46px] shrink-0 text-right text-[#8E8E93] text-[13px] font-bold tabular-nums">{w.overs}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  const renderSummaryTab = () => {
    if (!matchDetails || !matchDetails.innings || !matchGraphs) {
      return <EmptyState icon={BarChart2} title="Analysis Unavailable" message="Phase analysis requires match data." />;
    }
    const summaries = [null, null];
    const highestOver = Math.max(...matchGraphs.flatMap(g => g.over_by_over?.map(o => o.over) || [0]));
    const isODI = highestOver > 25;
    const ppLimit = isODI ? 10 : 6;
    const midLimit = isODI ? 40 : 15;
    const deathLimit = isODI ? 50 : 20;

    matchDetails.innings.forEach((inning, idx) => {
      if (idx > 1) return;
      const gData = matchGraphs.find(g => g.team_name === inning.team_name || g.innings_number === inning.innings_number)?.over_by_over || [];
      const pp_runs = gData.filter(o => o.over <= ppLimit).reduce((sum, o) => sum + o.runs_this_over, 0);
      const mid_runs = gData.filter(o => o.over > ppLimit && o.over <= midLimit).reduce((sum, o) => sum + o.runs_this_over, 0);
      const death_runs = gData.filter(o => o.over > midLimit).reduce((sum, o) => sum + o.runs_this_over, 0);
      const fours = (inning.batting || []).reduce((sum, b) => sum + (b.fours || 0), 0);
      const sixes = (inning.batting || []).reduce((sum, b) => sum + (b.sixes || 0), 0);
      const extras = inning.extras?.total || 0;
      const totalBallsFaced = (inning.batting || []).reduce((sum, b) => sum + (b.balls || 0), 0) || 120;
      const totalRunsFromBat = (inning.batting || []).reduce((sum, b) => sum + (b.runs || 0), 0);
      const nonBoundaryRuns = totalRunsFromBat - ((fours * 4) + (sixes * 6));
      const dotBalls = Math.max(0, totalBallsFaced - (fours + sixes + nonBoundaryRuns));
      const dotPercentage = ((dotBalls / totalBallsFaced) * 100).toFixed(1);
      summaries[idx] = { name: inning.team_name, pp_runs, mid_runs, death_runs, fours, sixes, extras, dotPercentage };
    });

    if (!summaries[0] || !summaries[1]) {
      return <EmptyState icon={BarChart2} title="Waiting for 2nd Innings" message="Match analysis compares both teams. Please wait for the second innings." />;
    }

    return (
      <div className="px-4 pb-10">
        <div className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)]">
          <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Match Analysis</span>
          <div className="flex justify-between mb-6 border-b border-[rgba(255,255,255,0.08)] pb-3">
            <span className="text-[13px] font-extrabold text-[#F5F5F7] flex-1 text-left break-words leading-snug pr-2">{summaries[0].name}</span>
            <span className="text-[13px] font-extrabold text-[#F5F5F7] flex-1 text-right break-words leading-snug pl-2">{summaries[1].name}</span>
          </div>
          <DuelStat label={`Powerplay (1-${ppLimit})`} homeVal={summaries[0].pp_runs} awayVal={summaries[1].pp_runs} />
          <DuelStat label={`Middle (${ppLimit + 1}-${midLimit})`} homeVal={summaries[0].mid_runs} awayVal={summaries[1].mid_runs} />
          <DuelStat label={`Death (${midLimit + 1}-${deathLimit})`} homeVal={summaries[0].death_runs} awayVal={summaries[1].death_runs} />
          <div className="h-[1px] bg-[rgba(255,255,255,0.08)] my-6" />
          <DuelStat label="Total 4s" homeVal={summaries[0].fours} awayVal={summaries[1].fours} />
          <DuelStat label="Total 6s" homeVal={summaries[0].sixes} awayVal={summaries[1].sixes} />
          <DuelStat label="Extras Conceded" homeVal={summaries[1].extras} awayVal={summaries[0].extras} />
          <DuelStat label="Dot Ball %" homeVal={`${summaries[0].dotPercentage}%`} awayVal={`${summaries[1].dotPercentage}%`} />
        </div>
      </div>
    );
  };

  const renderGraphsTab = () => {
    if (!matchGraphs || matchGraphs.length === 0) {
      return <EmptyState icon={TrendingUp} title="Graphs Unavailable" message="Over-by-over graph data has not been logged for this match." />;
    }
    const inningData = matchGraphs[activeInnings];
    if (!inningData || !inningData.over_by_over) return null;

    const highestOver = Math.max(...matchGraphs.flatMap(g => g.over_by_over?.map(o => o.over) || [0]));
    const maxOvers = highestOver <= 22 ? 20 : highestOver <= 52 ? 50 : Math.ceil(highestOver / 10) * 10;
    const validOvers = inningData.over_by_over.filter(ov => ov.over <= maxOvers);
    const maxRunsInAnOver = Math.max(...validOvers.map(o => o.runs_this_over || 0), 10);
    const yMax = Math.ceil(maxRunsInAnOver / 5) * 5 + 5;
    const GRAPH_HEIGHT = 240;
    const DRAW_HEIGHT = GRAPH_HEIGHT - 40;

    return (
      <div className="px-4 pb-10">
        <WormGraph graphs={matchGraphs} />
        <div className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)]">
          <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Runs Per Over (Manhattan)</span>
          <div className="flex h-[270px]">
            <div className="flex flex-col justify-between pr-3 pt-10" style={{ height: DRAW_HEIGHT }}>
              <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">{yMax}</span>
              <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">{Math.floor(yMax / 2)}</span>
              <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">0</span>
            </div>
            <div data-no-section-swipe="true" className="flex-1 overflow-x-auto flex items-end [&::-webkit-scrollbar]:hidden" style={{ height: GRAPH_HEIGHT }}>
              {validOvers.map((ov, index) => {
                const barHeight = Math.max((ov.runs_this_over / yMax) * DRAW_HEIGHT, 5);
                const isWicket = ov.wickets_this_over > 0;
                const barColor = activeInnings === 0 ? THEME.muted : THEME.accent;
                return (
                  <div key={index} className="flex flex-col items-center w-[24px] mx-1 shrink-0 relative">
                    <span className="text-[10px] text-[#F5F5F7] mb-1.5 font-extrabold tabular-nums">{ov.runs_this_over}</span>
                    {isWicket && (
                      <div className="mb-1 bg-[#FF453A] px-1.5 py-0.5 rounded-[6px] flex items-center justify-center">
                        <span className="text-[8px] font-black text-white">{ov.wickets_this_over > 1 ? `${ov.wickets_this_over}W` : 'W'}</span>
                      </div>
                    )}
                    <div className="w-[16px] rounded-t-[8px]" style={{ height: barHeight, backgroundColor: isWicket ? THEME.danger : barColor }} />
                    <span className="text-[10px] text-[#8E8E93] mt-2 font-bold tabular-nums">{ov.over}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div className={`fixed inset-0 z-50 bg-black/70 ${closing ? 'ios-backdrop-out' : 'ios-backdrop-in'} flex flex-col justify-end`}>
      <div className="absolute inset-0" onClick={handleClose} />
      <div className={`relative h-[94vh] max-w-md w-full mx-auto pt-4 bg-[#000000] rounded-t-[40px] flex flex-col overflow-hidden border-t border-[rgba(255,255,255,0.12)] ${closing ? 'ios-sheet-down' : 'ios-sheet-up'} transform-gpu`}>
        <div className="w-full h-[30px] flex items-center justify-center cursor-pointer shrink-0" onClick={handleClose}>
          <div className="w-[48px] h-[5px] bg-[rgba(255,255,255,0.08)] rounded-[3px]" />
        </div>

        {renderCricketModalHero()}

        {detailsLoading && !matchDetails ? (
          <WhitePillLoader className="mt-12 py-6" />
        ) : (
          <div className="flex-1 flex flex-col min-h-0">
            {matchDetails?.innings && matchDetails.innings.length > 0 && (
              <div className="grid grid-cols-2 gap-2.5 px-4 mb-3 shrink-0">
                {matchDetails.innings.map((inn, idx) => {
                  const matchTeam = match.teams.find(t => t.name === inn.team_name || t.short_name === inn.team_name);
                  const displayName = matchTeam ? matchTeam.short_name : inn.team_name;
                  const active = activeInnings === idx;
                  return (
                    <button
                      key={idx}
                      onClick={() => setActiveInnings(idx)}
                      className={`py-3 px-2 rounded-[16px] text-[13px] border break-words leading-tight text-center transition-colors ${active ? 'bg-[#1C1C1E] border-[#F5F5F7] text-[#F5F5F7] font-extrabold' : 'bg-[#121212] border-[rgba(255,255,255,0.08)] text-[#8E8E93] font-bold'}`}
                    >
                      {displayName}
                    </button>
                  );
                })}
              </div>
            )}

            {/* Proportional Flex Tab Bar (flex-auto) so visual spacing between Info, Scorecard, Summary, Overs, and Graphs is completely even */}
            <div className="flex items-center gap-1 bg-[#1C1C1E] rounded-[16px] p-1 mx-4 mb-4 border border-[rgba(255,255,255,0.08)] shrink-0">
              {CRICKET_MATCH_TABS.map(t => {
                const active = activeTab === t.id;
                return (
                  <button
                    key={t.id}
                    onClick={() => cmSwipe.selectWithDir(t.id)}
                    className={`flex-auto py-2.5 px-2 rounded-[12px] text-[11px] leading-none text-center whitespace-nowrap transition-colors duration-150 ${active ? 'bg-[#2C2C2E] text-[#F5F5F7] font-extrabold shadow-sm' : 'text-[#8E8E93] font-bold'}`}
                  >
                    {t.label}
                  </button>
                );
              })}
            </div>

            <div {...cmSwipe.bind} className="flex-1 overflow-y-auto [&::-webkit-scrollbar]:hidden">
              <div ref={cmSwipe.contentRef} key={`${activeTab}-${activeInnings}`} className={cmSwipe.animClass}>
              {activeTab === 'info' && renderInfoTab()}
              {activeTab === 'scorecard' && renderScorecardTab()}
              {activeTab === 'summary' && renderSummaryTab()}
              {activeTab === 'graphs' && renderGraphsTab()}
              {activeTab === 'overs' && (
                groupedOvers.length === 0 ? (
                  <EmptyState icon={History} title="No Overs Logged" message="Ball-by-ball commentary has not begun." />
                ) : (
                  <div className="px-4 pb-10">
                    {groupedOvers.map((item, idx) => (
                      <div key={idx} className="bg-[#121212] rounded-[24px] p-5 mb-4 border border-[rgba(255,255,255,0.08)]">
                        <div className="flex justify-between mb-3 border-b border-[rgba(255,255,255,0.08)] pb-2.5">
                          <span className="text-[#F5F5F7] text-[12px] font-extrabold">OVER {item.num}</span>
                          <span className="text-[#8E8E93] text-[12px] font-bold">{cleanPlayerName(item.bowler)}</span>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                          {item.balls.map((b, i) => (
                            <div key={i} className="w-[36px] h-[36px] rounded-full flex items-center justify-center" style={{ backgroundColor: b.bg }}>
                              <span className="text-[13px] font-extrabold tabular-nums" style={{ color: b.txt }}>{b.val}</span>
                            </div>
                          ))}
                        </div>
                        {item.highlights.length > 0 && (
                          <div className="mt-4 pt-3 border-t border-[rgba(255,255,255,0.08)]">
                            {item.highlights.map((h, i) => (
                              <div key={i} className="flex items-start mb-3 last:mb-0">
                                <span className="text-[10px] font-black tracking-[0.5px] w-[60px] mt-0.5 shrink-0" style={{ color: h.color }}>{h.event}</span>
                                <span className="flex-1 text-[#F5F5F7] text-[13px] leading-[18px] font-medium">{h.desc}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )
              )}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// ⚽ SOCCER MATCH MODAL

const FootballMatchModal = ({ match, onClose, onOpenTeam }) => {
  const { closing, handleClose } = useSmoothDismiss(onClose);
  const initialLeagueId = (match?._leagueId && match._leagueId !== 'all' && match._leagueId !== 'custom')
    ? match._leagueId
    : (match?.league?.slug || match?.competitions?.[0]?.league?.slug || 'all');
  const sumUrl = `${API_SOCCER_SCORE_BASE}/${initialLeagueId}/summary?event=${match?.id}`;
  const [summary, setSummary] = useState(() => match?.id ? getCachedSync(sumUrl) : null);
  const [corePlays, setCorePlays] = useState([]);
  const [tab, setTab] = useState('lineup');
  const fmTabs = useMemo(() => ['lineup', 'commentary', 'stats'], []);
  const fmSwipe = useSwipeSections(fmTabs, tab, setTab, {
    onBoundaryPrev: handleClose,
    stopPropagation: true
  });

  const fetchActiveDetails = useCallback(async (isSilent = false) => {
    if (!match?.id) return;
    try {
      let data = await fetchWithCache(sumUrl, isSilent);
      const headerSlug = data?.header?.league?.slug || '';
      const activeSlug = (initialLeagueId !== 'all') ? initialLeagueId : (headerSlug || 'all');

      // If opened via /all/summary and full commentary wasn't included, refetch using the exact league slug
      if (initialLeagueId === 'all' && headerSlug && (!Array.isArray(data?.commentary) || data.commentary.length === 0)) {
        const leagueData = await fetchWithCache(`${API_SOCCER_SCORE_BASE}/${headerSlug}/summary?event=${match.id}`, isSilent).catch(() => null);
        if (leagueData) data = leagueData;
      }

      setSummary(data);

      // If summary.commentary is still empty, pull ESPN's public Core Play-by-Play endpoint for this league
      if ((!Array.isArray(data?.commentary) || data.commentary.length === 0) && activeSlug !== 'all') {
        fetchWithCache(`https://sports.core.api.espn.com/v2/sports/soccer/leagues/${activeSlug}/events/${match.id}/competitions/${match.id}/plays?limit=250`, isSilent, 6000)
          .then(res => {
            const items = Array.isArray(res?.items) ? res.items.filter(it => it && (it.text || it.shortText || it.type?.text)) : [];
            if (items.length > 0) setCorePlays(items);
          }).catch(() => {});
      }
    } catch {
      if (!isSilent) setSummary(prev => prev || {});
    }
  }, [match?.id, sumUrl, initialLeagueId]);

  useEffect(() => {
    fetchActiveDetails(false);
    const interval = setInterval(() => fetchActiveDetails(true), 10000);
    return () => clearInterval(interval);
  }, [fetchActiveDetails]);

  const hComp = match?.competitions?.[0]?.competitors?.find(c => c.homeAway === 'home');
  const aComp = match?.competitions?.[0]?.competitors?.find(c => c.homeAway === 'away');
  let hScore = getSafeFootballScore(hComp?.score);
  let aScore = getSafeFootballScore(aComp?.score);
  if (summary?.header?.competitions?.[0]?.competitors) {
    const sumH = summary.header.competitions[0].competitors.find(c => c.team?.id === hComp?.team?.id);
    const sumA = summary.header.competitions[0].competitors.find(c => c.team?.id === aComp?.team?.id);
    if (sumH && sumH.score !== undefined) hScore = getSafeFootballScore(sumH.score);
    if (sumA && sumA.score !== undefined) aScore = getSafeFootballScore(sumA.score);
  }

  return (
    <div className={`fixed inset-0 z-50 bg-black/70 ${closing ? 'ios-backdrop-out' : 'ios-backdrop-in'} flex flex-col justify-end`}>
      <div className="absolute inset-0" onClick={handleClose} />
      <div className={`relative h-[94vh] max-w-md w-full mx-auto pt-4 bg-[#000000] rounded-t-[40px] flex flex-col overflow-hidden border-t border-[rgba(255,255,255,0.12)] ${closing ? 'ios-sheet-down' : 'ios-sheet-up'} transform-gpu`}>
        <div className="w-full h-[30px] flex items-center justify-center cursor-pointer shrink-0" onClick={handleClose}>
          <div className="w-[48px] h-[5px] bg-[rgba(255,255,255,0.08)] rounded-[3px]" />
        </div>

        <div className="flex justify-between px-5 pt-2 pb-4 w-full items-start shrink-0">
          <div className="w-[38%] flex flex-col items-center gap-1.5 cursor-pointer" onClick={() => onOpenTeam(hComp?.team, match._leagueId, null, 'soccer')}>
            <img src={getSafeFootballLogo(hComp?.team)} style={getDarkLogoStyle(hComp?.team)} onError={(e) => handleImageError(e, hComp?.team?.shortDisplayName)} className="w-[68px] h-[68px] object-contain" alt="" />
            <span className="text-[13px] font-bold text-[#F5F5F7] text-center mt-0.5">{hComp?.team?.shortDisplayName}</span>
            <div className="h-[46px] flex flex-col items-center justify-start">
              <span className="text-[30px] font-extrabold text-[#F5F5F7] text-center tabular-nums leading-none">{hScore}</span>
            </div>
          </div>

          <div className="w-[24%] flex flex-col items-center justify-center pt-5">
            <span className="text-[#8E8E93] text-[11px] font-bold text-center">{match?.status?.type?.shortDetail || 'Match'}</span>
          </div>

          <div className="w-[38%] flex flex-col items-center gap-1.5 cursor-pointer" onClick={() => onOpenTeam(aComp?.team, match._leagueId, null, 'soccer')}>
            <img src={getSafeFootballLogo(aComp?.team)} style={getDarkLogoStyle(aComp?.team)} onError={(e) => handleImageError(e, aComp?.team?.shortDisplayName)} className="w-[68px] h-[68px] object-contain" alt="" />
            <span className="text-[13px] font-bold text-[#F5F5F7] text-center mt-0.5">{aComp?.team?.shortDisplayName}</span>
            <div className="h-[46px] flex flex-col items-center justify-start">
              <span className="text-[30px] font-extrabold text-[#F5F5F7] text-center tabular-nums leading-none">{aScore}</span>
            </div>
          </div>
        </div>

        <div className="flex items-center gap-1 bg-[#1C1C1E] rounded-[16px] p-1 mx-4 mb-4 border border-[rgba(255,255,255,0.08)] shrink-0">
          {fmTabs.map(t => {
            const active = tab === t;
            return (
              <button
                key={t}
                onClick={() => fmSwipe.selectWithDir(t)}
                className={`flex-auto py-2.5 px-2.5 rounded-[12px] text-[12px] leading-none text-center whitespace-nowrap transition-colors duration-150 ${active ? 'bg-[#2C2C2E] text-[#F5F5F7] font-extrabold shadow-sm' : 'text-[#8E8E93] font-bold'}`}
              >
                {capitalize(t)}
              </button>
            );
          })}
        </div>

        <div {...fmSwipe.bind} className="flex-1 overflow-y-auto [&::-webkit-scrollbar]:hidden">
          <div ref={fmSwipe.contentRef} key={tab} className={fmSwipe.animClass}>
          {tab === 'lineup' && (
            <div className="pb-10">
              <TacticalPitch summary={summary} home={hComp} away={aComp} />
            </div>
          )}

          {tab === 'stats' && (
            <div className="px-4 pb-10">
              {!summary?.boxscore?.teams?.[0]?.statistics ? (
                <EmptyState icon={BarChart2} title="Stats Unavailable" message="Match statistics have not been populated yet." />
              ) : (() => {
                const homeStats = summary.boxscore.teams[0].statistics || [];
                const awayStats = summary.boxscore.teams[1]?.statistics || [];
                const awayByName = new Map(awayStats.map((st, idx) => [st.name || st.label || idx, st]));

                const paired = homeStats.map((hs, idx) => {
                  const as = awayByName.get(hs.name || hs.label) || awayStats[idx] || {};
                  return {
                    name: String(hs.name || '').toLowerCase(),
                    label: hs.label || hs.name || 'Stat',
                    homeVal: hs.displayValue ?? '0',
                    awayVal: as.displayValue ?? '0'
                  };
                });

                const classifyStatSection = (item) => {
                  const key = `${item.name} ${item.label.toLowerCase()}`;
                  if (/(possession|expected goals|xg|total shots|shots on target|shots on goal|big chances|corners|offside)/i.test(key)) {
                    return 'Key Stats';
                  }
                  if (/(shot|goal|woodwork|post|cross|touches in|box|final third|through ball|dribb|big chance|attack)/i.test(key)) {
                    return 'Attack';
                  }
                  if (/(pass|accurate|completion|long ball|throw|possession|duel|aerial|touch)/i.test(key)) {
                    return 'General Play';
                  }
                  if (/(tackle|intercept|clear|block|save|keeper|recover|defen)/i.test(key)) {
                    return 'Defence';
                  }
                  if (/(foul|yellow|red|card|offside|free kick|penalt)/i.test(key)) {
                    return 'Discipline';
                  }
                  return 'General Play';
                };

                const SECTION_META = [
                  { title: 'Key Stats', icon: Activity, color: THEME.accent },
                  { title: 'Attack', icon: Zap, color: THEME.fwd },
                  { title: 'General Play', icon: ArrowRightLeft, color: THEME.shot },
                  { title: 'Defence', icon: Shield, color: THEME.def },
                  { title: 'Discipline', icon: AlertCircle, color: THEME.warning }
                ];

                const grouped = SECTION_META.map(sec => ({
                  ...sec,
                  items: paired.filter(it => classifyStatSection(it) === sec.title)
                })).filter(sec => sec.items.length > 0);

                return (
                  <div className="flex flex-col gap-4">
                    {grouped.map(sec => {
                      const IconComp = sec.icon;
                      return (
                        <div key={sec.title} className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)]">
                          <div className="flex items-center gap-2 mb-5 pb-2.5 border-b border-[rgba(255,255,255,0.08)]">
                            <IconComp size={15} color={sec.color} className="shrink-0" />
                            <span className="text-[11px] font-extrabold tracking-[1.5px] uppercase" style={{ color: sec.color }}>
                              {sec.title}
                            </span>
                          </div>
                          {sec.items.map((st, idx) => (
                            <DuelStat key={`${sec.title}-${idx}`} label={st.label} homeVal={st.homeVal} awayVal={st.awayVal} />
                          ))}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
            </div>
          )}

          {tab === 'commentary' && (() => {
            if (!summary) return <WhitePillLoader className="py-16" />;
            const commList = buildFootballCommentaryFeed(summary, corePlays, hComp, aComp);
            if (commList.length === 0) {
              return <EmptyState icon={MessageSquare} title="No Commentary" message="Live commentary and key events will appear once the match starts." />;
            }
            return (
              <div className="px-5 pb-10">
                {commList.map((item, index) => {
                  const txt = `${item._typeLower || ''} ${String(item.text || item.shortText || '')}`.toLowerCase();
                  const time = extractFootballTime(item);
                  let meta = { icon: Clock, color: THEME.muted, label: 'Match' };
                  if (txt.includes('goal') && !txt.includes('no goal') && !txt.includes('kick')) meta = { icon: CircleDashed, color: THEME.success, label: 'Goal' };
                  else if (txt.includes('penalty') && txt.includes('scored')) meta = { icon: CircleDashed, color: THEME.success, label: 'Penalty' };
                  else if (txt.includes('free kick')) meta = { icon: Mic, color: THEME.freekick, label: 'Free Kick' };
                  else if (txt.includes('miss') || txt.includes('shot') || txt.includes('attempt') || txt.includes('saved')) meta = { icon: Target, color: THEME.shot, label: 'Chance' };
                  else if (txt.includes('red card') || txt.includes('second yellow')) meta = { icon: Square, color: THEME.danger, label: 'Red Card' };
                  else if (txt.includes('yellow')) meta = { icon: Square, color: THEME.warning, label: 'Caution' };
                  else if (txt.includes('substitut')) meta = { icon: ArrowRightLeft, color: THEME.accent, label: 'Sub' };
                  else if (txt.includes('offside')) meta = { icon: Flag, color: THEME.offside, label: 'Offside' };
                  else if (txt.includes('foul')) meta = { icon: AlertCircle, color: THEME.danger, label: 'Foul' };
                  else if (txt.includes('full time') || txt.includes('end regular') || txt.includes('halftime') || txt.includes('half time') || txt.includes('kickoff')) meta = { icon: CheckCircle2, color: THEME.accent, label: 'Whistle' };
                  const IconComp = meta.icon;
                  const minuteStamp = time || "0’";

                  return (
                    <div key={index} className={`flex gap-4 ${index === 0 ? 'mt-2.5' : ''}`}>
                      <div className="flex flex-col items-center w-[52px] shrink-0">
                        <div className="w-[34px] h-[34px] rounded-[12px] bg-[#1C1C1E] border border-[rgba(255,255,255,0.08)] flex items-center justify-center z-10 shrink-0">
                          <IconComp size={15} color={meta.color} />
                        </div>
                        <span className="text-[11px] font-extrabold text-[#F5F5F7] tabular-nums mt-1.5 mb-1.5 tracking-[0.2px]">{minuteStamp}</span>
                        <div className="flex-1 w-[2px] bg-[rgba(255,255,255,0.08)]" />
                      </div>
                      <div className="flex-1 bg-[#121212] p-5 rounded-[24px] mb-6 border border-[rgba(255,255,255,0.08)]">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="text-[11px] font-extrabold uppercase break-words" style={{ color: meta.color }}>{meta.label}</span>
                        </div>
                        <p className="text-[#F5F5F7] text-[14px] leading-[22px] font-medium text-left">{item.text || item.shortText}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })()}
          </div>
        </div>
      </div>
    </div>
  );
};

// 🏏 CRICKET TEAM HUB MODAL (ALIGNED RECENT FORM GRID)
// ==========================================

const CricketTeamModal = ({ team, existingStats, favorites, onToggleFavorite, onClose, onOpenMatch }) => {
  const { closing, handleClose } = useSmoothDismiss(onClose);
  const [teamTab, setTeamTab] = useState('squad');
  const ctTabs = useMemo(() => ['squad', 'stats', 'matches'], []);
  const ctSwipe = useSwipeSections(ctTabs, teamTab, setTeamTab, {
    onBoundaryPrev: handleClose,
    stopPropagation: true
  });
  const [teamData, setTeamData] = useState(() => {
    const teamIdStr = team.team_id || team.id;
    const cachedProf = teamIdStr ? getCachedSync(`${API_CRICKET_BASE}/team/${teamIdStr}`) : null;
    const cachedStd = getCachedSync(`${API_CRICKET_BASE}/standings`) || [];
    const cachedSched = getCachedSync(CRICKET_SCHEDULE_URL) || [];

    let foundStats = existingStats || cachedProf?.stats || null;
    let leagueName = stripSeasonYear(existingStats?._leagueTitle || team._leagueTitle || '');
    if (!foundStats && Array.isArray(cachedStd)) {
      cachedStd.forEach(lg => {
        (lg.tables || []).forEach(tbl => {
          (tbl.rows || []).forEach((row, idx) => {
            if (doesCricketTeamMatch(row, team)) {
              foundStats = { ...row.stats, rank: row.stats?.rank || idx + 1 };
              leagueName = stripSeasonYear(lg.league || tbl.name || 'Tournament Standings');
            }
          });
        });
      });
    }
    const { formItems, completedMatches } = deriveCricketRecentForm(team, cachedSched, cachedProf, foundStats);
    return {
      ...team,
      displayName: cachedProf?.team_name || team.name || team.short_name || 'Team Info',
      upcoming: [],
      completedMatches,
      stats: foundStats,
      leagueName,
      squad: cachedProf?.squad || [],
      recentForm: formItems
    };
  });

  useEffect(() => {
    let active = true;
    const teamIdStr = team.team_id || team.id;

    Promise.all([
      teamIdStr ? fetchWithCache(`${API_CRICKET_BASE}/team/${teamIdStr}`).catch(() => null) : Promise.resolve(null),
      fetchWithCache(`${API_CRICKET_BASE}/standings`).catch(() => []),
      fetchWithCache(`${API_CRICKET_BASE}/schedule?days_past=45&days_ahead=30`).catch(() => [])
    ]).then(([teamProf, stdRes, schedRes]) => {
      if (!active) return;
      const allSched = Array.isArray(schedRes) ? schedRes : [];
      const upcoming = allSched.filter(m => {
        const isTeamMatch = (m.teams || []).some(t => doesCricketTeamMatch(t, team));
        return isTeamMatch && (m.status === 'PRE' || m.status === 'SCHEDULED' || new Date(m.start_time) > new Date());
      }).sort((a, b) => new Date(a.start_time) - new Date(b.start_time)).slice(0, 5);

      let teamStats = existingStats || teamProf?.stats || null;
      let leagueName = stripSeasonYear(existingStats?._leagueTitle || team._leagueTitle || '');
      if (!teamStats && Array.isArray(stdRes)) {
        stdRes.forEach(lg => {
          (lg.tables || []).forEach(tbl => {
            (tbl.rows || []).forEach((row, idx) => {
              if (doesCricketTeamMatch(row, team)) {
                teamStats = { ...row.stats, rank: row.stats?.rank || idx + 1 };
                leagueName = stripSeasonYear(lg.league || tbl.name || 'Tournament Standings');
              }
            });
          });
        });
      }

      const { formItems, completedMatches } = deriveCricketRecentForm(team, allSched, teamProf, teamStats);

      setTeamData({
        ...team,
        displayName: teamProf?.team_name || team.name || team.short_name || 'Team Info',
        upcoming,
        completedMatches,
        stats: teamStats,
        leagueName,
        squad: teamProf?.squad || [],
        recentForm: formItems
      });

      (completedMatches || []).slice(0, 3).forEach(cm => {
        if (!cm.match_id) return;
        const hasScores = cm.teams?.[0]?.score && cm.teams?.[1]?.score;
        if (!hasScores) {
          fetchWithCache(`${API_CRICKET_BASE}/match/${cm.match_id}`).then(det => {
            if (!active || !det?.innings?.length) return;
            setTeamData(prev => {
              if (!prev) return prev;
              const updatedCompleted = (prev.completedMatches || []).map(item => {
                if (item.match_id !== cm.match_id) return item;
                const newTeams = (item.teams || []).map(t => {
                  const inn = det.innings.filter(i => i.team_name === t.name || i.team_name === t.short_name).pop();
                  return inn ? { ...t, score: `${inn.runs}/${inn.wickets} (${inn.overs} ov)` } : t;
                });
                return { ...item, teams: newTeams, status_text: det.status_text || item.status_text };
              });
              return { ...prev, completedMatches: updatedCompleted };
            });
          }).catch(() => {});
        }
      });
    });

    return () => { active = false; };
  }, [team, existingStats]);

  const squadGroups = useMemo(() => {
    if (!teamData?.squad) return [];
    const groups = { Batters: [], AllRounders: [], Wicketkeepers: [], Bowlers: [] };
    teamData.squad.forEach(p => {
      const role = String(p.playing_role || '').toUpperCase();
      if (role === 'AR') groups.AllRounders.push(p);
      else if (role === 'WK') groups.Wicketkeepers.push(p);
      else if (role === 'BL') groups.Bowlers.push(p);
      else groups.Batters.push(p);
    });
    return [
      { title: 'Batters', icon: Zap, color: THEME.fwd, data: groups.Batters },
      { title: 'All-Rounders', icon: Star, color: THEME.mid, data: groups.AllRounders },
      { title: 'Wicketkeepers', icon: Hand, color: THEME.warning, data: groups.Wicketkeepers },
      { title: 'Bowlers', icon: CircleDashed, color: THEME.def, data: groups.Bowlers }
    ].filter(g => g.data.length > 0);
  }, [teamData]);

  const renderCricketTeamStats = () => {
    const stats = teamData?.stats;
    const formList = teamData?.recentForm || [];
    const completed = teamData?.completedMatches || [];

    const winsCount = formList.filter(f => f.result === 'W').length;
    const lossCount = formList.filter(f => f.result === 'L').length;
    const winRate = formList.length > 0 ? Math.round((winsCount / formList.length) * 100) : 0;

    return (
      <div className="w-full">
        <div className="bg-[#121212] p-5 rounded-[32px] border border-[rgba(255,255,255,0.08)] mb-6">
          <div className="flex justify-between items-center mb-4 px-1">
            <span className="text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] uppercase">Recent Form</span>
            <span className="text-[10px] font-bold text-[#8E8E93] uppercase tracking-[1px]">Latest First</span>
          </div>

          {formList.length > 0 ? (
            <>
              <div className="grid grid-cols-5 gap-2 mb-4">
                {Array.from({ length: 5 }, (_, i) => {
                  const item = formList[i] || null;
                  if (!item) {
                    return (
                      <div key={i} className="bg-[#1C1C1E]/55 rounded-[16px] py-2.5 px-1 flex flex-col items-center justify-center border border-[rgba(255,255,255,0.05)] h-[92px]">
                        <div className="h-[12px] flex items-center justify-center" />
                        <div className="w-[34px] h-[34px] rounded-[10px] flex items-center justify-center border border-white/[0.08] bg-white/[0.03] my-1.5 shrink-0">
                          <span className="font-bold text-[12px] leading-none text-[#8E8E93]/60">—</span>
                        </div>
                        <div className="h-[14px] w-full flex items-center justify-center">
                          <span className="text-[9px] font-bold text-[#8E8E93]/40 leading-none">—</span>
                        </div>
                      </div>
                    );
                  }

                  const res = item.result;
                  let bgColor = THEME.surfaceHighlight;
                  let color = THEME.text;
                  if (res === 'W') { bgColor = `${THEME.success}20`; color = THEME.success; }
                  else if (res === 'L') { bgColor = `${THEME.danger}20`; color = THEME.danger; }
                  else if (res === 'D' || res === 'NR' || res === 'T') { bgColor = `${THEME.warning}20`; color = THEME.warning; }
                  const oppCode = getCompactCricketAbbr(item.opp);

                  return (
                    <div key={i} className="bg-[#1C1C1E] rounded-[16px] py-2.5 px-1 flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)] h-[92px] min-w-0">
                      <div className="h-[12px] flex items-center justify-center">
                        <span className={`text-[7px] font-black tracking-[0.6px] uppercase leading-none ${i === 0 ? 'text-[#0A84FF]' : 'invisible'}`}>
                          LATEST
                        </span>
                      </div>
                      <div className="w-[34px] h-[34px] rounded-[10px] flex items-center justify-center border my-1.5 shrink-0" style={{ backgroundColor: bgColor, borderColor: color }}>
                        <span className="font-black text-[13px] leading-none" style={{ color }}>{res}</span>
                      </div>
                      <div className="h-[14px] w-full flex items-center justify-center px-0.5">
                        <span className="text-[9px] font-bold text-[#8E8E93] text-center truncate max-w-full leading-none">
                          {oppCode ? `vs ${oppCode}` : `M${i + 1}`}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="grid grid-cols-3 gap-2 pt-3 border-t border-[rgba(255,255,255,0.08)]">
                <div className="bg-[#1C1C1E] rounded-[14px] py-2.5 px-2 text-center">
                  <span className="block text-[9px] font-extrabold text-[#8E8E93] tracking-[1px] uppercase mb-0.5">WINS</span>
                  <span className="text-[16px] font-extrabold text-[#32D74B] tabular-nums">{winsCount}</span>
                </div>
                <div className="bg-[#1C1C1E] rounded-[14px] py-2.5 px-2 text-center">
                  <span className="block text-[9px] font-extrabold text-[#8E8E93] tracking-[1px] uppercase mb-0.5">LOSSES</span>
                  <span className="text-[16px] font-extrabold text-[#FF453A] tabular-nums">{lossCount}</span>
                </div>
                <div className="bg-[#1C1C1E] rounded-[14px] py-2.5 px-2 text-center">
                  <span className="block text-[9px] font-extrabold text-[#8E8E93] tracking-[1px] uppercase mb-0.5">WIN RATE</span>
                  <span className="text-[16px] font-extrabold text-[#0A84FF] tabular-nums">{winRate}%</span>
                </div>
              </div>
            </>
          ) : (
            <span className="block text-[#8E8E93] text-[12px] italic px-1">No recent form fixtures recorded in the current window.</span>
          )}
        </div>

        {stats && (
          <div className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)] mb-6">

              <div className="w-full mb-5 flex flex-col items-center">
                <span className="text-[#8E8E93] text-[11px] font-extrabold tracking-[1.5px] uppercase mb-1.5 text-center">{teamData.leagueName}</span>

              </div>
            )}
            <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Tournament Standings</span>
            <div className="grid grid-cols-2 gap-3 mb-3">
              <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                <Activity size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">PLAYED</span>
                <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{stats.matchesplayed || stats.played || 0}</span>
              </div>
              <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                <Trophy size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">WINS</span>

        {completed.length > 0 && (
          <div className="mb-6">

              const a = m.teams[1];
              const hScore = formatCricketScore(h.score);
              const aScore = formatCricketScore(a.score);
              const { detailedStatus } = getCricketMatchStatus(m, new Date());
              return (
                <div
                  key={m.match_id || idx}
                  onClick={() => onOpenMatch({ ...m, _sport: 'cricket' })}
                  className="bg-[#121212] rounded-[24px] p-4 mb-3 border border-[rgba(255,255,255,0.08)] cursor-pointer active:opacity-80"

                  <div className="flex justify-between items-center mb-3 pb-2 border-b border-[rgba(255,255,255,0.08)]">
                    <span className="text-[10px] font-extrabold text-[#0A84FF] uppercase tracking-[0.5px] break-words leading-tight">{getShortLeagueName(m.league || m.title)}</span>
                    <span className="text-[10px] font-bold text-[#8E8E93]">{getFavFormattedDate(m.start_time, false)}</span>

                  <div className="flex items-center justify-between py-1">

                    <div className="text-right">

                      {hScore.overs && <span className="text-[11px] text-[#8E8E93] font-semibold ml-1.5">{hScore.overs}</span>}
                    </div>
                  </div>
                  <div className="flex items-center justify-between py-1 mt-1">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <img src={getCricketLogo(a)} style={getCricketLogoStyle(a)} onError={(e) => handleCricketImageError(e, a)} className="w-6 h-6 object-contain shrink-0" alt="" />
                      <span className="text-[14px] font-bold text-[#F5F5F7] break-words leading-snug">{a.short_name || a.name}</span>
                    </div>
                    <div className="text-right">
                      <span className="text-[14px] font-extrabold text-[#F5F5F7] tabular-nums">{aScore.runs || '—'}</span>
                      {aScore.overs && <span className="text-[11px] text-[#8E8E93] font-semibold ml-1.5">{aScore.overs}</span>}
                    </div>
                  </div>
                  {(detailedStatus || m.status_text) && (
                    <div className="mt-2.5 pt-2 border-t border-[rgba(255,255,255,0.08)] flex items-center justify-between">
                      <span className="text-[11px] font-bold text-[#32D74B] break-words leading-snug">{detailedStatus || m.status_text}</span>
                      <span className="text-[10px] font-extrabold text-[#8E8E93] uppercase">Scorecard →</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  const favKey = String(teamData?.id || teamData?.team_id || teamData?.name || '');
  const isFav = favorites.includes(favKey);

  return (
    <div className={`fixed inset-0 z-50 bg-black/70 ${closing ? 'ios-backdrop-out' : 'ios-backdrop-in'} flex flex-col justify-end`}>
      <div className="absolute inset-0" onClick={handleClose} />
      <div className={`relative h-[94vh] max-w-md w-full mx-auto pt-4 bg-[#000000] rounded-t-[40px] flex flex-col overflow-hidden border-t border-[rgba(255,255,255,0.12)] ${closing ? 'ios-sheet-down' : 'ios-sheet-up'} transform-gpu`}>
        <div className="w-full h-[30px] flex items-center justify-center cursor-pointer shrink-0" onClick={handleClose}>
          <div className="w-[48px] h-[5px] bg-[rgba(255,255,255,0.08)] rounded-[3px]" />

        <div className="flex justify-between items-center px-5 pb-2 shrink-0">
          <button onClick={handleClose} className="w-[44px] h-[44px] rounded-full bg-[#121212] flex items-center justify-center border border-[rgba(255,255,255,0.08)]">
            <ChevronDown size={28} color={THEME.text} />
          </button>
          <button onClick={() => onToggleFavorite(favKey)} className="w-[44px] h-[44px] rounded-full bg-[#121212] flex items-center justify-center border border-[rgba(255,255,255,0.08)]">
            <Star size={24} color={THEME.accent} fill={isFav ? THEME.accent : 'none'} />
          </button>
        </div>

        <div className="flex-1 flex flex-col min-h-0">
          <div className="flex flex-col items-center px-5 shrink-0">
            <img src={getCricketLogo(teamData)} style={getCricketLogoStyle(teamData)} onError={(e) => handleCricketImageError(e, teamData)} className="w-[68px] h-[68px] object-contain mb-2" alt="" />
            <h2 className="text-[22px] font-black text-[#F5F5F7] mb-4 text-center">{teamData.displayName}</h2>

            <div className="flex items-center gap-1 bg-[#1C1C1E] rounded-[16px] p-1 w-full mb-5 border border-[rgba(255,255,255,0.08)]">
              {ctTabs.map(t => {
                const active = teamTab === t;
                return (
                  <button
                    key={t}
                    onClick={() => ctSwipe.selectWithDir(t)}
                    className={`flex-auto py-2.5 px-2.5 rounded-[12px] text-[12px] leading-none text-center whitespace-nowrap transition-colors duration-150 ${active ? 'bg-[#2C2C2E] text-[#F5F5F7] font-extrabold shadow-sm' : 'text-[#8E8E93] font-bold'}`}

                    {capitalize(t)}
                  </button>
                );
              })}
            </div>
          </div>

          <div {...ctSwipe.bind} className="flex-1 overflow-y-auto px-4 pb-16 [&::-webkit-scrollbar]:hidden">
            <div ref={ctSwipe.contentRef} key={teamTab} className={ctSwipe.animClass}>
            {teamTab === 'stats' && renderCricketTeamStats()}
            {teamTab === 'squad' && (
              squadGroups.length === 0 ? (
                <EmptyState icon={Users} title="Squad Pending" message="Roster data has not been published for this team yet." />
              ) : (
                squadGroups.map(g => {

                  return (
                    <div key={g.title} className="px-1 mb-8">
                      <div className="flex items-center gap-2.5 mb-5 pb-2.5 border-b border-[rgba(255,255,255,0.08)]">
                        <IconComp size={18} color={g.color} className="shrink-0" />
                        <span className="text-[14px] font-extrabold tracking-[1px] uppercase" style={{ color: g.color }}>{g.title}</span>
                      </div>
                      {g.data.map((p, idx) => {
                        const detailsList = [p.batting_style, p.bowling_style].filter(Boolean);
                        return (
                          <div key={p.id || idx} className="flex items-center bg-[#121212] p-4 rounded-[20px] mb-2.5 border border-[rgba(255,255,255,0.08)]">
                            <div className="w-[36px] h-[36px] rounded-full flex items-center justify-center mr-4 shrink-0" style={{ backgroundColor: `${g.color}20` }}>
                              <User size={16} color={g.color} />
                            </div>
                            <div className="flex-1 min-w-0">
                              <span className="block text-[#F5F5F7] text-[15px] font-bold break-words leading-snug">{cleanPlayerName(p.name)}</span>
                              {detailsList.length > 0 && <span className="block text-[#8E8E93] text-[12px] mt-1 font-medium break-words leading-snug">{detailsList.join(' • ')}</span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })
              )
            )}
            {teamTab === 'matches' && (
              teamData.upcoming?.length === 0 ? (
                <EmptyState icon={Calendar} title="No Upcoming Fixtures" message="This team does not have any scheduled matches." />
              ) : (
                teamData.upcoming.map((m, idx) => {
                  if (!m.teams || m.teams.length < 2) return null;
                  const h = m.teams[0];
                  const a = m.teams[1];
                  return (
                    <div key={idx} onClick={() => onOpenMatch({ ...m, _sport: 'cricket' })} className="bg-[#121212] rounded-[24px] p-5 flex items-center justify-between mb-4 border border-[rgba(255,255,255,0.08)] cursor-pointer">
                      <div className="flex-1 flex flex-col items-center gap-1.5">
                        <img src={getCricketLogo(h)} style={getCricketLogoStyle(h)} onError={(e) => handleCricketImageError(e, h)} className="w-[44px] h-[44px] object-contain" alt="" />
                        <span className="text-[11px] font-bold text-[#F5F5F7] text-center break-words leading-tight">{h.short_name || h.name}</span>
                      </div>
                      <div className="w-[120px] flex flex-col items-center justify-center">
                        <span className="text-[9px] font-extrabold text-[#0A84FF] tracking-[0.5px] mb-1.5 text-center uppercase max-w-[100px]">{getShortLeagueName(m.league)}</span>
                        <span className="text-[12px] text-[#8E8E93] font-bold text-center mt-1.5">{getFavFormattedDate(m.start_time, false)}</span>
                      </div>
                      <div className="flex-1 flex flex-col items-center gap-1.5">
                        <img src={getCricketLogo(a)} style={getCricketLogoStyle(a)} onError={(e) => handleCricketImageError(e, a)} className="w-[44px] h-[44px] object-contain" alt="" />
                        <span className="text-[11px] font-bold text-[#F5F5F7] text-center break-words leading-tight">{a.short_name || a.name}</span>
                      </div>
                    </div>
                  );
                })
              )
            )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ⚽ SOCCER TEAM HUB MODAL

const FootballTeamModal = ({ team, leagueId, existingStats, standingRank, favorites, onToggleFavorite, onClose, onOpenMatch }) => {
  const { closing, handleClose } = useSmoothDismiss(onClose);
  const [teamData, setTeamData] = useState(null);
  const [teamTab, setTeamTab] = useState('squad');
  const ftTabs = useMemo(() => ['squad', 'stats', 'matches'], []);
  const ftSwipe = useSwipeSections(ftTabs, teamTab, setTeamTab, {
    onBoundaryPrev: handleClose,
    stopPropagation: true
  });

  useEffect(() => {
    let active = true;
    const fetchHubData = async () => {
      let lid = leagueId;
      if (!lid) {
        const allInfo = await fetchWithCache(`${API_SOCCER_SCORE_BASE}/all/teams/${team.id}`).catch(() => null);
        const defSlug = allInfo?.team?.defaultLeague?.slug || allInfo?.team?.leagues?.[0]?.slug || '';
        if (defSlug && FOOTBALL_LEAGUES.some(l => l.id === defSlug)) {
          lid = defSlug;
        } else {
          const checks = await Promise.all(FOOTBALL_LEAGUES.map(l => fetchWithCache(`${API_SOCCER_SCORE_BASE}/${l.id}/teams/${team.id}`).then(() => l.id).catch(() => null)));
          lid = checks.find(id => id !== null) || 'eng.1';
        }
      }
      try {
        const [info, roster, scheduleRes, fixturesRes, stdRes] = await Promise.all([
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${lid}/teams/${team.id}`).catch(() => ({})),
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${lid}/teams/${team.id}/roster`).catch(() => ({})),
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${lid}/teams/${team.id}/schedule`).catch(() => ({})),
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${lid}/teams/${team.id}/schedule?fixture=true`).catch(() => ({})),
          fetchWithCache(`${API_SOCCER_STANDINGS_BASE}/${lid}/standings`).catch(() => null)
        ]);
        if (!active) return;

        const b = info.team || {};
        const namesToTry = [b.displayName, team.displayName, b.shortDisplayName, team.shortDisplayName, b.name, team.name].filter(Boolean);
        const stdEntry = extractFootballStandingEntry(stdRes, team.id, namesToTry[0]);
        const resolvedRank = standingRank || stdEntry?._computedRank || stdEntry?.stats?.find(s => s.name === 'rank')?.value || b.standingSummary || null;
        const resolvedStats = existingStats || stdEntry?.stats || b.record?.items?.[0]?.stats || [];
        const leagueObj = FOOTBALL_LEAGUES.find(l => l.id === lid);

        const getVal = (n) => resolvedStats.find(s => s.name === n)?.displayValue || resolvedStats.find(s => s.name === n)?.value || '0';
        const wdlSummary = resolvedStats.length > 0 ? `${getVal('wins')}-${getVal('ties')}-${getVal('losses')}` : (b.record?.items?.[0]?.summary || '0-0-0');

        const combinedSchedule = [...(fixturesRes?.events || []), ...(scheduleRes?.events || []), ...(b.nextEvent || [])];
        const seenEventIds = new Set();
        const now = new Date();
        const upcoming = combinedSchedule.filter(e => {
          if (!e?.id || seenEventIds.has(e.id)) return false;
          seenEventIds.add(e.id);
          const state = e.competitions?.[0]?.status?.type?.state || e.status?.type?.state;
          return state === 'pre' || new Date(e.date) >= now;
        }).sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 5);

        const apiV = b.venue || (b.venues && b.venues[0]) || b.franchise?.venue || null;
        const schedV = extractHomeVenueFromSchedule(combinedSchedule, b.id || team.id, namesToTry);
        const venueInfo = lookupFootballStadium(namesToTry, apiV, schedV);
        const cleanLeagueTitle = stripSeasonYear(leagueObj?.name || stdEntry?._groupName || 'League Standings');

        setTeamData({
          ...team,
          ...b,
          id: b.id || team.id,
          displayName: b.displayName || team.displayName || team.shortDisplayName || team.name,
          logo: getSafeFootballLogo({ ...team, ...b }),
          athletes: roster.athletes || [],
          records: [{
            leagueName: cleanLeagueTitle,
            rank: resolvedRank,
            summary: wdlSummary,
            stats: resolvedStats
          }],
          upcoming,
          ...venueInfo
        });
      } catch {
        if (active) setTeamData({ ...team, displayName: team.displayName || team.name, athletes: [], records: [], upcoming: [] });
      }
    };
    fetchHubData();
    return () => { active = false; };
  }, [team, leagueId, existingStats, standingRank]);

  const squadGroups = useMemo(() => {
    if (!teamData?.athletes) return [];
    const groups = { Forwards: [], Midfielders: [], Defenders: [], Goalkeepers: [] };
    teamData.athletes.forEach(a => {
      const p = a.athlete || a;
      const pos = String(p.position?.name || p.position?.displayName || '').toLowerCase();
      if (pos.includes('keeper')) groups.Goalkeepers.push(p);
      else if (pos.includes('back') || pos.includes('defend')) groups.Defenders.push(p);
      else if (pos.includes('midfield') || pos.includes('wing')) groups.Midfielders.push(p);
      else groups.Forwards.push(p);
    });
    return [
      { title: 'Forwards', icon: Zap, color: THEME.fwd, data: groups.Forwards },
      { title: 'Midfielders', icon: MapIcon, color: THEME.mid, data: groups.Midfielders },
      { title: 'Defenders', icon: Shield, color: THEME.def, data: groups.Defenders },
      { title: 'Goalkeepers', icon: Hand, color: THEME.goalie, data: groups.Goalkeepers }
    ].filter(g => g.data.length > 0);
  }, [teamData]);

  const renderTeamSeasonStats = () => {
    if (!teamData) return null;
    const records = teamData.records || [];
    const defaultStadiumImg = 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=800&q=80';
    const displayImg = teamData.stadiumImage || defaultStadiumImg;

    return (
      <div className="w-full">
        {records.map((rec, index) => {
          const stats = rec.stats || [];
          const getStat = (nArr) => {
            for (const n of nArr) {
              const s = stats.find(x => x.name === n);
              if (s) return s.displayValue || s.value?.toString() || '0';
            }
            return '0';
          };
          let total = parseInt(getStat(['gamesPlayed']));
          const wins = parseInt(getStat(['wins'])) || 0;
          const ties = parseInt(getStat(['ties', 'draws'])) || 0;
          const losses = parseInt(getStat(['losses'])) || 0;
          if (isNaN(total) || total === 0) total = wins + ties + losses;
          const gf = parseInt(getStat(['pointsFor', 'goalsFor'])) || 0;
          const ga = parseInt(getStat(['pointsAgainst', 'goalsAgainst'])) || 0;
          const gd = parseInt(getStat(['pointDifferential', 'goalDifference'])) || (gf - ga);
          const pts = getStat(['points']);

          return (
            <div key={index} className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)] mb-6">
              <div className="w-full mb-5 flex flex-col items-center">
                <span className="text-[#8E8E93] text-[11px] font-extrabold tracking-[1.5px] uppercase mb-2 text-center">{rec.leagueName}</span>
                <span className="text-[#F5F5F7] text-[18px] font-extrabold">
                  {rec.rank ? `Position #${rec.rank} • ` : ''}{rec.summary || `${wins}-${ties}-${losses}`}
                </span>
              </div>

              <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Overview</span>
              <div className="grid grid-cols-2 gap-3 mb-3">
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <Activity size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">PLAYED</span>
                  <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{total}</span>
                </div>
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <Trophy size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">WINS</span>
                  <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{wins}</span>
                </div>
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <Scale size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">DRAWS</span>
                  <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{ties}</span>
                </div>
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <XCircle size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">LOSSES</span>
                  <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{losses}</span>
                </div>
              </div>

              <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 mt-2.5 uppercase">Performance</span>
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <CircleDashed size={16} color={THEME.success} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">GOALS FOR</span>
                  <span className="text-[24px] font-extrabold tabular-nums" style={{ color: THEME.success }}>{gf}</span>
                </div>

};

// ==========================================
