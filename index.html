                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })
              )
            )}
            {teamTab === 'matches' && (
              teamData.upcoming?.length === 0 ? (
                <EmptyState icon={Calendar} title="No Upcoming Fixtures" message="This team does not have any scheduled matches." />
              ) : (
                teamData.upcoming.map((m, idx) => {
                  if (!m.teams || m.teams.length < 2) return null;
                  const h = m.teams[0];
                  const a = m.teams[1];
                  return (
                    <div key={idx} onClick={() => onOpenMatch({ ...m, _sport: 'cricket' })} className="bg-[#121212] rounded-[24px] p-5 flex items-center justify-between mb-4 border border-[rgba(255,255,255,0.08)] cursor-pointer">
                      <div className="flex-1 flex flex-col items-center gap-1.5">
                        <img src={getCricketLogo(h)} onError={(e) => handleImageError(e, h.short_name || h.name)} className="w-[44px] h-[44px] object-contain" alt="" />
                        <span className="text-[11px] font-bold text-[#F5F5F7] text-center break-words leading-tight">{h.short_name || h.name}</span>
                      </div>
                      <div className="w-[120px] flex flex-col items-center justify-center">
                        <span className="text-[9px] font-extrabold text-[#0A84FF] tracking-[0.5px] mb-1.5 text-center uppercase truncate max-w-[100px]">{getShortLeagueName(m.league)}</span>
                        <span className="text-[12px] text-[#8E8E93] font-bold text-center mt-1.5">{getFavFormattedDate(m.start_time, false)}</span>
                      </div>
                      <div className="flex-1 flex flex-col items-center gap-1.5">
                        <img src={getCricketLogo(a)} onError={(e) => handleImageError(e, a.short_name || a.name)} className="w-[44px] h-[44px] object-contain" alt="" />
                        <span className="text-[11px] font-bold text-[#F5F5F7] text-center break-words leading-tight">{a.short_name || a.name}</span>
                      </div>
                    </div>
                  );
                })
              )
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

// ==========================================
// ⚽ SOCCER TEAM HUB MODAL
// ==========================================

const FootballTeamModal = ({ team, leagueId, existingStats, standingRank, favorites, onToggleFavorite, onClose, onOpenMatch }) => {
  const [teamData, setTeamData] = useState(null);
  const [teamTab, setTeamTab] = useState('squad');

  useEffect(() => {
    let active = true;
    const fetchHubData = async () => {
      let lid = leagueId;
      if (!lid) {
        const checks = await Promise.all(FOOTBALL_LEAGUES.map(l => fetchWithCache(`${API_SOCCER_SCORE_BASE}/${l.id}/teams/${team.id}`).then(() => l.id).catch(() => null)));
        lid = checks.find(id => id !== null) || 'eng.1';
      }
      try {
        const [info, roster, scheduleRes, fixturesRes, stdRes] = await Promise.all([
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${lid}/teams/${team.id}`).catch(() => ({})),
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${lid}/teams/${team.id}/roster`).catch(() => ({})),
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${lid}/teams/${team.id}/schedule`).catch(() => ({})),
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${lid}/teams/${team.id}/schedule?fixture=true`).catch(() => ({})),
          fetchWithCache(`${API_SOCCER_STANDINGS_BASE}/${lid}/standings`).catch(() => null)
        ]);
        if (!active) return;

        const b = info.team || {};
        const namesToTry = [b.displayName, team.displayName, b.shortDisplayName, team.shortDisplayName, b.name, team.name].filter(Boolean);
        const stdEntry = extractFootballStandingEntry(stdRes, team.id, namesToTry[0]);
        const resolvedRank = standingRank || stdEntry?._computedRank || stdEntry?.stats?.find(s => s.name === 'rank')?.value || b.standingSummary || null;
        const resolvedStats = existingStats || stdEntry?.stats || b.record?.items?.[0]?.stats || [];
        const leagueObj = FOOTBALL_LEAGUES.find(l => l.id === lid);

        const getVal = (n) => resolvedStats.find(s => s.name === n)?.displayValue || resolvedStats.find(s => s.name === n)?.value || '0';
        const wdlSummary = resolvedStats.length > 0 ? `${getVal('wins')}-${getVal('ties')}-${getVal('losses')}` : (b.record?.items?.[0]?.summary || '0-0-0');

        const combinedSchedule = [...(fixturesRes?.events || []), ...(scheduleRes?.events || []), ...(b.nextEvent || [])];
        const seenEventIds = new Set();
        const now = new Date();
        const upcoming = combinedSchedule.filter(e => {
          if (!e?.id || seenEventIds.has(e.id)) return false;
          seenEventIds.add(e.id);
          const state = e.competitions?.[0]?.status?.type?.state || e.status?.type?.state;
          return state === 'pre' || new Date(e.date) >= now;
        }).sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 5);

        const apiV = b.venue || (b.venues && b.venues[0]) || b.franchise?.venue || null;
        const venueInfo = lookupFootballStadium(namesToTry, apiV);
        const cleanLeagueTitle = stripSeasonYear(leagueObj?.name || stdEntry?._groupName || 'League Standings');

        setTeamData({
          ...team,
          ...b,
          id: b.id || team.id,
          displayName: b.displayName || team.displayName || team.shortDisplayName || team.name,
          logo: getSafeFootballLogo({ ...team, ...b }),
          athletes: roster.athletes || [],
          records: [{
            leagueName: cleanLeagueTitle,
            rank: resolvedRank,
            summary: wdlSummary,
            stats: resolvedStats
          }],
          upcoming,
          ...venueInfo
        });
      } catch {
        if (active) setTeamData({ ...team, displayName: team.displayName || team.name, athletes: [], records: [], upcoming: [] });
      }
    };
    fetchHubData();
    return () => { active = false; };
  }, [team, leagueId, existingStats, standingRank]);

  const squadGroups = useMemo(() => {
    if (!teamData?.athletes) return [];
    const groups = { Forwards: [], Midfielders: [], Defenders: [], Goalkeepers: [] };
    teamData.athletes.forEach(a => {
      const p = a.athlete || a;
      const pos = String(p.position?.name || p.position?.displayName || '').toLowerCase();
      if (pos.includes('keeper')) groups.Goalkeepers.push(p);
      else if (pos.includes('back') || pos.includes('defend')) groups.Defenders.push(p);
      else if (pos.includes('midfield') || pos.includes('wing')) groups.Midfielders.push(p);
      else groups.Forwards.push(p);
    });
    return [
      { title: 'Forwards', icon: Zap, color: THEME.fwd, data: groups.Forwards },
      { title: 'Midfielders', icon: MapIcon, color: THEME.mid, data: groups.Midfielders },
      { title: 'Defenders', icon: Shield, color: THEME.def, data: groups.Defenders },
      { title: 'Goalkeepers', icon: Hand, color: THEME.goalie, data: groups.Goalkeepers }
    ].filter(g => g.data.length > 0);
  }, [teamData]);

  const renderTeamSeasonStats = () => {
    if (!teamData) return null;
    const records = teamData.records || [];
    const defaultStadiumImg = 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=800&q=80';
    const displayImg = teamData.stadiumImage || defaultStadiumImg;

    return (
      <div className="w-full">
        {records.map((rec, index) => {
          const stats = rec.stats || [];
          const getStat = (nArr) => {
            for (const n of nArr) {
              const s = stats.find(x => x.name === n);
              if (s) return s.displayValue || s.value?.toString() || '0';
            }
            return '0';
          };
          let total = parseInt(getStat(['gamesPlayed']));
          const wins = parseInt(getStat(['wins'])) || 0;
          const ties = parseInt(getStat(['ties', 'draws'])) || 0;
          const losses = parseInt(getStat(['losses'])) || 0;
          if (isNaN(total) || total === 0) total = wins + ties + losses;
          const gf = parseInt(getStat(['pointsFor', 'goalsFor'])) || 0;
          const ga = parseInt(getStat(['pointsAgainst', 'goalsAgainst'])) || 0;
          const gd = parseInt(getStat(['pointDifferential', 'goalDifference'])) || (gf - ga);
          const pts = getStat(['points']);

          return (
            <div key={index} className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)] mb-6">
              <div className="w-full mb-5 flex flex-col items-center">
                <span className="text-[#8E8E93] text-[11px] font-extrabold tracking-[1.5px] uppercase mb-2 text-center">{rec.leagueName}</span>
                <span className="text-[#F5F5F7] text-[18px] font-extrabold">
                  {rec.rank ? `Position #${rec.rank} • ` : ''}{rec.summary || `${wins}-${ties}-${losses}`}
                </span>
              </div>

              <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Overview</span>
              <div className="grid grid-cols-2 gap-3 mb-3">
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <Activity size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">PLAYED</span>
                  <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{total}</span>
                </div>
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <Trophy size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">WINS</span>
                  <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{wins}</span>
                </div>
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <Scale size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">DRAWS</span>
                  <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{ties}</span>
                </div>
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <XCircle size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">LOSSES</span>
                  <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{losses}</span>
                </div>
              </div>

              <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 mt-2.5 uppercase">Performance</span>
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <CircleDashed size={16} color={THEME.success} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">GOALS FOR</span>
                  <span className="text-[24px] font-extrabold tabular-nums" style={{ color: THEME.success }}>{gf}</span>
                </div>
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <AlertCircle size={16} color={THEME.danger} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">GOALS AGST</span>
                  <span className="text-[24px] font-extrabold tabular-nums" style={{ color: THEME.danger }}>{ga}</span>
                </div>
                <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                  <ArrowRightLeft size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                  <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">DIFFERENCE</span>
                  <span className="text-[24px] font-extrabold tabular-nums" style={{ color: gd > 0 ? THEME.success : gd < 0 ? THEME.danger : THEME.text }}>
                    {gd > 0 ? `+${gd}` : gd}
                  </span>
                </div>
                <div className="py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border" style={{ backgroundColor: THEME.accentMuted, borderColor: THEME.accent }}>
                  <Star size={16} color={THEME.accent} className="mb-1.5 shrink-0" />
                  <span className="text-[10px] font-extrabold tracking-[1.5px] mb-1" style={{ color: THEME.accent }}>POINTS</span>
                  <span className="text-[24px] font-extrabold tabular-nums" style={{ color: THEME.accent }}>{pts}</span>
                </div>
              </div>
            </div>
          );
        })}

        <div className="mt-5 mb-10 w-full">
          <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Home Ground</span>
          <div className="h-[180px] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] bg-[#121212] relative">
            <img src={displayImg} alt="Stadium" loading="lazy" decoding="async" className="absolute inset-0 w-full h-full object-cover" />
            <div className="absolute inset-0 bg-black/60" />
            <div className="relative z-10 h-full p-5 flex flex-col justify-end">
              <div className="flex items-center mb-3.5">
                <Landmark size={28} color={THEME.text} className="shrink-0" />
                <div className="flex-1 ml-4 min-w-0">
                  <span className="block text-white text-[20px] font-extrabold break-words leading-tight">{teamData.stadium}</span>
                  <span className="block text-[#ccc] text-[12px] font-bold tracking-[1px] mt-0.5 uppercase break-words leading-snug">{teamData.city}</span>
                </div>
              </div>
              <div className="flex border-t border-white/20 pt-3.5 gap-4">
                {teamData.capacity && (
                  <div className="min-w-[45%]">
                    <span className="block text-[#aaa] text-[10px] font-bold mb-1 uppercase">Capacity</span>
                    <span className="block text-white text-[14px] font-extrabold">{teamData.capacity.toLocaleString()}</span>
                  </div>
                )}
                <div className="min-w-[45%]">
                  <span className="block text-[#aaa] text-[10px] font-bold mb-1 uppercase">Location</span>
                  <span className="block text-white text-[14px] font-extrabold">{teamData.city}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  };

  const favId = String(teamData?.id || team?.id || '');
  const isFav = favorites.includes(favId);

  return (
    <div className="fixed inset-0 z-50 bg-black/70 ios-backdrop-in flex flex-col justify-end">
      <div className="absolute inset-0" onClick={onClose} />
      <div className="relative h-[94vh] max-w-md w-full mx-auto pt-4 bg-[#000000] rounded-t-[40px] flex flex-col overflow-hidden border-t border-[rgba(255,255,255,0.12)] ios-sheet-up transform-gpu">
        <div className="w-full h-[30px] flex items-center justify-center cursor-pointer shrink-0" onClick={onClose}>
          <div className="w-[48px] h-[5px] bg-[rgba(255,255,255,0.08)] rounded-[3px]" />
        </div>

        <div className="flex justify-between items-center px-5 pb-2 shrink-0">
          <button onClick={onClose} className="w-[44px] h-[44px] rounded-full bg-[#121212] flex items-center justify-center border border-[rgba(255,255,255,0.08)]">
            <ChevronDown size={28} color={THEME.text} />
          </button>
          <button onClick={() => onToggleFavorite(favId)} className="w-[44px] h-[44px] rounded-full bg-[#121212] flex items-center justify-center border border-[rgba(255,255,255,0.08)]">
            <Star size={24} color={THEME.accent} fill={isFav ? THEME.accent : 'none'} />
          </button>
        </div>

        {!teamData ? (
          <WhitePillLoader className="mt-12 py-6" />
        ) : (
          <div className="flex-1 flex flex-col min-h-0">
            <div className="flex flex-col items-center px-5 shrink-0">
              <img src={getSafeFootballLogo(teamData)} onError={(e) => handleImageError(e, teamData.displayName)} className="w-[68px] h-[68px] object-contain mb-2" alt="" />
              <h2 className="text-[22px] font-black text-[#F5F5F7] mb-4 text-center">{teamData.displayName}</h2>

              <div className="grid grid-cols-3 items-center bg-[#1C1C1E] rounded-[16px] p-1 w-full mb-5 border border-[rgba(255,255,255,0.08)]">
                {['squad', 'stats', 'matches'].map(t => {
                  const active = teamTab === t;
                  return (
                    <button
                      key={t}
                      onClick={() => setTeamTab(t)}
                      className={`py-2.5 px-2 rounded-[12px] text-[12px] leading-none text-center truncate transition-all ${active ? 'bg-[#2C2C2E] text-[#F5F5F7] font-extrabold shadow-sm' : 'text-[#8E8E93] font-bold'}`}
                    >
                      {capitalize(t)}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="flex-1 overflow-y-auto px-4 pb-16 [&::-webkit-scrollbar]:hidden">
              {teamTab === 'stats' && renderTeamSeasonStats()}
              {teamTab === 'squad' && squadGroups.map(g => {
                const IconComp = g.icon;
                return (
                  <div key={g.title} className="px-1 mb-8">
                    <div className="flex items-center gap-2.5 mb-5 pb-2.5 border-b border-[rgba(255,255,255,0.08)]">
                      <IconComp size={18} color={g.color} className="shrink-0" />
                      <span className="text-[14px] font-extrabold tracking-[1px] uppercase" style={{ color: g.color }}>{g.title}</span>
                    </div>
                    {g.data.map(p => (
                      <div key={p.id} className="flex items-center bg-[#121212] p-4 rounded-[20px] mb-2.5 border border-[rgba(255,255,255,0.08)]">
                        <div className="w-[36px] h-[36px] rounded-full flex items-center justify-center mr-4 shrink-0" style={{ backgroundColor: `${g.color}20` }}>
                          <span className="text-[14px] font-extrabold" style={{ color: g.color }}>{p.jersey || '#'}</span>
                        </div>
                        <span className="text-[#F5F5F7] text-[15px] font-bold break-words leading-snug">{p.displayName}</span>
                      </div>
                    ))}
                  </div>
                );
              })}
              {teamTab === 'matches' && (
                teamData.upcoming?.length === 0 ? (
                  <EmptyState icon={Calendar} title="No Upcoming Fixtures" message="This team does not have any scheduled matches." />
                ) : (
                  teamData.upcoming.map((m, idx) => {
                    const comps = m?.competitions?.[0]?.competitors;
                    if (!comps) return null;
                    const h = comps.find(c => c.homeAway === 'home');
                    const a = comps.find(c => c.homeAway === 'away');
                    return (
                      <div key={idx} onClick={() => onOpenMatch({ ...m, _sport: 'soccer' })} className="bg-[#121212] rounded-[24px] p-5 flex items-center justify-between mb-4 border border-[rgba(255,255,255,0.08)] cursor-pointer">
                        <div className="flex-1 flex flex-col items-center gap-1.5">
                          <img src={getSafeFootballLogo(h?.team)} onError={(e) => handleImageError(e, h?.team?.shortDisplayName)} className="w-[44px] h-[44px] object-contain" alt="" />
                          <span className="text-[11px] font-bold text-[#F5F5F7] text-center">{h?.team?.shortDisplayName}</span>
                        </div>
                        <div className="w-[120px] flex flex-col items-center justify-center">
                          <span className="text-[9px] font-extrabold text-[#0A84FF] tracking-[0.5px] mb-1.5 text-center uppercase truncate max-w-[100px]">{getFootballMatchLeagueName(m)}</span>
                          <span className="text-[12px] text-[#8E8E93] font-bold text-center mt-1.5">{getFavFormattedDate(m.date, false)}</span>
                        </div>
                        <div className="flex-1 flex flex-col items-center gap-1.5">
                          <img src={getSafeFootballLogo(a?.team)} onError={(e) => handleImageError(e, a?.team?.shortDisplayName)} className="w-[44px] h-[44px] object-contain" alt="" />
                          <span className="text-[11px] font-bold text-[#F5F5F7] text-center">{a?.team?.shortDisplayName}</span>
                        </div>
                      </div>
                    );
                  })
                )
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// ==========================================
// 🚀 MAIN APP WRAPPER

function App() {
  const [activeSport, setActiveSport] = useState('soccer');
  const [view, setView] = useState('scores');
  const [date, setDate] = useState(() => new Date());
  const [dateDir, setDateDir] = useState(1);

  const handleSelectDateSmooth = useCallback((nextDate) => {
    setDate(prev => {
      const prevDay = new Date(prev.getFullYear(), prev.getMonth(), prev.getDate()).getTime();
      const nextDay = new Date(nextDate.getFullYear(), nextDate.getMonth(), nextDate.getDate()).getTime();
      if (nextDay !== prevDay) setDateDir(nextDay > prevDay ? 1 : -1);
      return nextDate;
    });
  }, []);
  const [, startTransition] = useTransition();

  const [footballMatches, setSoccerMatches] = useState([]);
  const [cricketMatches, setCricketMatches] = useState([]);
  const [favMatches, setFavMatches] = useState([]);
  const [loading, setLoading] = useState(false);
  const [refreshTick, setRefreshTick] = useState(0);

  const [pullDistance, setPullDistance] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);

  useEffect(() => {
    const el = document.getElementById('sideline-opening');
    if (!el) return;
    const timer = setTimeout(() => {

  const [activeMatch, setActiveMatch] = useState(null);

  const [favoritesList, setFavoritesList] = useState(() => {
    try {
      const savedUnified = JSON.parse(localStorage.getItem('sideline_unified_favorites') || 'null');
      const map = new Map();
      if (Array.isArray(savedUnified)) {
        savedUnified.forEach(item => {
          if (item && item.id && (item.sport === 'soccer' || item.sport === 'cricket')) {
            const idStr = String(item.id);
            map.set(`${item.sport}:${idStr}`, { id: idStr, sport: item.sport });
          }
        });
      }
      const legacySoccer = JSON.parse(localStorage.getItem('fav_teams') || '[]');
      if (Array.isArray(legacySoccer)) {
        legacySoccer.forEach(id => {
          if (id) {
            const idStr = String(id);
            map.set(`soccer:${idStr}`, { id: idStr, sport: 'soccer' });
          }
        });
      }
      const legacyCricket = JSON.parse(localStorage.getItem('fav_cricket_teams') || '[]');
      if (Array.isArray(legacyCricket)) {
        legacyCricket.forEach(id => {
          if (id) {
            const idStr = String(id);
            map.set(`cricket:${idStr}`, { id: idStr, sport: 'cricket' });
          }
        });
      }
      const migrated = Array.from(map.values());
      localStorage.setItem('sideline_unified_favorites', JSON.stringify(migrated));

  const persistUnifiedFavorites = useCallback((nextList) => {

  }, []);

  const toggleFavorite = useCallback((sport, teamId) => {
    if (!teamId || !sport) return;
    const idStr = String(teamId);
    setFavoritesList(prev => {
      const exists = prev.some(f => f.sport === sport && String(f.id) === idStr);

      persistUnifiedFavorites(next);
      return next;

  const footballFavs = useMemo(

  const dates = useMemo(() => {

      const d = new Date();

  const stepScoreDate = useCallback((deltaDays) => {

  const fetchFootballMatches = useCallback(async (isSilent = false, forceRefresh = false) => {
    const ds = date.toISOString().split('T')[0].replace(/-/g, '');
    const cachedEvents = [];
    if (!forceRefresh) {
      FOOTBALL_LEAGUES.forEach(l => {
        const c = getCachedSync(`${API_SOCCER_SCORE_BASE}/${l.id}/scoreboard?dates=${ds}`);
        if (c?.events) cachedEvents.push(...c.events.map(e => ({ ...e, _leagueId: l.id })));
      });

    if (cachedEvents.length > 0) {
      setSoccerMatches(cachedEvents);
      setLoading(false);
    } else if (!isSilent) {
      setLoading(true);
    }

    try {
      const results = await Promise.all(
        FOOTBALL_LEAGUES.map(l =>
          fetchWithCache(`${API_SOCCER_SCORE_BASE}/${l.id}/scoreboard?dates=${ds}`, isSilent || forceRefresh)
            .then(data => (data.events || []).map(e => ({ ...e, _leagueId: l.id })))
            .catch(() => [])
        )

      setSoccerMatches(results.flat());

      if (!isSilent && cachedEvents.length === 0) setSoccerMatches([]);
    } finally {
      if (!isSilent) setLoading(false);

  const fetchCricketMatches = useCallback(async (isSilent = false, forceRefresh = false) => {
    const selectedDateStr = date.toISOString().split('T')[0];
    const selectedDateObj = new Date(selectedDateStr);
    const isViewingToday = isSameDay(date, new Date());

    const filterCricketEvents = (liveData, schedData) => {
      const matchMap = new Map();
      (Array.isArray(schedData) ? schedData : []).forEach(m => matchMap.set(m.match_id, m));
      if (isViewingToday) {
        (Array.isArray(liveData) ? liveData : []).forEach(m => matchMap.set(m.match_id, m));
      }
      return Array.from(matchMap.values()).filter(m => {
        if (!m.start_time) return false;
        const titleLower = String(m.title || m.match_title || m.league || m.format || '').toLowerCase();
        if (CRICKET_DOMESTIC_LEAGUE_REGEX.test(titleLower)) return false;

        const startDateStr = String(m.start_time).split('T')[0];
        const startDateObj = new Date(startDateStr);
        if (startDateStr === selectedDateStr) return true;

        const statUpper = String(m.status || m.status_text || '').toUpperCase();
        let endDateObj = new Date(startDateObj);
        if (m.end_date || m.end_time) {
          endDateObj = new Date(String(m.end_date || m.end_time).split('T')[0]);
        } else if (titleLower.includes('test')) {
          endDateObj.setDate(startDateObj.getDate() + 4);
        } else if (titleLower.includes('first class') || titleLower.includes('fc')) {
          endDateObj.setDate(startDateObj.getDate() + 3);
        }

        if (selectedDateObj >= startDateObj && selectedDateObj <= endDateObj) return true;
        const isMatchActive = statUpper === 'LIVE' || statUpper === 'IN' || statUpper.includes('DAY ') || statUpper.includes('STUMPS') || statUpper.includes('RAIN') || statUpper.includes('TEA') || statUpper.includes('LUNCH') || statUpper.includes('BREAK');
        if (isViewingToday && isMatchActive && startDateObj <= selectedDateObj) return true;
        return false;
      });
    };

    const cachedLive = !forceRefresh ? getCachedSync(`${API_CRICKET_BASE}/live`) : null;
    const cachedSched = !forceRefresh ? getCachedSync(`${API_CRICKET_BASE}/schedule?days_past=3&days_ahead=4`) : null;
    if (cachedLive || cachedSched) {
      setCricketMatches(filterCricketEvents(cachedLive, cachedSched));
      setLoading(false);
    } else if (!isSilent) {
      setLoading(true);
    }

    try {
      const [liveRes, schedRes] = await Promise.all([
        isViewingToday ? fetchWithCache(`${API_CRICKET_BASE}/live`, isSilent || forceRefresh).catch(() => []) : Promise.resolve([]),
        fetchWithCache(`${API_CRICKET_BASE}/schedule?days_past=5&days_ahead=5`, isSilent || forceRefresh).catch(() => [])
      ]);
      setCricketMatches(filterCricketEvents(liveRes, schedRes));
    } catch {
      if (!isSilent && !cachedSched) setCricketMatches([]);
    } finally {
      if (!isSilent) setLoading(false);
    }
  }, [date]);

  const fetchFavSchedule = useCallback(async (forceRefresh = false) => {
    if (footballFavs.length === 0 && cricketFavs.length === 0) {
      setFavMatches([]);
      return;
    }
    setFavMatches(prev => {
      if (prev.length === 0) setLoading(true);
      return prev;
    });
    try {
      const nowMs = Date.now();
      const todayDs = new Date().toISOString().split('T')[0].replace(/-/g, '');
      const [soccerTeamResults, soccerScoreboards, cricketSched, cricketLive] = await Promise.all([
        footballFavs.length > 0
          ? Promise.all(
              footballFavs.map(async (id) => {
                const res = await fetchWithCache(`${API_SOCCER_SCORE_BASE}/all/teams/${id}`, forceRefresh).catch(() => null);
                const teamObj = res?.team || {};
                return { id, teamObj };
              })
            )
          : Promise.resolve([]),
        footballFavs.length > 0
          ? Promise.all(
              FOOTBALL_LEAGUES.map(l =>
                fetchWithCache(`${API_SOCCER_SCORE_BASE}/${l.id}/scoreboard?dates=${todayDs}`, forceRefresh)
                  .then(d => (d.events || []).map(e => ({ ...e, _leagueId: l.id })))
                  .catch(() => [])
              )
            )
          : Promise.resolve([]),
        cricketFavs.length > 0
          ? fetchWithCache(`${API_CRICKET_BASE}/schedule?days_past=1&days_ahead=30`, forceRefresh).catch(() => [])
          : Promise.resolve([]),
        cricketFavs.length > 0
          ? fetchWithCache(`${API_CRICKET_BASE}/live`, forceRefresh).catch(() => [])
          : Promise.resolve([])
      ]);

      const combined = [];
      const seenIds = new Set();
      const favSoccerSet = new Set(footballFavs.map(String));

      soccerScoreboards.flat().forEach(event => {
        if (!event || !event.id || !event.competitions?.length) return;
        const comp = event.competitions[0];
        const competitors = comp.competitors || [];
        const hasFavTeam = competitors.some(c => favSoccerSet.has(String(c?.team?.id || '')));
        if (!hasFavTeam) return;

        const state = String(comp?.status?.type?.state || event?.status?.type?.state || '').toLowerCase();
        const isCompleted = state === 'post' || Boolean(comp?.status?.type?.completed);
        if (isCompleted) return;

        const evTime = new Date(event.date || 0).getTime();
        const isLive = state === 'in';
        const isUpcoming = state === 'pre' || (!state && (isNaN(evTime) || evTime >= nowMs - 3600000));
        if (!isLive && !isUpcoming) return;

        const key = `soccer:${event.id}`;
        if (seenIds.has(key)) return;
        seenIds.add(key);
        combined.push({
          ...event,
          _favSport: 'soccer',
          _isLive: isLive,
          _sortTs: isNaN(evTime) ? Number.MAX_SAFE_INTEGER : evTime
        });
      });

      soccerTeamResults.forEach(({ teamObj }) => {
        const events = [...(teamObj?.nextEvent || []), ...(teamObj?.events || [])];
        events.forEach(event => {
          if (!event || !event.id || !event.competitions?.length) return;
          const comp = event.competitions[0];
          const state = String(comp?.status?.type?.state || event?.status?.type?.state || '').toLowerCase();
          const isCompleted = state === 'post' || Boolean(comp?.status?.type?.completed);
          if (isCompleted) return;

          const evTime = new Date(event.date || 0).getTime();
          const isLive = state === 'in';
          const isUpcoming = state === 'pre' || (!state && (isNaN(evTime) || evTime >= nowMs - 3600000));
          if (!isLive && !isUpcoming) return;

          const key = `soccer:${event.id}`;
          if (seenIds.has(key)) return;
          seenIds.add(key);
          combined.push({
            ...event,
            _favSport: 'soccer',
            _isLive: isLive,
            _sortTs: isNaN(evTime) ? Number.MAX_SAFE_INTEGER : evTime
          });
        });
      });

      const cricketPool = new Map();
      (Array.isArray(cricketSched) ? cricketSched : []).forEach(m => {
        if (m?.match_id) cricketPool.set(String(m.match_id), m);
      });
      (Array.isArray(cricketLive) ? cricketLive : []).forEach(m => {
        if (m?.match_id) cricketPool.set(String(m.match_id), { ...cricketPool.get(String(m.match_id)), ...m, _isLive: true });
      });

      cricketPool.forEach((m) => {
        if (!m?.match_id) return;
        const matched = (m.teams || []).some(t =>
          cricketFavs.some(fav => doesCricketTeamMatch(t, { id: fav, name: fav, short_name: fav }))
        );
        if (!matched) return;

        const stUpper = String(m.status || '').toUpperCase();
        const stTxtUpper = String(m.status_text || '').toUpperCase();
        const evTime = new Date(m.start_time || 0).getTime();
        const isFinished = stUpper === 'POST' || stUpper === 'FINAL' || stUpper === 'COMPLETED' || stUpper === 'RESULT' ||
          stTxtUpper.includes('FINAL') || stTxtUpper.includes('WON') || stTxtUpper.includes('FT') || stTxtUpper.includes('RESULT');
        if (isFinished) return;

        const isLive = Boolean(m._isLive) || stUpper === 'IN' || stUpper === 'LIVE' || stTxtUpper.includes('LIVE') || stTxtUpper.includes('STUMPS') || stTxtUpper.includes('INNINGS BREAK');
        const isUpcoming = !isLive && (stUpper === 'PRE' || stUpper === 'SCHEDULED' || (!isNaN(evTime) && evTime >= nowMs - 3600000));
        if (!isLive && !isUpcoming) return;

        const key = `cricket:${m.match_id}`;
        if (seenIds.has(key)) return;
        seenIds.add(key);
        combined.push({
          ...m,
          _favSport: 'cricket',
          _isLive: isLive,
          _sortTs: isNaN(evTime) ? Number.MAX_SAFE_INTEGER : evTime
        });
      });

      combined.sort((a, b) => {
        if (a._isLive !== b._isLive) return a._isLive ? -1 : 1;
        return a._sortTs - b._sortTs;
      });
      setFavMatches(combined);
    } catch {
      setFavMatches([]);
    } finally {
      setLoading(false);
    }
  }, [footballFavs, cricketFavs]);

  const triggerForceRefresh = useCallback(async () => {
    if (isRefreshing) return;
    setIsRefreshing(true);
    try {
      if (view === 'home') {
        await fetchFavSchedule(true);
      } else if (view === 'scores') {
        if (activeSport === 'soccer') await fetchFootballMatches(false, true);
        else await fetchCricketMatches(false, true);
      } else if (view === 'standings') {
        standingsParsedCache.clear();
        knockoutCache.clear();
        if (activeSport === 'soccer') {
          await Promise.all(
            FOOTBALL_LEAGUES.map(l =>
              Promise.all([
                fetchWithCache(`${API_SOCCER_STANDINGS_BASE}/${l.id}/standings`, true).catch(() => null),
                l.hasKnockout ? fetchWithCache(`${API_SOCCER_SCORE_BASE}/${l.id}/scoreboard`, true, 9500).catch(() => null) : Promise.resolve(null)
              ])
            )
          );
        } else {
          await Promise.all([
            fetchWithCache(`${API_CRICKET_BASE}/standings`, true).catch(() => null),
            fetchWithCache(`${API_CRICKET_BASE}/schedule?days_past=120&days_ahead=30`, true).catch(() => null)
          ]);
        }
        setRefreshTick(t => t + 1);
      } else if (view === 'intel') {
        if (activeSport === 'soccer') {
          await Promise.all(
            FOOTBALL_LEAGUES.slice(0, 4).map(l => fetchWithCache(`${API_SOCCER_SCORE_BASE}/${l.id}/news`, true).catch(() => null))
          );
        } else {
          await Promise.all([fetchWithCache(API_CRICKET_NEWS_ESPN, true).catch(() => null), fetchWithCache(CRICINFO_RSS_JSON, true).catch(() => null)]);
        }
        setRefreshTick(t => t + 1);
      }
    } finally {
      setTimeout(() => setIsRefreshing(false), 220);
    }
  }, [isRefreshing, view, activeSport, fetchFavSchedule, fetchFootballMatches, fetchCricketMatches]);

  const navHistoryRef = useRef([]);
  const prevViewRef = useRef(view);
  const gestureRef = useRef({
    active: false,
    mode: null,
    startX: 0,
    startY: 0,
    dx: 0,
    dy: 0,
    atTop: true,
    rafId: null,
    targetSheet: null
  });

  useEffect(() => {
    if (prevViewRef.current !== view) {
      navHistoryRef.current.push(prevViewRef.current);
      if (navHistoryRef.current.length > 20) navHistoryRef.current.shift();
      prevViewRef.current = view;
    }
  }, [view]);

  const handleGoBack = useCallback(() => {
    if (activeMatch) {
      setActiveMatch(null);
      return true;
    }
    if (activeTeam) {
      setActiveTeam(null);
      return true;
    }
    if (navHistoryRef.current.length > 0) {
      const prev = navHistoryRef.current.pop();
      prevViewRef.current = prev;
      startTransition(() => setView(prev));
      return true;
    }
    return false;
  }, [activeMatch, activeTeam, startTransition]);

  useEffect(() => {
    const scheduleFrame = () => {
      const g = gestureRef.current;
      if (g.rafId !== null) return;
      g.rafId = requestAnimationFrame(() => {
        g.rafId = null;
        if (!g.active) return;
        if (g.mode === 'back' && g.dx > 0 && g.targetSheet && (activeMatch || activeTeam)) {
          const clamped = Math.min(g.dx, 280);
          g.targetSheet.style.transition = 'none';
          g.targetSheet.style.transform = `translate3d(${clamped}px, 0, 0)`;
          g.targetSheet.style.opacity = String(Math.max(0.55, 1 - clamped / 540));
        } else if (g.mode === 'pull' && g.dy > 0) {
          setPullDistance(g.dy);
        }
      });
    };

    const onTouchStart = (e) => {
      if (!e.touches || e.touches.length !== 1) return;
      const t = e.touches[0];
      const scrollTop = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
      gestureRef.current = {
        active: true,
        mode: null,
        startX: t.clientX,
        startY: t.clientY,
        dx: 0,
        dy: 0,
        atTop: scrollTop <= 2 && !activeMatch && !activeTeam,
        rafId: null,
        targetSheet: document.querySelector('.ios-sheet-up')
      };
    };

    const onTouchMove = (e) => {
      const g = gestureRef.current;
      if (!g.active || !e.touches || e.touches.length !== 1) return;
      const t = e.touches[0];
      const dx = t.clientX - g.startX;
      const dy = t.clientY - g.startY;

      if (!g.mode) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if (Math.abs(dx) > Math.abs(dy) * 1.45) {
          g.mode = 'horiz';
        } else if (dy > 10 && g.atTop && Math.abs(dy) > Math.abs(dx) * 1.3) {
          g.mode = 'pull';
        } else {
          g.active = false;
          return;
        }
      }

      if (g.mode === 'horiz') {
        g.dx = dx;
        if (dx > 0 && g.targetSheet && (activeMatch || activeTeam)) {
          const clamped = Math.min(dx, 280);
          g.targetSheet.style.transition = 'none';
          g.targetSheet.style.transform = `translate3d(${clamped}px, 0, 0)`;
          g.targetSheet.style.opacity = String(Math.max(0.55, 1 - clamped / 540));
        }
      } else if (g.mode === 'pull' && dy > 0) {
        g.dy = Math.min(96, Math.pow(dy, 0.84));
        scheduleFrame();
      }
    };

    const onTouchEnd = () => {
      const g = gestureRef.current;
      if (!g.active) return;
      if (g.rafId !== null) {
        cancelAnimationFrame(g.rafId);
        g.rafId = null;
      }
      const { mode, dx, dy, targetSheet } = g;
      g.active = false;
      g.mode = null;

      if (targetSheet) {
        targetSheet.style.transition = 'transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease';
        targetSheet.style.transform = '';
        targetSheet.style.opacity = '';
      }

      if (mode === 'horiz') {
        if (activeMatch || activeTeam) {
          if (dx > 72) handleGoBack();
        } else if (view === 'scores') {
          // Swipe left -> next day (+1), swipe right -> previous day (-1)
          if (dx < -64) stepScoreDate(1);
          else if (dx > 64) stepScoreDate(-1);
        } else if (dx > 82) {
          handleGoBack();
        }
      } else if (mode === 'pull') {
        if (dy >= 54) {
          setPullDistance(0);
          triggerForceRefresh();
        } else {
          setPullDistance(0);
        }
      }
    };

    window.addEventListener('touchstart', onTouchStart, { passive: true });
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    window.addEventListener('touchend', onTouchEnd, { passive: true });
    return () => {
      if (gestureRef.current.rafId !== null) cancelAnimationFrame(gestureRef.current.rafId);
      window.removeEventListener('touchstart', onTouchStart);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', onTouchEnd);
    };
  }, [activeMatch, activeTeam, view, handleGoBack, stepScoreDate, triggerForceRefresh]);

  useEffect(() => {
    if (view === 'home') fetchFavSchedule(false);
    else if (view === 'scores') {
      if (activeSport === 'soccer') fetchFootballMatches(false, false);
      else fetchCricketMatches(false, false);
    }
  }, [view, activeSport, date, fetchFootballMatches, fetchCricketMatches, fetchFavSchedule]);

  useEffect(() => {
    if (view !== 'scores' || !isSameDay(date, new Date())) return;
    const interval = setInterval(() => {
      if (activeSport === 'soccer') fetchFootballMatches(true, false);
      else fetchCricketMatches(true, false);
    }, 15000);
    return () => clearInterval(interval);
  }, [view, activeSport, date, fetchFootballMatches, fetchCricketMatches]);

  const openMatchModal = useCallback((m) => {
    setActiveMatch(m);
  }, []);

  const openTeamHub = useCallback((team, leagueId = null, existingStats = null, sportOverride = null, rank = null) => {
    if (!team) return;
    setActiveTeam({
      team,
      leagueId,
      existingStats,
      rank,
      sport: sportOverride || activeSport
    });
  }, [activeSport]);

  const pullVisibleHeight = isRefreshing ? 50 : pullDistance;
  const pullProgress = Math.min(1, pullVisibleHeight / 54);

  return (
    <div className="min-h-screen bg-[#000000] text-[#F5F5F7] flex flex-col max-w-md mx-auto relative select-none overflow-x-hidden">

      <style dangerouslySetInnerHTML={{ __html: `
        @keyframes bounceBar { 0% { transform: translate3d(-12px, 0, 0); } 50% { transform: translate3d(12px, 0, 0); } 100% { transform: translate3d(-12px, 0, 0); } }
        .animate-bounce-bar { animation: bounceBar 1.75s cubic-bezier(0.37, 0, 0.63, 1) infinite; will-change: transform; }
      `}} />

      <div
        style={{
          height: `${pullVisibleHeight}px`,
          opacity: pullVisibleHeight > 4 ? 1 : 0,
          transition: pullDistance > 0 ? 'none' : 'height 0.20s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.16s ease'
        }}
        className="w-full flex items-center justify-center overflow-hidden pointer-events-none shrink-0"
      >
        <div className="sport-bar-crisp px-4 py-2 rounded-full flex items-center gap-2.5">
          {isRefreshing ? (
            <div className="w-[44px] h-[5px] rounded-full bg-white/15 overflow-hidden flex items-center justify-center">
              <div className="w-[16px] h-[5px] rounded-full bg-[#F5F5F7] white-pill-bounce" />
            </div>
          ) : (
            <>
              <RefreshCw
                size={13}
                color={THEME.text}
                style={{ transform: `translate3d(0,0,0) rotate(${pullProgress * 270}deg)` }}
              />
              <span className="text-[10px] font-extrabold tracking-[1px] text-[#F5F5F7] uppercase">
                {pullProgress >= 1 ? 'Release to Refresh' : 'Pull to Refresh'}
              </span>
            </>
          )}
        </div>
      </div>

      {/* SLEEK NON-BLURRED SPORT TOGGLE AT TOP */}
      <div className="flex sport-bar-crisp rounded-[22px] mx-4 mt-3 mb-3.5 p-1">
        <button
          onClick={() => startTransition(() => {
            setActiveSport('soccer');
          })}
          className={`flex-1 py-3 rounded-[18px] text-[13px] transition-all duration-150 ${activeSport === 'soccer' ? 'bg-[#242429] text-[#F5F5F7] font-extrabold shadow-sm border border-[rgba(255,255,255,0.12)]' : 'text-[#8E8E93] font-semibold border border-transparent'}`}
        >
          ⚽ Football
        </button>
        <button
          onClick={() => startTransition(() => {
            setActiveSport('cricket');
          })}
          className={`flex-1 py-3 rounded-[18px] text-[13px] transition-all duration-150 ${activeSport === 'cricket' ? 'bg-[#242429] text-[#F5F5F7] font-extrabold shadow-sm border border-[rgba(255,255,255,0.12)]' : 'text-[#8E8E93] font-semibold border border-transparent'}`}
        >
          🏏 Cricket
        </button>
      </div>

      <div key={`${activeSport}-${view}-${refreshTick}`} className={`flex-1 flex flex-col section-enter-${view}`}>
        {view === 'home' && (
          <div className="flex-1 px-4 pt-3 pb-40">
            
            {loading && favMatches.length === 0 ? (
              <WhitePillLoader className="mt-10 py-6" />
            ) : favMatches.length === 0 ? (
              <EmptyState icon={Calendar} title="No Live or Upcoming Matches" message="Your favorite football and cricket teams don't have any live or upcoming fixtures right now." />
            ) : (
              favMatches.map((m, idx) =>
                m._favSport === 'soccer' ? (
                  <FootballMatchCard key={`fav-s-${m.id || idx}`} match={m} selectedDate={m._isLive ? new Date() : null} onOpen={openMatchModal} onOpenTeam={openTeamHub} hideDate={false} />
                ) : (
                  <CricketMatchCard key={`fav-c-${m.match_id || idx}`} match={m} selectedDate={m._isLive ? new Date() : null} onOpen={openMatchModal} onOpenTeam={openTeamHub} hideDate={false} />
                )
              )
            )}
          </div>
        )}

        {view === 'scores' && (
          <div className="flex-1 flex flex-col">
            <DateSelector dates={dates} selectedDate={date} onSelectDate={handleSelectDateSmooth} />
            <div
              key={`${activeSport}-${date.toISOString().split('T')[0]}`}
              className={`px-4 pb-36 ${dateDir >= 0 ? 'schedule-load-next' : 'schedule-load-prev'}`}
            >
              {loading && (activeSport === 'soccer' ? footballMatches.length === 0 : cricketMatches.length === 0) ? (
                <WhitePillLoader className="py-20" />
              ) : activeSport === 'soccer' ? (
                footballMatches.length === 0 ? (
                  <EmptyState icon={CircleDashed} title="No Broadcasts" message="There are no scheduled games for this date." />
                ) : (
                  footballMatches.map((m, idx) => (
                    <div
                      key={m.id}
                      className="schedule-card-item"
                      style={{ animationDelay: `${170 + Math.min(idx, 8) * 55}ms` }}
                    >
                      <FootballMatchCard match={m} selectedDate={date} onOpen={openMatchModal} onOpenTeam={openTeamHub} hideDate={true} />
                    </div>
                  ))
                )
              ) : cricketMatches.length === 0 ? (
                <EmptyState icon={Activity} title="No Broadcasts" message="No cricket fixtures found for this date." />
              ) : (
                cricketMatches.map((m, idx) => (
                  <div
                    key={m.match_id}
                    className="schedule-card-item"
                    style={{ animationDelay: `${170 + Math.min(idx, 8) * 55}ms` }}
                  >
                    <CricketMatchCard match={m} selectedDate={date} onOpen={openMatchModal} onOpenTeam={openTeamHub} hideDate={true} />
                  </div>
                ))
              )}
            </div>
          </div>
        )}

        {view === 'standings' && (
          activeSport === 'soccer' ? (
            <FootballStandingsView key={`std-s-${refreshTick}`} onTeamPress={openTeamHub} onOpenMatch={openMatchModal} />
          ) : (
            <CricketStandingsView key={`std-c-${refreshTick}`} onTeamPress={openTeamHub} onOpenMatch={openMatchModal} />
          )
        )}

        {view === 'intel' && (
          activeSport === 'soccer' ? <FootballIntelView key={`intel-s-${refreshTick}`} /> : <CricketIntelView key={`intel-c-${refreshTick}`} />
        )}
      </div>

      <div className="fixed bottom-[35px] left-1/2 -translate-x-1/2 rounded-full p-2 flex liquid-glass-pill z-40 shadow-2xl">
        {favoritesList.length > 0 && (
          <button onClick={() => startTransition(() => setView('home'))} className="px-6 py-2.5 rounded-full active:scale-95 transition-transform">
            <Star size={26} color={view === 'home' ? THEME.text : THEME.muted} />
          </button>
        )}
        <button onClick={() => startTransition(() => setView('scores'))} className="px-6 py-2.5 rounded-full active:scale-95 transition-transform">
          <Activity size={26} color={view === 'scores' ? THEME.text : THEME.muted} />
        </button>
        <button onClick={() => startTransition(() => setView('standings'))} className="px-6 py-2.5 rounded-full active:scale-95 transition-transform">
          <Trophy size={26} color={view === 'standings' ? THEME.text : THEME.muted} />
        </button>
        <button onClick={() => startTransition(() => setView('intel'))} className="px-6 py-2.5 rounded-full active:scale-95 transition-transform">
          <Zap size={26} color={view === 'intel' ? THEME.text : THEME.muted} />
        </button>
      </div>

      {activeMatch && activeMatch._sport === 'soccer' && (
        <FootballMatchModal match={activeMatch} onClose={() => setActiveMatch(null)} onOpenTeam={openTeamHub} />
      )}
      {activeMatch && activeMatch._sport === 'cricket' && (
        <CricketMatchModal match={activeMatch} selectedDate={date} onClose={() => setActiveMatch(null)} onOpenTeam={openTeamHub} />
      )}

      {activeTeam && activeTeam.sport === 'soccer' && (
        <FootballTeamModal
          team={activeTeam.team}
          leagueId={activeTeam.leagueId}
          existingStats={activeTeam.existingStats}
          standingRank={activeTeam.rank}
          favorites={footballFavs}
          onToggleFavorite={toggleFootballFav}
          onClose={() => setActiveTeam(null)}
          onOpenMatch={openMatchModal}
        />
      )}
      {activeTeam && activeTeam.sport === 'cricket' && (
        <CricketTeamModal
          team={activeTeam.team}
          existingStats={activeTeam.existingStats}
          favorites={cricketFavs}
          onToggleFavorite={toggleCricketFav}
          onClose={() => setActiveTeam(null)}
          onOpenMatch={openMatchModal}
        />
      )}
    </div>
  );
}


class SidelineErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div className="min-h-screen bg-[#000000] text-[#F5F5F7] flex flex-col items-center justify-center p-6 text-center">
          <div className="text-[#FF453A] font-extrabold text-[14px] mb-2">APP ERROR</div>
          <div className="text-[#8E8E93] text-[12px] max-w-[300px] mb-4 break-words">{String(this.state.error?.message || this.state.error)}</div>
          <button onClick={() => window.location.reload()} className="px-4 py-2 rounded-full liquid-glass text-[#F5F5F7] text-[12px] font-bold">
            Reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <SidelineErrorBoundary>
    <App />
  </SidelineErrorBoundary>
);

  </script>
  <script>
    (function bootSideline() {
      let started = false;
      function startApp() {
        if (started) return;
        if (!window.React || !window.ReactDOM || !window.Babel) {
          setTimeout(startApp, 80);
          return;
        }
        started = true;
        const jsxSource = document.getElementById('sideline-jsx').textContent;
        const compiled = window.Babel.transform(jsxSource, { presets: ['react'] }).code;
        new Function(compiled)();
      }
      if (document.readyState === 'complete' || document.readyState === 'interactive') requestAnimationFrame(startApp);
      else window.addEventListener('DOMContentLoaded', startApp);
      window.addEventListener('load', startApp);
    })();
  </script>
</body>
