// ⚡ CORE UI PRIMITIVES
// ==========================================

const isInsideHorizontalScroller = (target, stopEl) => {
  let node = target;
  while (node && node !== stopEl && node !== document.body) {
    if (node.dataset && node.dataset.noSectionSwipe === 'true') return true;
    if (node.nodeType === 1 && node.classList && (node.classList.contains('overflow-x-auto') || node.classList.contains('ios-momentum'))) {
      if (node.scrollWidth > node.clientWidth + 6) return true;
    }
    node = node.parentElement;
  }
  return false;
};

const useSwipeSections = (items, activeValue, onSelect, options = {}) => {
  const { onBoundaryPrev = null, onBoundaryNext = null, stopPropagation = false } = options;
  const contentRef = useRef(null);
  const [swipeDir, setSwipeDir] = useState(0);
  const touchRef = useRef({ active: false, locked: false, startX: 0, startY: 0, startTime: 0, dx: 0, rafId: null });

  const selectWithDir = useCallback((nextVal) => {
    const curIdx = items.indexOf(activeValue);
    const nextIdx = items.indexOf(nextVal);
    if (curIdx !== -1 && nextIdx !== -1 && curIdx !== nextIdx) {
      setSwipeDir(nextIdx > curIdx ? 1 : -1);
    }
    onSelect(nextVal);
  }, [items, activeValue, onSelect]);

  const onTouchStart = useCallback((e) => {
    if (!e.touches || e.touches.length !== 1) return;
    if (isInsideHorizontalScroller(e.target, e.currentTarget)) return;
    if (stopPropagation) e.stopPropagation();
    const t = e.touches[0];
    if (contentRef.current) {
      contentRef.current.style.transition = '';
      contentRef.current.style.transform = '';
      contentRef.current.style.opacity = '';
    }
    touchRef.current = { active: true, locked: false, startX: t.clientX, startY: t.clientY, startTime: performance.now(), dx: 0, rafId: null };
  }, [stopPropagation]);

  const onTouchMove = useCallback((e) => {
    const g = touchRef.current;
    if (!g.active || !e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - g.startX;
    const dy = t.clientY - g.startY;

    if (!g.locked) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.25) {
        g.locked = true;
      } else {
        g.active = false;
        return;
      }
    }
    if (stopPropagation) e.stopPropagation();
    g.dx = dx;
    if (g.rafId === null) {
      g.rafId = requestAnimationFrame(() => {
        g.rafId = null;
        const el = contentRef.current;
        if (!el || !g.active) return;
        const curIdx = items.indexOf(activeValue);
        const canGoNext = curIdx < items.length - 1 || Boolean(onBoundaryNext);
        const canGoPrev = curIdx > 0 || Boolean(onBoundaryPrev);
        const factor = (g.dx < 0 && !canGoNext) || (g.dx > 0 && !canGoPrev) ? 0.12 : 0.36;
        const dragX = Math.max(-64, Math.min(64, g.dx * factor));
        el.style.transition = 'none';
        el.style.transform = `translate3d(${dragX}px, 0, 0)`;
        el.style.opacity = String(Math.max(0.78, 1 - Math.abs(dragX) / 260));
      });
    }
  }, [items, activeValue, onBoundaryNext, onBoundaryPrev, stopPropagation]);

  const onTouchEnd = useCallback((e) => {
    const g = touchRef.current;
    if (!g.active) return;
    if (g.rafId !== null) {
      cancelAnimationFrame(g.rafId);
      g.rafId = null;
    }
    const { locked, dx, startX, startTime } = g;
    g.active = false;
    g.locked = false;

    const el = contentRef.current;
    const resetEl = () => {
      if (!el) return;
      el.style.transition = 'transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.13s ease';
      el.style.transform = '';
      el.style.opacity = '';
    };

    if (!locked) {
      resetEl();
      return;
    }
    if (stopPropagation && e) e.stopPropagation();

    const dt = Math.max(16, performance.now() - startTime);
    const vx = dx / dt;
    const curIdx = items.indexOf(activeValue);

    // Velocity-aware flick or distance threshold so fast thumb gestures respond immediately
    const isNext = dx < -42 || (dx < -20 && vx < -0.34);
    const isPrev = dx > 42 || (dx > 20 && vx > 0.34);

    if (dx > 58 && startX <= 28 && onBoundaryPrev && curIdx === 0) {
      if (el) { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }
      onBoundaryPrev();
      return;
    }

    if (isNext) {
      if (curIdx >= 0 && curIdx < items.length - 1) {
        if (el) { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }
        setSwipeDir(1);
        onSelect(items[curIdx + 1]);
        return;
      } else if (onBoundaryNext) {
        if (el) { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }
        onBoundaryNext();
        return;
      }
    } else if (isPrev) {
      if (curIdx > 0) {
        if (el) { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }
        setSwipeDir(-1);
        onSelect(items[curIdx - 1]);
        return;
      } else if (onBoundaryPrev && (dx > 54 || vx > 0.48)) {
        if (el) { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }
        onBoundaryPrev();
        return;
      }
    }

    resetEl();
  }, [items, activeValue, onSelect, onBoundaryNext, onBoundaryPrev, stopPropagation]);

  const animClass = swipeDir > 0 ? 'tab-slide-next' : swipeDir < 0 ? 'tab-slide-prev' : 'ios-tab-fade';

  return {
    contentRef,
    animClass,
    selectWithDir,
    bind: { onTouchStart, onTouchMove, onTouchEnd }
  };
};

const useSmoothDismiss = (onClose) => {
  const [closing, setClosing] = useState(false);
  const timerRef = useRef(null);
  useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);
  const handleClose = useCallback(() => {
    if (closing) return;
    setClosing(true);
    timerRef.current = setTimeout(() => {
      onClose();
    }, 145);
  }, [closing, onClose]);
  return { closing, handleClose };
};

const WhitePillLoader = memo(({ className = "py-12" }) => (

const resolveTeamKitColors = (summary, comp, fallbackHex = "0A84FF") => {
  const teamObj = comp?.team || {};
  const nameKey = String(teamObj.shortDisplayName || teamObj.name || teamObj.displayName || '').toLowerCase().trim();
  const sumTeam = summary?.teams?.find(t => String(t.id) === String(teamObj.id));
  const rawApiColor = sumTeam?.color || teamObj.color;
  const rawAltColor = sumTeam?.alternateColor || teamObj.alternateColor;

  for (const [k, pair] of Object.entries(FOOTBALL_KIT_COLORS)) {
    if (nameKey === k || nameKey.includes(k) || k.includes(nameKey)) {
      return { primary: pair[0], secondary: pair[1] };
    }
  }

  if (rawApiColor && /^[0-9a-fA-F]{6}$/.test(String(rawApiColor).replace('#', ''))) {
    const cleanHex = `#${String(rawApiColor).replace('#', '')}`;
    return {
      primary: cleanHex,
      secondary: rawAltColor && /^[0-9a-fA-F]{6}$/.test(String(rawAltColor).replace('#', ''))
        ? `#${String(rawAltColor).replace('#', '')}`
        : '#FFFFFF'
    };
  }

  const hex = String(fallbackHex || '0A84FF').replace('#', '');
  return { primary: `#${hex}`, secondary: '#FFFFFF' };
};

const normalizeFormationString = (rawFormation) => {
  if (!rawFormation) return "";
  const str = typeof rawFormation === "object"
    ? (rawFormation.displayValue || rawFormation.name || rawFormation.formation || "")
    : String(rawFormation);
  const match = str.trim().match(/(\d+(?:\s*[-–]\s*\d+)+)/);
  if (!match) return "";
  const nums = match[1]
    .split(/[-–]/)
    .map(n => parseInt(n.trim(), 10))
    .filter(n => !isNaN(n) && n > 0);
  if (nums.length === 0) return "";
  const sum = nums.reduce((a, b) => a + b, 0);
  if (sum === 10) return nums.join("-");
  if (nums[0] === 1 && nums.slice(1).reduce((a, b) => a + b, 0) === 10) {
    return nums.slice(1).join("-");
  }
  return nums.join("-");
};

const getPlayerRoleMeta = (player) => {
  const posObj = player?.position || {};
  const subObj = player?.subPosition || {};
  const athPos = player?.athlete?.position || {};
  const defPos = player?.athlete?.defaultPosition || {};

  const pickValid = (...vals) => {
    for (const v of vals) {
      const s = String(v || "").toUpperCase().trim();
      if (s && s !== "SUB" && s !== "SUBSTITUTE") return s;
    }
    return "";
  };

  // Prioritize match-day position metadata over career defaultPosition
  const abbr = pickValid(
    subObj.abbreviation,
    posObj.abbreviation,
    athPos.abbreviation,
    defPos.abbreviation
  );

  const pname = pickValid(
    subObj.name,
    posObj.name,
    posObj.displayName,
    athPos.name,
    defPos.name
  );

  const ptype = String(posObj.type || athPos.type || defPos.type || "").toLowerCase().trim();
  const jerseyNum = parseInt(String(player?.jersey ?? "").replace(/[^\d]/g, ""), 10);
  const fp = parseInt(String(player?.formationPlace ?? "").replace(/[^\d]/g, ""), 10);

  return {
    abbr,
    pname,
    ptype,
    combined: `${abbr} ${pname}`.trim(),
    jerseyNum: isNaN(jerseyNum) ? null : jerseyNum,
    formationPlace: !isNaN(fp) && fp >= 1 && fp <= 11 ? fp : null
  };
};

const getStartingEleven = (teamRoster) => {
  const rawRoster = Array.isArray(teamRoster?.roster) ? teamRoster.roster : [];
  const seen = new Set();
  const deduped = [];

  rawRoster.forEach((p, idx) => {
    const aid = p?.athlete?.id ? `id:${p.athlete.id}` : `idx:${idx}:${p?.athlete?.displayName || ""}:${p?.jersey || ""}`;
    if (seen.has(aid)) return;
    seen.add(aid);
    deduped.push(p);
  });

  const explicitStarters = deduped.filter(p => p?.starter === true);
  const hasAnyExplicitStarterFlag = deduped.some(p => typeof p?.starter === "boolean");
  if (explicitStarters.length >= 11) {
    return explicitStarters.slice(0, 11);
  }
  if (explicitStarters.length >= 7 || (hasAnyExplicitStarterFlag && explicitStarters.length > 0)) {
    return explicitStarters;
  }
  const withFormationPlace = deduped.filter(p => {
    const fp = parseInt(String(p?.formationPlace ?? "").replace(/[^\d]/g, ""), 10);
    return !isNaN(fp) && fp >= 1 && fp <= 11;
  });
  if (withFormationPlace.length >= 7) {
    return withFormationPlace.slice(0, 11);
  }
  return deduped.slice(0, 11);
};

/**
 * Computes continuous tactical depth (0 = GK -> 100 = Striker) and
 * team-perspective lateral coordinate (-100 = team's left -> +100 = team's right).
 * Recognizes ESPN hyphenated codes (CD-L, CD-R, DM-L, DM-R, CM-L, CM-R, AM-L, AM-R, CF-L, CF-R).
 */
const getTacticalProfile = (player, formationRows = null) => {
  const meta = getPlayerRoleMeta(player);
  const { abbr, pname, ptype, formationPlace, jerseyNum } = meta;
  const tag = `${abbr} ${pname} ${ptype}`.toUpperCase();

  const isBackThreeWithDm =
    Array.isArray(formationRows) &&
    formationRows.length >= 4 &&
    formationRows[1] === 3 &&
    formationRows[2] <= 2 &&
    formationRows[3] >= 4;

  let depth = 54;
  let specific = true;
  let roleBand = "MID";

  if (abbr === "GK" || abbr === "G" || tag.includes("GOALKEEPER")) {
    depth = 0; roleBand = "GK";
  } else if (
    ["CD", "CD-L", "CD-R", "CB", "LCB", "RCB", "SW"].includes(abbr) ||
    tag.includes("CENTER BACK") || tag.includes("CENTRE BACK") ||
    tag.includes("CENTER DEF") || tag.includes("CENTRE DEF") || tag.includes("SWEEPER")
  ) {
    depth = 18; roleBand = "DEF";
  } else if (
    ["LB", "RB", "LD", "RD"].includes(abbr) ||
    tag.includes("LEFT BACK") || tag.includes("RIGHT BACK") || tag.includes("FULLBACK") || tag.includes("FULL BACK")
  ) {
    depth = 22; roleBand = "DEF";
  } else if (
    ["LWB", "RWB"].includes(abbr) || tag.includes("WINGBACK") || tag.includes("WING BACK")
  ) {
    depth = isBackThreeWithDm ? 46 : 30; roleBand = "WB";
  } else if (
    ["DM", "DM-L", "DM-R", "CDM", "LDM", "RDM"].includes(abbr) ||
    tag.includes("DEFENSIVE MID") || tag.includes("HOLDING MID")
  ) {
    depth = 38; roleBand = "DM";
  } else if (
    ["CM", "CM-L", "CM-R", "LCM", "RCM"].includes(abbr) ||
    tag.includes("CENTRAL MID") || tag.includes("CENTER MID") || tag.includes("CENTRE MID")
  ) {
    depth = 52; roleBand = "CM";
  } else if (
    ["LM", "RM"].includes(abbr) || tag.includes("LEFT MID") || tag.includes("RIGHT MID")
  ) {
    depth = 56; roleBand = "WM";
  } else if (
    ["AM", "CAM"].includes(abbr) ||
    (tag.includes("ATTACKING MID") && !tag.includes("LEFT") && !tag.includes("RIGHT"))
  ) {
    depth = 72; roleBand = "AM";
  } else if (
    ["AM-L", "AM-R", "LAM", "RAM"].includes(abbr) || tag.includes("ATTACKING MID")
  ) {
    depth = 74; roleBand = "AM";
  } else if (
    ["LW", "RW", "LF", "RF", "W"].includes(abbr) ||
    tag.includes("WING") || tag.includes("LEFT FORWARD") || tag.includes("RIGHT FORWARD")
  ) {
    depth = 80; roleBand = "W";
  } else if (abbr === "SS" || tag.includes("SECOND STRIKER")) {
    depth = 86; roleBand = "FWD";
  } else if (
    ["CF", "CF-L", "CF-R", "ST", "LS", "RS"].includes(abbr) ||
    tag.includes("STRIKER") || tag.includes("CENTER FORWARD") || tag.includes("CENTRE FORWARD")
  ) {
    depth = 92; roleBand = "FWD";
  } else if (["D", "DEF"].includes(abbr) || tag.includes("DEFEND")) {
    depth = 20; specific = false; roleBand = "DEF";
  } else if (["F", "FWD"].includes(abbr) || tag.includes("FORWARD")) {
    depth = 90; specific = false; roleBand = "FWD";
  } else if (["M", "MID"].includes(abbr) || tag.includes("MIDFIELD")) {
    depth = 54; specific = false; roleBand = "MID";
  } else {
    depth = 54; specific = false; roleBand = "MID";
  }

  let lat = null;
  if (["LB", "LWB", "LD"].includes(abbr) || tag.includes("LEFT BACK") || tag.includes("LEFT WINGBACK") || tag.includes("LEFT WING BACK")) lat = -100;
  else if (["LW", "LF"].includes(abbr) || tag.includes("LEFT WING") || tag.includes("LEFT FORWARD")) lat = -90;
  else if (abbr === "LM" || tag.includes("LEFT MID")) lat = -80;
  else if (["AM-L", "LAM"].includes(abbr) || tag.includes("LEFT ATTACKING MID")) lat = -65;
  else if (["CD-L", "LCB"].includes(abbr) || tag.includes("LEFT CENTER BACK") || tag.includes("LEFT CENTRE BACK") || tag.includes("LEFT CENTER DEF")) lat = -40;
  else if (["DM-L", "LDM"].includes(abbr) || tag.includes("LEFT DEFENSIVE MID")) lat = -32;
  else if (["CM-L", "LCM"].includes(abbr) || tag.includes("LEFT CENTRAL MID") || tag.includes("LEFT CENTER MID")) lat = -28;
  else if (["CF-L", "LS"].includes(abbr) || tag.includes("LEFT STRIKER") || tag.includes("LEFT CENTER FORWARD")) lat = -22;
  else if (["CF-R", "RS"].includes(abbr) || tag.includes("RIGHT STRIKER") || tag.includes("RIGHT CENTER FORWARD")) lat = 22;
  else if (["CM-R", "RCM"].includes(abbr) || tag.includes("RIGHT CENTRAL MID") || tag.includes("RIGHT CENTER MID")) lat = 28;
  else if (["DM-R", "RDM"].includes(abbr) || tag.includes("RIGHT DEFENSIVE MID")) lat = 32;
  else if (["CD-R", "RCB"].includes(abbr) || tag.includes("RIGHT CENTER BACK") || tag.includes("RIGHT CENTRE BACK") || tag.includes("RIGHT CENTER DEF")) lat = 40;
  else if (["AM-R", "RAM"].includes(abbr) || tag.includes("RIGHT ATTACKING MID")) lat = 65;
  else if (abbr === "RM" || tag.includes("RIGHT MID")) lat = 80;
  else if (["RW", "RF"].includes(abbr) || tag.includes("RIGHT WING") || tag.includes("RIGHT FORWARD")) lat = 90;
  else if (["RB", "RWB", "RD"].includes(abbr) || tag.includes("RIGHT BACK") || tag.includes("RIGHT WINGBACK") || tag.includes("RIGHT WING BACK")) lat = 100;
  else if (["CD", "CB", "SW", "DM", "CDM", "CM", "AM", "CAM", "CF", "ST", "SS", "G", "GK"].includes(abbr)) lat = 0;

  return { meta, depth, specific, roleBand, lat, formationPlace, jerseyNum };
};

const inferFormationFromStarters = (starters) => {
  const profiles = starters.map(p => getTacticalProfile(p));
  const outfield = profiles.filter(p => p.roleBand !== "GK").slice(0, 10);
  if (outfield.length < 10) return "4-3-3";

  const defs = outfield.filter(p => p.roleBand === "DEF").length;
  const wbs = outfield.filter(p => p.roleBand === "WB").length;
  const dms = outfield.filter(p => p.roleBand === "DM").length;
  const cms = outfield.filter(p => p.roleBand === "CM" || p.roleBand === "MID").length;
  const wms = outfield.filter(p => p.roleBand === "WM").length;
  const ams = outfield.filter(p => p.roleBand === "AM").length;
  const wingers = outfield.filter(p => p.roleBand === "W").length;
  const fwds = outfield.filter(p => p.roleBand === "FWD").length;

  if (defs === 4 && dms + cms === 2 && ams + wingers + wms === 3 && fwds === 1) return "4-2-3-1";
  if (defs === 3 && wbs + dms + cms + wms === 4 && ams === 2 && fwds === 1) return "3-4-2-1";
  if (defs === 4 && dms + cms + wms + ams === 3 && wingers + fwds === 3) return "4-3-3";
  if (defs === 4 && dms + cms + wms === 4 && fwds + wingers === 2) return "4-4-2";
  if (defs === 3 && wbs + dms + cms + wms + ams === 5 && fwds === 2) return "3-5-2";
  if (defs === 3 && wbs + dms + cms + wms === 4 && wingers + ams + fwds === 3) return "3-4-3";
  if (defs + wbs === 5 && dms + cms + ams === 3 && fwds === 2) return "5-3-2";
  if (defs + wbs === 5 && dms + cms + wms + ams === 4 && fwds === 1) return "5-4-1";

  const clampedDefs = Math.max(3, Math.min(5, defs || 4));
  const clampedFwds = Math.max(1, Math.min(3, fwds + wingers || 1));
  const remainingMid = 10 - clampedDefs - clampedFwds;

  if (remainingMid === 5 && clampedFwds === 1) return `${clampedDefs}-2-3-1`;
  if (remainingMid >= 2) return `${clampedDefs}-${remainingMid}-${clampedFwds}`;
  return "4-3-3";
};

const buildFormationGrid = (starters, formationRows, isHome = true) => {
  if (!Array.isArray(starters) || starters.length === 0) return [];

  const fpLatMap = { 3: -95, 11: -85, 4: -30, 6: -20, 10: 0, 9: 0, 8: 20, 5: 30, 7: 85, 2: 95 };
  const fpDepthHint = { 1: 0, 2: 22, 3: 22, 4: 20, 5: 20, 6: 42, 8: 52, 10: 70, 11: 76, 7: 76, 9: 92 };

  const enriched = starters.map((player, idx) => {
    const prof = getTacticalProfile(player, formationRows);
    const { abbr } = prof.meta;
    const fp = prof.formationPlace;

    let effDepth = prof.depth;
    if (!prof.specific && fp && fpDepthHint[fp] !== undefined) {
      if (abbr === "M" || abbr === "MID") effDepth = 35 + fpDepthHint[fp] * 0.45;
      else if (abbr === "F" || abbr === "FWD") effDepth = 78 + fpDepthHint[fp] * 0.16;
      else if (abbr === "D" || abbr === "DEF") effDepth = 16 + fpDepthHint[fp] * 0.15;
      else effDepth = fpDepthHint[fp];
    } else if (fp && fpDepthHint[fp] !== undefined) {
      effDepth += (fpDepthHint[fp] - 50) * 0.008;
    }

    let effLat = prof.lat;
    if (effLat === null) {
      if (fp && fpLatMap[fp] !== undefined) effLat = fpLatMap[fp];
      else if (prof.jerseyNum === 3 || prof.jerseyNum === 11) effLat = -45;
      else if (prof.jerseyNum === 2 || prof.jerseyNum === 7) effLat = 45;
      else effLat = (idx - 5) * 0.1;
    } else if (effLat === 0 && fp && fpLatMap[fp] !== undefined) {
      effLat = fpLatMap[fp] * 0.05;
    }

    return { player, idx, effDepth, effLat, fp };
  });

  const gk =
    enriched.find(it => it.effDepth === 0) ||
    enriched.find(it => it.fp === 1) ||
    enriched[0];

  const outfield = enriched
    .filter(it => it.idx !== gk.idx)
    .sort((a, b) => (a.effDepth - b.effDepth) || (a.idx - b.idx));

  const grid = [[gk.player]];
  let cursor = 0;

  for (let r = 1; r < formationRows.length; r++) {
    const count = formationRows[r];
    const slice = outfield.slice(cursor, cursor + count);
    cursor += slice.length;
    // Home (bottom half, attacking up): Left -> Right
    // Away (top half, attacking down): Right -> Left so Away RB faces Home LW
    slice.sort((a, b) => {
      const diff = isHome ? (a.effLat - b.effLat) : (b.effLat - a.effLat);
      return Math.abs(diff) > 0.25 ? diff : (a.idx - b.idx);
    });
    grid.push(slice.map(x => x.player));
  }

  if (cursor < outfield.length && grid.length > 1) {
    grid[grid.length - 1].push(...outfield.slice(cursor).map(x => x.player));
  }

  return grid;
};

const resolveTeamRosterBySide = (summary, isHome, comp = null) => {
  const rosters = summary?.rosters || [];
  if (rosters.length === 0) return null;

  const targetSide = isHome ? "home" : "away";
  const compTeamId = comp?.team?.id ? String(comp.team.id) : null;
  const headerComps = summary?.header?.competitions?.[0]?.competitors || [];
  const headerTarget = headerComps.find(c => String(c?.homeAway || "").toLowerCase() === targetSide);
  const headerTargetId = headerTarget?.team?.id ? String(headerTarget.team.id) : null;
  const targetId = compTeamId || headerTargetId;

  const matched = rosters.find(r => {
    if (targetId && r?.team?.id && String(r.team.id) === targetId) return true;
    if (String(r?.homeAway || "").toLowerCase() === targetSide) return true;
    return false;
  });

  if (matched) return matched;
  return rosters[isHome ? 0 : Math.min(1, rosters.length - 1)] || null;
};

const extractTeamFormation = (summary, teamRoster, isHome, comp = null) => {
  const targetSide = isHome ? "home" : "away";
  const targetId = comp?.team?.id ? String(comp.team.id) : (teamRoster?.team?.id ? String(teamRoster.team.id) : null);

  const headerComps = summary?.header?.competitions?.[0]?.competitors || [];
  const headerComp = headerComps.find(c =>
    (targetId && c?.team?.id && String(c.team.id) === targetId) ||
    String(c?.homeAway || "").toLowerCase() === targetSide
  );

  const candidates = [
    teamRoster?.formation,
    teamRoster?.lineup?.formation,
    teamRoster?.team?.formation,
    headerComp?.formation,
    headerComp?.lineup?.formation,
    summary?.boxscore?.form?.find?.(f => String(f?.team?.id) === targetId)?.formation,
    summary?.lineups?.find?.(l => String(l?.team?.id) === targetId)?.formation
  ];

  for (const cand of candidates) {
    if (!cand) continue;
    const norm = normalizeFormationString(cand);
    if (norm) return norm;
  }

  const starters = getStartingEleven(teamRoster);
  return inferFormationFromStarters(starters);
};

const useFootballFormations = (summary, width, height, isHome, comp = null) =>
  useMemo(() => {
    if (!summary?.rosters) return [];
    const teamRoster = resolveTeamRosterBySide(summary, isHome, comp);
    if (!teamRoster) return [];

    const formationStr = extractTeamFormation(summary, teamRoster, isHome, comp);
    const parsedForm = formationStr
      .split("-")
      .map(n => parseInt(n, 10))
      .filter(n => !isNaN(n) && n > 0);
    const formationRows = [1, ...(parsedForm.length > 0 ? parsedForm : [4, 3, 3])];

    const starters = getStartingEleven(teamRoster);
    const groupedRows = buildFormationGrid(starters, formationRows, isHome);
    const numRows = Math.max(1, formationRows.length - 1);
    const topPad = isHome ? 18 : 16;
    const bottomPad = isHome ? 66 : 56;
    const usableHeight = Math.max(220, height - topPad - bottomPad);

    return groupedRows.map((rowPlayers, rowIndex) => {
      if (!rowPlayers || rowPlayers.length === 0) return [];

      const linearT = rowIndex / numRows;
      const depthT = Math.pow(linearT, 0.92);
      const y = isHome
        ? (topPad + usableHeight) - (depthT * usableHeight)
        : topPad + (depthT * usableHeight);

      return rowPlayers.map((p, i) => {
        const x = ((i + 1) / (rowPlayers.length + 1)) * width;
        return { id: p.athlete?.id || `p_${rowIndex}_${i}`, player: p, x, y };
      });
    }).flat();
  }, [summary?.rosters, summary?.header, summary?.boxscore, width, height, isHome, comp]);

const DateSelector = memo(({ dates, selectedDate, onSelectDate }) => {
  const scrollRef = useRef(null);
  const didMountRef = useRef(false);

  const centerSelectedDate = useCallback((smooth = true) => {
    const container = scrollRef.current;
    if (!container) return;
    const selectedEl = container.querySelector('[data-selected="true"]');
    if (selectedEl) {
      const targetLeft = selectedEl.offsetLeft - (container.clientWidth / 2) + (selectedEl.offsetWidth / 2);
      container.scrollTo({ left: Math.max(0, targetLeft), behavior: smooth ? 'smooth' : 'auto' });
    }
  }, []);

  useEffect(() => {
    const useSmooth = didMountRef.current;
    didMountRef.current = true;
    const raf = requestAnimationFrame(() => centerSelectedDate(useSmooth));
    return () => cancelAnimationFrame(raf);
  }, [selectedDate, dates, centerSelectedDate]);

  return (
    <div className="px-4 pt-2.5 mb-2.5 w-full">
      <div className="bg-[#121212] h-[64px] rounded-[32px] px-3 flex items-center border border-[rgba(255,255,255,0.08)] overflow-hidden">
        <div ref={scrollRef} className="flex items-center overflow-x-auto ios-momentum [&::-webkit-scrollbar]:hidden w-full relative">
          {dates.map((d, i) => {
            const isSel = isSameDay(d, selectedDate);
            const isToday = isSameDay(d, new Date());
            const diffDays = Math.abs((d - selectedDate) / (1000 * 60 * 60 * 24));
            const fadeOpacity = isSel || isToday ? 1 : Math.max(0.3, 1 - (diffDays * 0.15));

            const dayColor = isSel ? THEME.accent : isToday ? THEME.success : THEME.muted;
            const dateColor = isSel ? THEME.accent : isToday ? THEME.success : THEME.text;

            return (
              <button
                key={i}
                data-selected={isSel}
                onClick={() => onSelectDate(new Date(d))}
                className="w-[44px] mx-1 shrink-0 flex flex-col items-center justify-center py-1 transition-opacity duration-150 outline-none"
                style={{ opacity: fadeOpacity }}
              >
                <span className="text-[9px] font-bold tracking-[0.5px] mb-1 uppercase" style={{ color: dayColor }}>
                  {d.toLocaleDateString('en-GB', { weekday: 'short' }).toUpperCase()}

                <span className="text-[16px] font-extrabold tabular-nums leading-none" style={{ color: dateColor }}>
                  {d.getDate()}

              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
});

const formatSummaryParagraph = (rawDesc, rawStory = '', headline = '') => {
  const cleanDesc = stripHtml(rawDesc || '').replace(/\s+/g, ' ').trim();
  const cleanStory = stripHtml(rawStory || '').replace(/\s+/g, ' ').trim();
  let candidate = cleanDesc.length >= 45 ? cleanDesc : (cleanStory || cleanDesc);

  if (!candidate) return '';
  const cleanHead = stripHtml(headline || '').replace(/\s+/g, ' ').trim();
  if (cleanHead && candidate.toLowerCase().startsWith(cleanHead.toLowerCase())) {
    candidate = candidate.slice(cleanHead.length).replace(/^[\s:—–-]+/, '').trim();
  }

  if (candidate.length <= 290) return candidate;
  const sentences = candidate.match(/[^.!?]+[.!?]+/g) || [];
  let summary = '';
  for (const s of sentences) {
    const next = (summary + ' ' + s.trim()).trim();
    if (next.length <= 290) {
      summary = next;
    } else {
      break;
    }
  }
  if (summary.length >= 70) return summary;
  const cut = candidate.slice(0, 275);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace > 160 ? cut.slice(0, lastSpace) : cut).trim() + '.';
};

const getFootballZoneBadge = (leagueId, rank, totalTeams) => {
  if (!leagueId || !rank) return null;
  if (leagueId === 'eng.1' || leagueId === 'esp.1' || leagueId === 'ita.1') {
    if (rank <= 4) return { code: 'UCL', color: THEME.accent, desc: 'UEFA Champions League' };
    if (rank === 5 || rank === 6) return { code: 'UEL', color: THEME.warning, desc: 'UEFA Europa League' };
    if (rank > Math.max(4, totalTeams - 3)) return { code: 'REL', color: THEME.danger, desc: 'Relegation' };
  } else if (leagueId === 'ger.1') {
    if (rank <= 4) return { code: 'UCL', color: THEME.accent, desc: 'UEFA Champions League' };
    if (rank === 5) return { code: 'UEL', color: THEME.warning, desc: 'UEFA Europa League' };
    if (rank >= totalTeams - 1) return { code: 'REL', color: THEME.danger, desc: 'Relegation' };
  } else if (leagueId === 'fra.1') {
    if (rank <= 3) return { code: 'UCL', color: THEME.accent, desc: 'UEFA Champions League' };
    if (rank === 4) return { code: 'UEL', color: THEME.warning, desc: 'UEFA Europa League' };
    if (rank >= totalTeams - 1) return { code: 'REL', color: THEME.danger, desc: 'Relegation' };
  } else if (leagueId === 'eng.2') {
    if (rank <= 2) return { code: 'EPL', color: THEME.accent, desc: 'Premier League Promotion' };
    if (rank <= 6) return { code: 'PO', color: THEME.warning, desc: 'Promotion Play-offs' };
    if (rank > Math.max(2, totalTeams - 3)) return { code: 'REL', color: THEME.danger, desc: 'Relegation' };
  } else if (leagueId === 'eng.3') {
    if (rank <= 2) return { code: 'EFL', color: THEME.accent, desc: 'Championship Promotion' };
    if (rank <= 6) return { code: 'PO', color: THEME.warning, desc: 'Promotion Play-offs' };
    if (rank > Math.max(2, totalTeams - 4)) return { code: 'REL', color: THEME.danger, desc: 'Relegation' };
  } else if (leagueId === 'uefa.champions') {
    if (rank <= 8) return { code: 'R16', color: THEME.accent, desc: 'Round of 16 Direct' };
    if (rank <= 24) return { code: 'KPO', color: THEME.warning, desc: 'Knockout Play-offs' };
  } else if (totalTeams >= 6) {
    if (rank <= 2) return { code: 'KO', color: THEME.accent, desc: 'Knockout Stage' };
    if (rank <= 4) return { code: 'PO', color: THEME.warning, desc: 'Play-offs' };
  }
  return null;
};

const getFootballStatNum = (item, names) => {
  for (const n of names) {
    const found = item?.stats?.find(s => s.name === n);
    if (found !== undefined && found !== null) {
      const val = parseFloat(found.value ?? found.displayValue);
      if (!isNaN(val)) return val;
    }
  }
  return 0;
};

const sortFootballEntries = (entries = []) => {
  return [...entries].sort((a, b) => {
    const ptsA = getFootballStatNum(a, ['points']);
    const ptsB = getFootballStatNum(b, ['points']);
    if (ptsB !== ptsA) return ptsB - ptsA;

    const gdA = getFootballStatNum(a, ['pointDifferential', 'goalDifference']);
    const gdB = getFootballStatNum(b, ['pointDifferential', 'goalDifference']);
    if (gdB !== gdA) return gdB - gdA;

    const gfA = getFootballStatNum(a, ['pointsFor', 'goalsFor']);
    const gfB = getFootballStatNum(b, ['pointsFor', 'goalsFor']);
    if (gfB !== gfA) return gfB - gfA;

    const wA = getFootballStatNum(a, ['wins']);
    const wB = getFootballStatNum(b, ['wins']);
    if (wB !== wA) return wB - wA;

    return String(a?.team?.shortDisplayName || a?.team?.name || '').localeCompare(
      String(b?.team?.shortDisplayName || b?.team?.name || '')
    );
  });
};

const parseFootballStandingsCached = (leagueId, leagueName, json) => {
  if (!json) return [];
  const cacheKey = `soccer_std_v6|${leagueId}|${json?.children?.length || 0}|${json?.standings?.entries?.length || json?.entries?.length || 0}`;
  if (standingsParsedCache.has(cacheKey)) return standingsParsedCache.get(cacheKey);

  const parsedGroups = [];
  const seenGroupNames = new Set();
  const pushUniqueGroup = (rawName, entries) => {
    if (!entries || entries.length === 0) return;
    const cleanName = cleanGroupTitle(rawName, leagueName, 'Standings');
    const key = cleanName.toLowerCase();
    if (seenGroupNames.has(key)) return;
    seenGroupNames.add(key);
    parsedGroups.push({ name: cleanName, entries: sortFootballEntries(entries) });
  };

  if (json?.children && json.children.length > 0) {
    json.children.forEach(c => {
      pushUniqueGroup(c.name || c.abbreviation || 'Standings', c.standings?.entries || c.entries || []);
    });
  } else if (json?.standings?.entries) {
    pushUniqueGroup('Standings', json.standings.entries);
  } else if (json?.entries) {
    pushUniqueGroup('Standings', json.entries);
  }

  standingsParsedCache.set(cacheKey, parsedGroups);
  return parsedGroups;
};

const FootballStandingsView = memo(({ onTeamPress, onOpenMatch, onSwipeEdge }) => {
  const now = useMemo(() => new Date(), []);
  const availableLeagues = useMemo(() => {
    const seenIds = new Set();
    return FOOTBALL_LEAGUES.filter(l => {
      if (seenIds.has(l.id)) return false;
      seenIds.add(l.id);
      const cached = getCachedSync(`${API_SOCCER_STANDINGS_BASE}/${l.id}/standings`);
      return isFootballSeasonCurrent(l.id, cached, now).isCurrent;
    }).map(l => {
      const cached = getCachedSync(`${API_SOCCER_STANDINGS_BASE}/${l.id}/standings`);
      const check = isFootballSeasonCurrent(l.id, cached, now);
      return {
        ...l,
        cleanName: stripSeasonYear(l.name),
        seasonLabel: extractSeasonYear(check.seasonLabel)
      };
    });
  }, [now]);

  const [league, setLeague] = useState(() => availableLeagues[0] || FOOTBALL_LEAGUES[0]);
  const [groups, setGroups] = useState(() => {
    const first = availableLeagues[0] || FOOTBALL_LEAGUES[0];
    const cached = getCachedSync(`${API_SOCCER_STANDINGS_BASE}/${first.id}/standings`);
    return cached ? parseFootballStandingsCached(first.id, first.name, cached) : [];
  });
  const [resolvedSeasonLabel, setResolvedSeasonLabel] = useState(() => availableLeagues[0]?.seasonLabel || '');
  const [isCurrentSeasonActive, setIsCurrentSeasonActive] = useState(true);
  const [knockoutStages, setKnockoutStages] = useState([]);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    let active = true;
    const stdUrl = `${API_SOCCER_STANDINGS_BASE}/${league.id}/standings`;
    const cached = getCachedSync(stdUrl);
    const initialCheck = isFootballSeasonCurrent(league.id, cached, new Date());
    const initialYear = extractSeasonYear(initialCheck.seasonLabel);

    setResolvedSeasonLabel(initialYear);
    setIsCurrentSeasonActive(initialCheck.isCurrent);

    if (cached && initialCheck.isCurrent) {
      setGroups(parseFootballStandingsCached(league.id, league.name, cached));
      setLoading(false);
    } else {
      setLoading(true);
    }

    fetchWithCache(stdUrl).catch(() => null).then(async (json) => {
      if (!active) return;
      const check = isFootballSeasonCurrent(league.id, json, new Date());
      const conciseYear = extractSeasonYear(check.seasonLabel);
      setResolvedSeasonLabel(conciseYear);
      setIsCurrentSeasonActive(check.isCurrent);

      if (!check.isCurrent) {
        setGroups([]);
        setKnockoutStages([]);
        setLoading(false);
        return;
      }

      setGroups(parseFootballStandingsCached(league.id, league.name, json));
      setLoading(false);

      if (league.hasKnockout) {
        const ko = await extractFootballKnockouts(league.id, conciseYear).catch(() => []);
        if (active) setKnockoutStages(ko);
      } else {
        setKnockoutStages([]);
      }
    });

    return () => { active = false; };
  }, [league]);

  const leagueIds = useMemo(() => availableLeagues.map(l => l.id), [availableLeagues]);
  const selectLeagueById = useCallback((lid) => {
    const found = availableLeagues.find(l => l.id === lid);
    if (found) setLeague(found);
  }, [availableLeagues]);
  const stdSwipe = useSwipeSections(leagueIds, league.id, selectLeagueById, {
    onBoundaryPrev: onSwipeEdge ? () => onSwipeEdge(-1) : null,
    onBoundaryNext: onSwipeEdge ? () => onSwipeEdge(1) : null
  });
  const leaguePillsRef = useRef(null);
  useEffect(() => {
    const el = leaguePillsRef.current?.querySelector('[data-active="true"]');
    if (el && leaguePillsRef.current) {
      const target = el.offsetLeft - (leaguePillsRef.current.clientWidth / 2) + (el.offsetWidth / 2);
      leaguePillsRef.current.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    }
  }, [league.id]);

  const cleanLeagueTitle = stripSeasonYear(league.name);

  return (
    <div {...stdSwipe.bind} className="flex-1 p-4 pt-2.5 w-full">
      <div ref={leaguePillsRef} data-no-section-swipe="true" className="mb-5 flex overflow-x-auto no-scrollbar ios-momentum">
        {availableLeagues.map(l => {
          const active = league.id === l.id;
          return (
            <button
              key={l.id}
              data-active={active}
              onClick={() => stdSwipe.selectWithDir(l.id)}
              className={`px-4 py-2.5 rounded-[20px] flex items-center gap-2 mr-2.5 border shrink-0 transition-colors ${active ? 'bg-[#F5F5F7] border-[#F5F5F7]' : 'liquid-glass'}`}
            >
              <img src={active ? (l.logoLight || l.logo) : l.logo} loading="lazy" decoding="async" onError={(e) => handleImageError(e, l.short || l.cleanName)} className="w-4 h-4 object-contain shrink-0" style={{ opacity: active ? 1 : 0.92 }} alt="" />
              <span className={`text-[12px] font-bold whitespace-nowrap ${active ? 'text-[#000000]' : 'text-[#8E8E93]'}`}>
                {l.cleanName}
              </span>
            </button>
          );
        })}

const CricketStandingsView = memo(({ onTeamPress, onOpenMatch, onSwipeEdge }) => {
  const stdUrl = `${API_CRICKET_BASE}/standings`;
  const schedUrl = `${API_CRICKET_BASE}/schedule?days_past=30&days_ahead=30`;

  const buildCurrentLeagues = useCallback((json, sched = []) => {
    if (!Array.isArray(json) || json.length === 0) return [];
    const safeSched = Array.isArray(sched) ? sched : [];
    const cacheKey = `cricket_std_v2|${json.length}|${safeSched.length}`;
    if (standingsParsedCache.has(cacheKey)) return standingsParsedCache.get(cacheKey);

    const now = new Date();
    const leagueMap = new Map();

    json.forEach(item => {
      const check = isCricketTournamentCurrent(item, safeSched, now);
      if (!check.isCurrent) return;

      const validGroups = (item.tables || [])
        .filter(t => t.rows && t.rows.length > 0)
        .map(t => ({ name: t.name || 'Standings', rows: t.rows }));

      if (validGroups.length === 0) return;

      const canonicalClean = titleCase(check.cleanTitle)
        .replace(/\bIpl\b/g, 'IPL')
        .replace(/\bWpl\b/g, 'WPL')
        .replace(/\bPsl\b/g, 'PSL')
        .replace(/\bBbl\b/g, 'BBL')
        .replace(/\bCpl\b/g, 'CPL')
        .replace(/\bOdi\b/g, 'ODI')
        .replace(/\bT20i?\b/g, m => m.toUpperCase())
        .replace(/\bIcc\b/g, 'ICC')
        .replace(/\bWtc\b/g, 'WTC')
        .trim();

      const conciseYear = extractSeasonYear(check.seasonLabel) || String(now.getFullYear());
      const dedupeKey = canonicalClean.toLowerCase().replace(/[^a-z0-9]/g, '');

      if (!leagueMap.has(dedupeKey)) {
        leagueMap.set(dedupeKey, {
          id: dedupeKey,
          title: canonicalClean,
          cleanTitle: canonicalClean,
          rawTitle: item.league || canonicalClean,
          seasonLabel: conciseYear,
          logo: getCricketLeagueLogo(canonicalClean, item.league_logo),
          groups: validGroups.map(g => ({
            ...g,
            name: cleanGroupTitle(g.name, canonicalClean, 'Standings')
          })),
          allSched: safeSched
        });
      } else {
        const existing = leagueMap.get(dedupeKey);
        validGroups.forEach(vg => {
          const vgCleanName = cleanGroupTitle(vg.name, canonicalClean, 'Standings');
          const vgRowsSig = vg.rows.map(r => String(r.team_id || r.short_name || r.team_name).toLowerCase()).sort().join(',');
          const alreadyHasGroup = existing.groups.some(eg => {
            const egRowsSig = eg.rows.map(r => String(r.team_id || r.short_name || r.team_name).toLowerCase()).sort().join(',');
            return egRowsSig === vgRowsSig || String(eg.name).toLowerCase() === vgCleanName.toLowerCase();
          });
          if (!alreadyHasGroup) {
            existing.groups.push({ ...vg, name: vgCleanName });
          }
        });
      }
    });

    const result = Array.from(leagueMap.values());
    standingsParsedCache.set(cacheKey, result);
    return result;
  }, []);

  const [data, setData] = useState(() => {
    const cachedStd = getCachedSync(stdUrl);
    const cachedSched = getCachedSync(schedUrl) || getCachedSync(CRICKET_SCHEDULE_URL) || [];
    return buildCurrentLeagues(cachedStd, cachedSched);
  });
  const [selectedLeague, setSelectedLeague] = useState(() => data[0] || null);
  const [knockoutStages, setKnockoutStages] = useState(() => data[0] ? extractCricketKnockouts(data[0]) : []);
  const [loading, setLoading] = useState(() => data.length === 0);

  useEffect(() => {
    let active = true;
    const cachedSched = getCachedSync(schedUrl) || getCachedSync(CRICKET_SCHEDULE_URL) || [];

    Promise.all([
      fetchWithCache(stdUrl, false, 6000).catch(() => null),
      fetchWithCache(schedUrl, false, 7000).catch(() => cachedSched)
    ]).then(([json, sched]) => {
      if (!active) return;
      const built = buildCurrentLeagues(json, sched);
      setData(built);
      setSelectedLeague(prev => {
        if (built.length === 0) return null;
        return prev ? (built.find(b => b.id === prev.id || b.cleanTitle === prev.cleanTitle) || built[0]) : built[0];
      });
      setLoading(false);

    return () => { active = false; };
  }, [buildCurrentLeagues, stdUrl, schedUrl]);

  useEffect(() => {

      setKnockoutStages([]);
      return;
    }
    setKnockoutStages(extractCricketKnockouts(selectedLeague));

  const crLeagueIds = useMemo(() => data.map(l => l.id), [data]);
  const selectCrLeagueById = useCallback((lid) => {

      <div ref={crStdSwipe.contentRef} key={selectedLeague?.id || 'empty'} className={crStdSwipe.animClass}>

          {selectedLeague.groups.map((group, gIdx) => {

// 📈 CRICKET WORM & MANHATTAN GRAPHS
// ==========================================

const WormGraph = memo(({ graphs }) => {
  const computed = useMemo(() => {
    if (!graphs || graphs.length === 0) return null;
    const highestOver = Math.max(...graphs.flatMap(g => g.over_by_over?.map(o => o.over) || [0]));
    const maxOvers = highestOver <= 22 ? 20 : highestOver <= 52 ? 50 : Math.ceil(highestOver / 10) * 10;
    let maxRuns = 10;

    graphs.forEach(inn => {
      if (!inn.over_by_over) return;
      inn.over_by_over.forEach(o => {
        if (o.cumulative_runs > maxRuns && o.over <= maxOvers) {
          maxRuns = Math.ceil(o.cumulative_runs / 10) * 10;
        }
      });
    });

    const getPoints = (inningData) => {
      const pts = [{ x: 0, y: 100, over: 0, runs: 0, wickets: 0 }];
      if (!inningData?.over_by_over) return pts;
      inningData.over_by_over.forEach(o => {
        if (o.over <= maxOvers) {
          pts.push({
            x: (o.over / maxOvers) * 100,
            y: 100 - ((o.cumulative_runs / maxRuns) * 100),
            over: o.over,
            runs: o.cumulative_runs,
            wickets: o.wickets_this_over || 0
          });
        }
      });
      return pts;
    };

    const pts1 = getPoints(graphs[0]);
    const pts2 = graphs.length > 1 ? getPoints(graphs[1]) : [];
    const xAxisLabels = [];
    const intervalAmount = maxOvers >= 50 ? 10 : 5;
    for (let i = 0; i <= maxOvers; i += intervalAmount) xAxisLabels.push(i);

    const gridLines = [];
    const yIntervals = Math.max(50, Math.ceil(maxRuns / 3 / 10) * 10);
    for (let r = yIntervals; r < maxRuns; r += yIntervals) {
      gridLines.push(100 - ((r / maxRuns) * 100));
    }

    return { maxRuns, pts1, pts2, xAxisLabels, gridLines };
  }, [graphs]);

  if (!computed) return null;

  const { maxRuns, pts1, pts2, xAxisLabels, gridLines } = computed;
  const c1 = THEME.muted;
  const c2 = THEME.accent;

  return (
    <div className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)] mb-5">
      <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Worm (Cumulative Runs)</span>
      <div className="flex items-center mb-5 gap-4">
        <div className="flex items-center min-w-0">
          <div className="w-3 h-1 rounded-[2px] mr-2 shrink-0" style={{ backgroundColor: c1 }} />
          <span className="text-[10px] text-[#F5F5F7] font-extrabold break-words leading-tight">{graphs[0].team_name}</span>
        </div>
        {graphs.length > 1 && (
          <div className="flex items-center min-w-0">
            <div className="w-3 h-1 rounded-[2px] mr-2 shrink-0" style={{ backgroundColor: c2 }} />
            <span className="text-[10px] text-[#F5F5F7] font-extrabold break-words leading-tight">{graphs[1].team_name}</span>
          </div>
        )}
      </div>
      <div className="flex h-[170px]">
        <div className="flex flex-col justify-between pr-3 h-[150px] text-right">
          <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">{maxRuns}</span>
          <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">{Math.floor(maxRuns / 2)}</span>
          <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">0</span>
        </div>
        <div className="flex-1 pr-2">
          <div className="h-[150px] w-full border-b border-l border-[rgba(255,255,255,0.08)] relative">
            {gridLines.map((topPerc, idx) => (
              <div key={idx} className="absolute left-0 w-full h-[1px] bg-[rgba(255,255,255,0.08)]" style={{ top: `${topPerc}%` }} />
            ))}
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full overflow-visible">
              <polyline points={pts1.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke={c1} strokeWidth="2" vectorEffect="non-scaling-stroke" />
              {pts2.length > 0 && (
                <polyline points={pts2.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke={c2} strokeWidth="2" vectorEffect="non-scaling-stroke" />
              )}
            </svg>
            {pts1.filter(p => p.wickets > 0).map((pt, i) => (
              <div key={`w1-${i}`} className="absolute w-1.5 h-1.5 rounded-full -ml-[3px] -mt-[3px] border border-black" style={{ left: `${pt.x}%`, top: `${pt.y}%`, backgroundColor: c1 }} />
            ))}
            {pts2.filter(p => p.wickets > 0).map((pt, i) => (
              <div key={`w2-${i}`} className="absolute w-1.5 h-1.5 rounded-full -ml-[3px] -mt-[3px] border border-black" style={{ left: `${pt.x}%`, top: `${pt.y}%`, backgroundColor: c2 }} />
            ))}
          </div>
          <div className="flex justify-between w-full mt-2">
            {xAxisLabels.map(l => (
              <span key={l} className="text-[10px] text-[#8E8E93] font-bold text-center tabular-nums">{l}</span>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
});

const filterAndCategorizeMatchNotes = (allUpdates = [], tossText = '', resultText = '') => {
  const seen = new Set();
  const normToss = String(tossText || '').toLowerCase().trim();
  const normRes = String(resultText || '').toLowerCase().trim();
  const items = [];

  allUpdates.forEach(raw => {
    const clean = stripHtml(raw).replace(/\s+/g, ' ').trim();
    if (!clean || clean.length < 4) return;
    const low = clean.toLowerCase();

    if (/^\d+(\.\d+)?$/.test(clean) || /^over\s*\d+$/i.test(clean)) return;
    if (normToss && (low === normToss || low.includes('elected to bat') || low.includes('elected to field'))) return;
    if (normRes && low === normRes) return;
    if (seen.has(low)) return;

    let meta = null;
    if (/(rain|wet outfield|weather|bad light|lightning|thunderstorm|delayed|delay|covers|drizzle|inspection)/i.test(low)) {
      meta = { label: 'Weather / Delay', icon: CloudRain, color: THEME.danger };
    } else if (/(stumps|end of day|close of play)/i.test(low)) {
      meta = { label: 'Stumps', icon: Moon, color: THEME.warning };
    } else if (/(lunch|tea|dinner|drinks break|innings break)/i.test(low)) {
      meta = { label: 'Session Break', icon: Coffee, color: THEME.warning };
    } else if (/(strategic timeout|time-out|timeout)/i.test(low)) {
      meta = { label: 'Timeout', icon: Hourglass, color: THEME.freekick };
    } else if (/(powerplay|mandatory|fielding restrictions)/i.test(low)) {
      meta = { label: 'Powerplay', icon: Zap, color: THEME.accent };
    } else if (/(century|100|fifty|half-century|\b50\b|hat-trick|milestone|partnership|record|fastest)/i.test(low)) {
      meta = { label: 'Milestone', icon: Award, color: THEME.fwd };
    } else if (/(impact player|substitute|concussion|injury|retired hurt|replaced)/i.test(low)) {
      meta = { label: 'Tactical / Sub', icon: Users, color: THEME.success };
    } else if (/(review|drs|umpire|officials|referee|third umpire|ball tracker)/i.test(low)) {
      meta = { label: 'Officials / DRS', icon: Scale, color: THEME.shot };
    } else if (/(target|need|require|trail by|lead by|dl method|dls|super over|won by|tied)/i.test(low)) {
      meta = { label: 'Match Situation', icon: Flame, color: THEME.accent };
    } else if (/(new ball|free hit|dropped|run out|bowled|caught|wicket)/i.test(low)) {
      meta = { label: 'Key Play', icon: Sparkles, color: THEME.warning };
    } else if (clean.length >= 12) {
      meta = { label: 'Match Note', icon: Info, color: THEME.shot };
    }

    if (meta) {
      seen.add(low);
      items.push({ text: clean, ...meta });
    }
  });

  return items.slice(0, 10);
};

// ==========================================
// 🏏 CRICKET MATCH MODAL (FIXED TAB ALIGNMENT & SPACING)

const CRICKET_MATCH_TABS = [
  { id: 'info', label: 'Info' },
  { id: 'scorecard', label: 'Scorecard' },
  { id: 'summary', label: 'Summary' },
  { id: 'overs', label: 'Overs' },
  { id: 'graphs', label: 'Graphs' }
];

const CricketMatchModal = ({ match, selectedDate, onClose, onOpenTeam }) => {
  const { closing, handleClose } = useSmoothDismiss(onClose);
  const id = match?.match_id;
  const [matchDetails, setMatchDetails] = useState(() => id ? getCachedSync(`${API_CRICKET_BASE}/match/${id}`) : null);
  const [matchCommentary, setMatchCommentary] = useState(() => {
    if (!id) return [];
    const tc = getCachedSync(`${API_CRICKET_BASE}/commentary/${id}`);
    const bbb = getCachedSync(`${API_CRICKET_BASE}/ball-by-ball/${id}`);
    return tc?.commentary || bbb?.timeline || [];
  });
  const [matchGraphs, setMatchGraphs] = useState(() => id ? (getCachedSync(`${API_CRICKET_BASE}/graphs/${id}`)?.graphs || null) : null);
  const [detailsLoading, setDetailsLoading] = useState(() => !matchDetails);
  const [activeTab, setActiveTab] = useState('info');
  const [activeInnings, setActiveInnings] = useState(0);
  const cmTabIds = useMemo(() => CRICKET_MATCH_TABS.map(t => t.id), []);
  const cmSwipe = useSwipeSections(cmTabIds, activeTab, setActiveTab, {
    onBoundaryPrev: handleClose,
    stopPropagation: true
  });
  const autoSelectInningsRef = useRef(true);

  const fetchMatchHub = useCallback(async (isSilent = false) => {
    if (!id) return;
    if (!isSilent && !matchDetails) setDetailsLoading(true);

    fetchWithCache(`${API_CRICKET_BASE}/match/${id}`, isSilent, 20000).then(detailsRes => {
      if (detailsRes) {
        setMatchDetails(detailsRes);
        if (autoSelectInningsRef.current && detailsRes.innings && detailsRes.innings.length > 0) {
          setActiveInnings(detailsRes.innings.length - 1);
          autoSelectInningsRef.current = false;
        }
      }
      setDetailsLoading(false);
    }).catch(() => setDetailsLoading(false));

    const runSecondary = () => {
      Promise.all([
        fetchWithCache(`${API_CRICKET_BASE}/commentary/${id}`, isSilent).catch(() => null),
        fetchWithCache(`${API_CRICKET_BASE}/ball-by-ball/${id}`, isSilent).catch(() => null)
      ]).then(([textCommRes, commRes]) => {
        const combined = textCommRes?.commentary || commRes?.timeline || [];
        if (combined.length > 0) setMatchCommentary(combined);
      });

      fetchWithCache(`${API_CRICKET_BASE}/graphs/${id}`, isSilent).then(graphsRes => {
        if (graphsRes?.graphs) setMatchGraphs(graphsRes.graphs);
      }).catch(() => {});
    };
    if (isSilent) runSecondary();
    else setTimeout(runSecondary, 140);
  }, [id]);

  useEffect(() => {
    fetchMatchHub(false);
    const interval = setInterval(() => fetchMatchHub(true), 8000);
    return () => clearInterval(interval);
  }, [fetchMatchHub]);

  const groupedOvers = useMemo(() => {
    if (!matchCommentary || matchCommentary.length === 0) return [];
    const inningsBlocks = [];
    let currentBlock = [];
    let prevOver = -1;
    const getOverNum = (ball) => ball.over !== undefined ? ball.over : ball.over_number;

    matchCommentary.forEach(ball => {
      const currentOver = getOverNum(ball);
      if (prevOver !== -1 && currentOver > prevOver + 2) {
        inningsBlocks.push(currentBlock);
        currentBlock = [];
      }
      currentBlock.push(ball);
      prevOver = currentOver;
    });
    if (currentBlock.length > 0) inningsBlocks.push(currentBlock);
    inningsBlocks.reverse();

    const inningData = inningsBlocks[activeInnings] || [];
    const chronological = [...inningData].reverse();
    const groupsMap = {};

    chronological.forEach(ball => {
      const overNum = getOverNum(ball);
      const runs = ball.runs !== undefined ? ball.runs : ball.runs_this_ball;
      const isWicket = ball.is_wicket;
      const overIndex = overNum === Math.floor(overNum) && overNum > 0 ? Math.floor(overNum) - 1 : Math.floor(overNum);

      if (!groupsMap[overIndex]) {
        let bowler = 'Bowler';
        if (ball.bowler_name) bowler = ball.bowler_name;
        else if (ball.description) bowler = String(ball.description).split(' to ')[0].trim();
        groupsMap[overIndex] = { num: overIndex + 1, bowler, balls: [], highlights: [] };
      }

      const rawText = String(ball.text || ball.description || '');
      const desc = rawText.toLowerCase();
      let val = runs === 0 ? '0' : String(runs ?? '0');
      let bg = THEME.surfaceHighlight;
      let txt = THEME.text;

      if (isWicket) { val = 'W'; bg = THEME.danger; txt = '#fff'; }
      else if (desc.includes('wide')) { val = `${runs}w`; }
      else if (desc.includes('no ball')) { val = `${runs}nb`; bg = THEME.warning; txt = '#fff'; }
      else if (desc.includes('leg bye')) { val = `${runs}lb`; }
      else if (desc.includes('bye') && !desc.includes('leg bye')) { val = `${runs}b`; }
      else if (runs >= 6) { bg = THEME.freekick; txt = '#fff'; }
      else if (runs >= 4) { bg = THEME.shot; txt = '#fff'; }

      groupsMap[overIndex].balls.push({ val, bg, txt });

      if (isWicket || runs >= 4 || desc.includes('six') || desc.includes('four')) {
        const cleanDesc = rawText.replace(/<[^>]+>/g, '').trim();
        groupsMap[overIndex].highlights.push({
          event: isWicket ? 'WICKET' : (runs >= 6 ? 'SIX' : 'FOUR'),
          color: isWicket ? THEME.danger : (runs >= 6 ? THEME.freekick : THEME.shot),
          desc: cleanDesc
        });
      }
    });

    return Object.values(groupsMap).sort((a, b) => b.num - a.num);
  }, [matchCommentary, activeInnings]);

  const renderCricketModalHero = () => {
    if (!match?.teams || match.teams.length < 2) return null;
    const hTeam = match.teams[0];
    const aTeam = match.teams[1];
    let hScore = formatCricketScore(hTeam.score);
    let aScore = formatCricketScore(aTeam.score);

    if (hScore.overs) hScore.overs = hScore.overs.replace(/ • Inn \d+/g, '').replace(/Inn \d+/g, '').replace(/,?\s*target\s*\d+/ig, '').replace(/,\s*\)/g, ')').trim();
    if (aScore.overs) aScore.overs = aScore.overs.replace(/ • Inn \d+/g, '').replace(/Inn \d+/g, '').replace(/,?\s*target\s*\d+/ig, '').replace(/,\s*\)/g, ')').trim();

    if (matchDetails?.innings && matchDetails.innings.length > 0) {
      const hInns = matchDetails.innings.filter(i => i.team_name === hTeam.name || i.team_name === hTeam.short_name);
      if (hInns.length > 0) {
        const latest = hInns[hInns.length - 1];
        hScore = { runs: `${latest.runs}/${latest.wickets}`, overs: `(${latest.overs} ov)` };
      }
      const aInns = matchDetails.innings.filter(i => i.team_name === aTeam.name || i.team_name === aTeam.short_name);
      if (aInns.length > 0) {
        const latest = aInns[aInns.length - 1];
        aScore = { runs: `${latest.runs}/${latest.wickets}`, overs: `(${latest.overs} ov)` };
      }
    }

    const { isLive, isActionLive, displayLabel, color } = getCricketMatchStatus(match, selectedDate);

    return (
      <div className="flex justify-between px-5 pt-2 pb-4 w-full items-start shrink-0">
        <div className="w-[38%] flex flex-col items-center gap-1.5 cursor-pointer" onClick={() => onOpenTeam(hTeam, null, null, 'cricket')}>
          <img src={getCricketLogo(hTeam)} style={getCricketLogoStyle(hTeam)} onError={(e) => handleCricketImageError(e, hTeam)} className="w-[68px] h-[68px] object-contain" alt="" />
          <span className="text-[13px] font-bold text-[#F5F5F7] text-center mt-0.5">{hTeam.short_name || hTeam.name}</span>
          <div className="h-[46px] flex flex-col items-center justify-start">
            <span className="text-[30px] font-extrabold text-[#F5F5F7] text-center tabular-nums leading-none">{hScore.runs || '-'}</span>
            {hScore.overs && <span className="text-[11px] text-[#8E8E93] font-bold mt-1">{hScore.overs}</span>}
          </div>
        </div>
        <div className="w-[24%] flex flex-col items-center justify-center pt-5">
          {isLive ? (
            <LiveIndicator label={displayLabel} isActionLive={isActionLive} color={color} />
          ) : (
            <span className="text-[10px] text-[#F5F5F7] font-bold text-center mt-1.5 tracking-[1px]">{displayLabel}</span>
          )}
        </div>
        <div className="w-[38%] flex flex-col items-center gap-1.5 cursor-pointer" onClick={() => onOpenTeam(aTeam, null, null, 'cricket')}>
          <img src={getCricketLogo(aTeam)} style={getCricketLogoStyle(aTeam)} onError={(e) => handleCricketImageError(e, aTeam)} className="w-[68px] h-[68px] object-contain" alt="" />
          <span className="text-[13px] font-bold text-[#F5F5F7] text-center mt-0.5">{aTeam.short_name || aTeam.name}</span>
          <div className="h-[46px] flex flex-col items-center justify-start">
            {aScore.runs ? (
              <>
                <span className="text-[30px] font-extrabold text-[#F5F5F7] text-center tabular-nums leading-none">{aScore.runs}</span>
                {aScore.overs && <span className="text-[11px] text-[#8E8E93] font-bold mt-1">{aScore.overs}</span>}
              </>
            ) : (
              <span className="text-[13px] text-[#8E8E93] font-bold mt-3 italic">Yet to bat</span>
            )}
          </div>
        </div>
      </div>
    );
  };

  const renderInfoTab = () => {
    const toss = formatCricketToss(matchDetails?.toss || match.toss, match.teams);
    const { detailedStatus, allUpdates } = getCricketMatchStatus(match, selectedDate);
    let dayText = null;
    if (detailedStatus && detailedStatus.toLowerCase().includes('day')) {
      const matchDay = detailedStatus.match(/day \d+/i);
      if (matchDay) dayText = titleCase(matchDay[0]);
    }

    const hTeam = match.teams[0];
    const aTeam = match.teams[1];
    let equation = null;
    let resultText = null;
    const rawUpdatesForRes = String(match.match_update || matchDetails?.match_update || '').split('|').map(s => s.trim());
    const foundResult = rawUpdatesForRes.find(u => /(won by| 2, .* 0| 0, .* 2)/i.test(u) && !u.toLowerCase().includes('innings'));
    if ((match.status === 'POST' || (detailedStatus && detailedStatus.toUpperCase().includes('FINAL'))) && foundResult) {
      resultText = foundResult;
    }

    if (match.status === 'IN' || match.status === 'LIVE' || (detailedStatus && detailedStatus.toUpperCase().includes('LIVE')) || (detailedStatus && detailedStatus.toUpperCase().includes('STUMPS'))) {
      const hRuns = parseInt(hTeam.score?.split('/')[0]?.split(' ')[0]) || 0;
      const aRuns = parseInt(aTeam.score?.split('/')[0]?.split(' ')[0]) || 0;
      const isTest = match.format === 'Test' || String(match.title || '').toLowerCase().includes('test') || String(match.title || '').toLowerCase().includes('first class');
      if (isTest && aTeam.score) {
        const diff = hRuns - aRuns;
        if (diff > 0) equation = `${aTeam.short_name} trail by ${diff} runs`;
        else if (diff < 0) equation = `${aTeam.short_name} lead by ${Math.abs(diff)} runs`;

      } else if (aTeam.score) {

            const ovParts = overMatch[1].split('/');
