const CricketStandingsView = memo(({ onTeamPress, onOpenMatch }) => {
  const stdUrl = `${API_CRICKET_BASE}/standings`;
  const schedUrl = `${API_CRICKET_BASE}/schedule?days_past=30&days_ahead=30`;

  const buildCurrentLeagues = useCallback((json, sched = []) => {
    if (!Array.isArray(json) || json.length === 0) return [];
    const safeSched = Array.isArray(sched) ? sched : [];
    const cacheKey = `cricket_std_v2|${json.length}|${safeSched.length}`;
    if (standingsParsedCache.has(cacheKey)) return standingsParsedCache.get(cacheKey);

    const now = new Date();
    const leagueMap = new Map();

    json.forEach(item => {
      const check = isCricketTournamentCurrent(item, safeSched, now);
      if (!check.isCurrent) return;

      const validGroups = (item.tables || [])
        .filter(t => t.rows && t.rows.length > 0)
        .map(t => ({ name: t.name || 'Standings', rows: t.rows }));

      if (validGroups.length === 0) return;

      const canonicalClean = titleCase(check.cleanTitle)
        .replace(/\bIpl\b/g, 'IPL')
        .replace(/\bWpl\b/g, 'WPL')
        .replace(/\bPsl\b/g, 'PSL')
        .replace(/\bBbl\b/g, 'BBL')
        .replace(/\bCpl\b/g, 'CPL')
        .replace(/\bOdi\b/g, 'ODI')
        .replace(/\bT20i?\b/g, m => m.toUpperCase())
        .replace(/\bIcc\b/g, 'ICC')
        .replace(/\bWtc\b/g, 'WTC')
        .trim();

      const conciseYear = extractSeasonYear(check.seasonLabel) || String(now.getFullYear());
      const dedupeKey = canonicalClean.toLowerCase().replace(/[^a-z0-9]/g, '');

      if (!leagueMap.has(dedupeKey)) {
        leagueMap.set(dedupeKey, {
          id: dedupeKey,
          title: canonicalClean,
          cleanTitle: canonicalClean,
          rawTitle: item.league || canonicalClean,
          seasonLabel: conciseYear,
          logo: getCricketLeagueLogo(canonicalClean, item.league_logo),
          groups: validGroups.map(g => ({
            ...g,
            name: cleanGroupTitle(g.name, canonicalClean, 'Standings')
          })),
          allSched: safeSched
        });
      } else {
        const existing = leagueMap.get(dedupeKey);
        validGroups.forEach(vg => {
          const vgCleanName = cleanGroupTitle(vg.name, canonicalClean, 'Standings');
          const vgRowsSig = vg.rows.map(r => String(r.team_id || r.short_name || r.team_name).toLowerCase()).sort().join(',');
          const alreadyHasGroup = existing.groups.some(eg => {
            const egRowsSig = eg.rows.map(r => String(r.team_id || r.short_name || r.team_name).toLowerCase()).sort().join(',');
            return egRowsSig === vgRowsSig || String(eg.name).toLowerCase() === vgCleanName.toLowerCase();
          });
          if (!alreadyHasGroup) {
            existing.groups.push({ ...vg, name: vgCleanName });
          }
        });
      }
    });

    const result = Array.from(leagueMap.values());
    standingsParsedCache.set(cacheKey, result);
    return result;
  }, []);

  const [data, setData] = useState(() => {
    const cachedStd = getCachedSync(stdUrl);
    const cachedSched = getCachedSync(schedUrl) || getCachedSync(`${API_CRICKET_BASE}/schedule?days_past=3&days_ahead=4`) || [];
    return buildCurrentLeagues(cachedStd, cachedSched);
  });
  const [selectedLeague, setSelectedLeague] = useState(() => data[0] || null);
  const [knockoutStages, setKnockoutStages] = useState(() => data[0] ? extractCricketKnockouts(data[0]) : []);
  const [loading, setLoading] = useState(() => data.length === 0);

  useEffect(() => {
    let active = true;
    const cachedSched = getCachedSync(schedUrl) || getCachedSync(`${API_CRICKET_BASE}/schedule?days_past=3&days_ahead=4`) || [];

    Promise.all([
      fetchWithCache(stdUrl, false, 6000).catch(() => null),
      fetchWithCache(schedUrl, false, 7000).catch(() => cachedSched)
    ]).then(([json, sched]) => {
      if (!active) return;
      const built = buildCurrentLeagues(json, sched);
      setData(built);
      setSelectedLeague(prev => {
        if (built.length === 0) return null;
        return prev ? (built.find(b => b.id === prev.id || b.cleanTitle === prev.cleanTitle) || built[0]) : built[0];
      });
      setLoading(false);
    });

    return () => { active = false; };
  }, [buildCurrentLeagues, stdUrl, schedUrl]);

  useEffect(() => {
    if (!selectedLeague) {
      setKnockoutStages([]);
      return;
    }
    setKnockoutStages(extractCricketKnockouts(selectedLeague));
  }, [selectedLeague]);

  return (
    <div className="flex-1 p-4 pt-2.5 w-full">
      {/* Tournament Selector Pills: Clean Title Only (No Duplicate Year/League Title) */}
      {data.length > 0 && (
        <div className="mb-5 flex overflow-x-auto [&::-webkit-scrollbar]:hidden">
          {data.map(l => {
            const active = selectedLeague?.id === l.id;
            return (
              <button
                key={l.id}
                onClick={() => setSelectedLeague(l)}
                className={`px-4 py-2.5 rounded-[20px] flex items-center gap-2 mr-2.5 border shrink-0 transition-colors ${active ? 'bg-[#F5F5F7] border-[#F5F5F7]' : 'bg-[#121212] border-[rgba(255,255,255,0.08)]'}`}
              >
                <img src={l.logo} loading="lazy" decoding="async" onError={(e) => handleImageError(e, l.cleanTitle)} className="w-4 h-4 object-contain rounded-sm shrink-0" style={{ opacity: active ? 1 : 0.75 }} alt="" />
                <span className={`text-[12px] font-bold whitespace-nowrap ${active ? 'text-[#000000]' : 'text-[#8E8E93]'}`}>
                  {l.cleanTitle}
                </span>
              </button>
            );
          })}
        </div>
      )}

      {loading && data.length === 0 ? (
        <WhitePillLoader className="mt-10 py-6" />
      ) : selectedLeague ? (
        <div className="pb-40">
          {knockoutStages.length > 0 && (
            <KnockoutBracketSection
              stages={knockoutStages}
              sport="cricket"
              leagueLogo={selectedLeague.logo}
              leagueTitle={selectedLeague.cleanTitle}
              seasonLabel={selectedLeague.seasonLabel}
              onOpenMatch={onOpenMatch}
              onOpenTeam={onTeamPress}
            />
          )}

          {selectedLeague.groups.map((group, gIdx) => {
            const headerText = group.name === 'Standings'
              ? (selectedLeague.groups.length > 1 ? `${selectedLeague.cleanTitle} • Group ${gIdx + 1}` : selectedLeague.cleanTitle)
              : `${selectedLeague.cleanTitle} • ${group.name}`;

            return (
              <div key={gIdx} className="mb-6">
                <div className="flex items-center justify-between gap-2 mb-3 px-2">
                  <div className="flex items-center gap-2 min-w-0">
                    <img src={selectedLeague.logo} loading="lazy" decoding="async" onError={(e) => handleImageError(e, selectedLeague.cleanTitle)} className="w-4 h-4 object-contain rounded-sm shrink-0" alt="" />
                    <span className="text-[#8E8E93] text-[11px] font-extrabold tracking-[1.5px] uppercase break-words leading-snug">
                      {headerText}

                  </div>
                  {selectedLeague.seasonLabel && (

                </div>

// ==========================================

const WormGraph = memo(({ graphs }) => {
  const computed = useMemo(() => {
    if (!graphs || graphs.length === 0) return null;
    const highestOver = Math.max(...graphs.flatMap(g => g.over_by_over?.map(o => o.over) || [0]));
    const maxOvers = highestOver <= 22 ? 20 : highestOver <= 52 ? 50 : Math.ceil(highestOver / 10) * 10;
    let maxRuns = 10;

    graphs.forEach(inn => {
      if (!inn.over_by_over) return;
      inn.over_by_over.forEach(o => {
        if (o.cumulative_runs > maxRuns && o.over <= maxOvers) {
          maxRuns = Math.ceil(o.cumulative_runs / 10) * 10;
        }
      });
    });

    const getPoints = (inningData) => {
      const pts = [{ x: 0, y: 100, over: 0, runs: 0, wickets: 0 }];
      if (!inningData?.over_by_over) return pts;
      inningData.over_by_over.forEach(o => {
        if (o.over <= maxOvers) {
          pts.push({
            x: (o.over / maxOvers) * 100,
            y: 100 - ((o.cumulative_runs / maxRuns) * 100),
            over: o.over,
            runs: o.cumulative_runs,
            wickets: o.wickets_this_over || 0
          });
        }
      });
      return pts;
    };

    const pts1 = getPoints(graphs[0]);
    const pts2 = graphs.length > 1 ? getPoints(graphs[1]) : [];
    const xAxisLabels = [];
    const intervalAmount = maxOvers >= 50 ? 10 : 5;
    for (let i = 0; i <= maxOvers; i += intervalAmount) xAxisLabels.push(i);

    const gridLines = [];
    const yIntervals = Math.max(50, Math.ceil(maxRuns / 3 / 10) * 10);
    for (let r = yIntervals; r < maxRuns; r += yIntervals) {
      gridLines.push(100 - ((r / maxRuns) * 100));
    }

    return { maxRuns, pts1, pts2, xAxisLabels, gridLines };
  }, [graphs]);

  if (!computed) return null;

  const { maxRuns, pts1, pts2, xAxisLabels, gridLines } = computed;
  const c1 = THEME.muted;
  const c2 = THEME.accent;

  return (

const filterAndCategorizeMatchNotes = (allUpdates = [], tossText = '', resultText = '') => {
  const seen = new Set();
  const normToss = String(tossText || '').toLowerCase().trim();
  const normRes = String(resultText || '').toLowerCase().trim();
  const items = [];

  allUpdates.forEach(raw => {
    const clean = stripHtml(raw).replace(/\s+/g, ' ').trim();
    if (!clean || clean.length < 4) return;
    const low = clean.toLowerCase();

    if (/^\d+(\.\d+)?$/.test(clean) || /^over\s*\d+$/i.test(clean)) return;
    if (normToss && (low === normToss || low.includes('elected to bat') || low.includes('elected to field'))) return;
    if (normRes && low === normRes) return;
    if (seen.has(low)) return;

    let meta = null;
    if (/(rain|wet outfield|weather|bad light|lightning|thunderstorm|delayed|delay|covers|drizzle|inspection)/i.test(low)) {
      meta = { label: 'Weather / Delay', icon: CloudRain, color: THEME.danger };
    } else if (/(stumps|end of day|close of play)/i.test(low)) {
      meta = { label: 'Stumps', icon: Moon, color: THEME.warning };
    } else if (/(lunch|tea|dinner|drinks break|innings break)/i.test(low)) {
      meta = { label: 'Session Break', icon: Coffee, color: THEME.warning };
    } else if (/(strategic timeout|time-out|timeout)/i.test(low)) {
      meta = { label: 'Timeout', icon: Hourglass, color: THEME.freekick };
    } else if (/(powerplay|mandatory|fielding restrictions)/i.test(low)) {
      meta = { label: 'Powerplay', icon: Zap, color: THEME.accent };
    } else if (/(century|100|fifty|half-century|\b50\b|hat-trick|milestone|partnership|record|fastest)/i.test(low)) {
      meta = { label: 'Milestone', icon: Award, color: THEME.fwd };
    } else if (/(impact player|substitute|concussion|injury|retired hurt|replaced)/i.test(low)) {
      meta = { label: 'Tactical / Sub', icon: Users, color: THEME.success };
    } else if (/(review|drs|umpire|officials|referee|third umpire|ball tracker)/i.test(low)) {
      meta = { label: 'Officials / DRS', icon: Scale, color: THEME.shot };
    } else if (/(target|need|require|trail by|lead by|dl method|dls|super over|won by|tied)/i.test(low)) {
      meta = { label: 'Match Situation', icon: Flame, color: THEME.accent };
    } else if (/(new ball|free hit|dropped|run out|bowled|caught|wicket)/i.test(low)) {
      meta = { label: 'Key Play', icon: Sparkles, color: THEME.warning };
    } else if (clean.length >= 12) {
      meta = { label: 'Match Note', icon: Info, color: THEME.shot };
    }

    if (meta) {
      seen.add(low);
      items.push({ text: clean, ...meta });
    }
  });

  return items.slice(0, 10);
};

const CRICKET_MATCH_TABS = [
  { id: 'info', label: 'Info' },

];

const CricketMatchModal = ({ match, selectedDate, onClose, onOpenTeam }) => {
  const id = match?.match_id;
  const [matchDetails, setMatchDetails] = useState(() => id ? getCachedSync(`${API_CRICKET_BASE}/match/${id}`) : null);
  const [matchCommentary, setMatchCommentary] = useState(() => {
    if (!id) return [];
    const tc = getCachedSync(`${API_CRICKET_BASE}/commentary/${id}`);
    const bbb = getCachedSync(`${API_CRICKET_BASE}/ball-by-ball/${id}`);
    return tc?.commentary || bbb?.timeline || [];
  });
  const [matchGraphs, setMatchGraphs] = useState(() => id ? (getCachedSync(`${API_CRICKET_BASE}/graphs/${id}`)?.graphs || null) : null);
  const [detailsLoading, setDetailsLoading] = useState(() => !matchDetails);
  const [activeTab, setActiveTab] = useState('info');
  const [activeInnings, setActiveInnings] = useState(0);
  const autoSelectInningsRef = useRef(true);

  const fetchMatchHub = useCallback(async (isSilent = false) => {
    if (!id) return;
    if (!isSilent && !matchDetails) setDetailsLoading(true);

    fetchWithCache(`${API_CRICKET_BASE}/match/${id}`, isSilent).then(detailsRes => {
      if (detailsRes) {
        setMatchDetails(detailsRes);
        if (autoSelectInningsRef.current && detailsRes.innings && detailsRes.innings.length > 0) {
          setActiveInnings(detailsRes.innings.length - 1);
          autoSelectInningsRef.current = false;
        }
      }
      setDetailsLoading(false);
    }).catch(() => setDetailsLoading(false));

    Promise.all([
      fetchWithCache(`${API_CRICKET_BASE}/commentary/${id}`, isSilent).catch(() => null),
      fetchWithCache(`${API_CRICKET_BASE}/ball-by-ball/${id}`, isSilent).catch(() => null)
    ]).then(([textCommRes, commRes]) => {
      const combined = textCommRes?.commentary || commRes?.timeline || [];
      if (combined.length > 0) setMatchCommentary(combined);
    });

    fetchWithCache(`${API_CRICKET_BASE}/graphs/${id}`, isSilent).then(graphsRes => {
      if (graphsRes?.graphs) setMatchGraphs(graphsRes.graphs);
    }).catch(() => {});
  }, [id]);

  useEffect(() => {
    fetchMatchHub(false);
    const interval = setInterval(() => fetchMatchHub(true), 8000);
    return () => clearInterval(interval);
  }, [fetchMatchHub]);

  const groupedOvers = useMemo(() => {
    if (!matchCommentary || matchCommentary.length === 0) return [];
    const inningsBlocks = [];
    let currentBlock = [];
    let prevOver = -1;
    const getOverNum = (ball) => ball.over !== undefined ? ball.over : ball.over_number;

    matchCommentary.forEach(ball => {
      const currentOver = getOverNum(ball);
      if (prevOver !== -1 && currentOver > prevOver + 2) {
        inningsBlocks.push(currentBlock);
        currentBlock = [];
      }
      currentBlock.push(ball);
      prevOver = currentOver;
    });
    if (currentBlock.length > 0) inningsBlocks.push(currentBlock);
    inningsBlocks.reverse();

    const inningData = inningsBlocks[activeInnings] || [];
    const chronological = [...inningData].reverse();
    const groupsMap = {};

    chronological.forEach(ball => {
      const overNum = getOverNum(ball);
      const runs = ball.runs !== undefined ? ball.runs : ball.runs_this_ball;
      const isWicket = ball.is_wicket;
      const overIndex = overNum === Math.floor(overNum) && overNum > 0 ? Math.floor(overNum) - 1 : Math.floor(overNum);

      if (!groupsMap[overIndex]) {
        let bowler = 'Bowler';
        if (ball.bowler_name) bowler = ball.bowler_name;
        else if (ball.description) bowler = String(ball.description).split(' to ')[0].trim();
        groupsMap[overIndex] = { num: overIndex + 1, bowler, balls: [], highlights: [] };
      }

      const rawText = String(ball.text || ball.description || '');
      const desc = rawText.toLowerCase();
      let val = runs === 0 ? '0' : String(runs ?? '0');
      let bg = THEME.surfaceHighlight;
      let txt = THEME.text;

      if (isWicket) { val = 'W'; bg = THEME.danger; txt = '#fff'; }
      else if (desc.includes('wide')) { val = `${runs}w`; }
      else if (desc.includes('no ball')) { val = `${runs}nb`; bg = THEME.warning; txt = '#fff'; }
      else if (desc.includes('leg bye')) { val = `${runs}lb`; }
      else if (desc.includes('bye') && !desc.includes('leg bye')) { val = `${runs}b`; }
      else if (runs >= 6) { bg = THEME.freekick; txt = '#fff'; }
      else if (runs >= 4) { bg = THEME.shot; txt = '#fff'; }

      groupsMap[overIndex].balls.push({ val, bg, txt });

      if (isWicket || runs >= 4 || desc.includes('six') || desc.includes('four')) {
        const cleanDesc = rawText.replace(/<[^>]+>/g, '').trim();
        groupsMap[overIndex].highlights.push({
          event: isWicket ? 'WICKET' : (runs >= 6 ? 'SIX' : 'FOUR'),
          color: isWicket ? THEME.danger : (runs >= 6 ? THEME.freekick : THEME.shot),
          desc: cleanDesc
        });
      }
    });

    return Object.values(groupsMap).sort((a, b) => b.num - a.num);
  }, [matchCommentary, activeInnings]);

  const renderCricketModalHero = () => {
    const hTeam = match.teams[0];

    if (aScore.overs) aScore.overs = aScore.overs.replace(/ • Inn \d+/g, '').replace(/Inn \d+/g, '').replace(/,?\s*target\s*\d+/ig, '').replace(/,\s*\)/g, ')').trim();

    if (matchDetails?.innings && matchDetails.innings.length > 0) {

          </div>
        </div>

  const renderInfoTab = () => {

          <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Match Venue</span>
          <div className="h-[180px] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] bg-[#121212] relative">
            <img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=800&q=80" alt="Stadium" loading="lazy" decoding="async" className="absolute inset-0 w-full h-full object-cover" />
            <div className="absolute inset-0 bg-black/60" />
            <div className="relative z-10 h-full p-5 flex flex-col justify-end">
              <div className="flex items-center mb-3.5">
                <Landmark size={28} color={THEME.text} className="shrink-0" />
                <div className="flex-1 ml-4 min-w-0">
                  <span className="block text-white text-[20px] font-extrabold break-words leading-tight">{venueName}</span>
                  <span className="block text-[#ccc] text-[12px] font-bold tracking-[1px] mt-0.5 uppercase break-words leading-snug">{city}</span>
                </div>
              </div>
              {capacity && (
                <div className="flex border-t border-white/20 pt-3.5 gap-4">
                  <div>
                    <span className="block text-[#aaa] text-[10px] font-bold mb-1 uppercase">Capacity</span>
                    <span className="block text-white text-[14px] font-extrabold">{capacity.toLocaleString()}</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  };

  const renderScorecardTab = () => {
    const inning = matchDetails?.innings?.[activeInnings];
    if (!inning) return <EmptyState icon={CircleDashed} title="Scorecard Pending" message="Innings details will appear once the match data updates." />;

    const partnerships = inning.partnerships || [];
    const fow = inning.fall_of_wickets || [];

    return (
      <div className="px-4 pb-10">
        <div className="bg-[#121212] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)]">
          <div className="flex bg-[#1C1C1E] p-4 border-b border-[rgba(255,255,255,0.08)]">
            <span className="flex-[3] text-[#8E8E93] text-[11px] font-extrabold uppercase">Batter</span>
            <span className="w-[30px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">R</span>
            <span className="w-[30px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">B</span>
            <span className="w-[30px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">4s</span>
            <span className="w-[30px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">6s</span>
            <span className="w-[45px] text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">SR</span>
          </div>
          {(inning.batting || []).map((b, i) => (
            <div key={i} className="flex p-4 border-b border-[rgba(255,255,255,0.08)] items-center">
              <div className="flex-[3] pr-2 min-w-0">
                <span className="block text-[#F5F5F7] text-[14px] font-bold break-words leading-snug">{decodeEntities(b.name)}{!b.is_out && '*'}</span>
                <span className="block text-[#8E8E93] text-[11px] mt-1 font-medium break-words leading-snug">{cleanCricketDismissalText(b.dismissal, b.is_out)}</span>
              </div>
              <span className="w-[30px] text-center text-[#F5F5F7] text-[14px] font-bold tabular-nums">{b.runs}</span>
              <span className="w-[30px] text-center text-[#8E8E93] text-[14px] font-bold tabular-nums">{b.balls}</span>
              <span className="w-[30px] text-center text-[#8E8E93] text-[14px] font-bold tabular-nums">{b.fours || 0}</span>
              <span className="w-[30px] text-center text-[#8E8E93] text-[14px] font-bold tabular-nums">{b.sixes || 0}</span>
              <span className="w-[45px] text-right text-[#0A84FF] text-[14px] font-bold tabular-nums">{b.strike_rate || b.sr || ((b.runs / (b.balls || 1)) * 100).toFixed(1)}</span>
            </div>
          ))}
          <div className="flex justify-between p-5 bg-[#1C1C1E]">
            <span className="text-[#F5F5F7] text-[16px] font-extrabold">Total</span>
            <span className="text-[#F5F5F7] text-[18px] font-extrabold tabular-nums">
              {inning.runs}/{inning.wickets} <span className="text-[11px] text-[#8E8E93] font-semibold">({inning.overs} ov)</span>
            </span>
          </div>
        </div>

        <div className="bg-[#121212] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] mt-5">
          <div className="flex bg-[#1C1C1E] p-4 border-b border-[rgba(255,255,255,0.08)]">
            <span className="flex-[3] text-[#8E8E93] text-[11px] font-extrabold uppercase">Bowler</span>
            <span className="w-[30px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">O</span>
            <span className="w-[30px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">M</span>
            <span className="w-[30px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">R</span>
            <span className="w-[30px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">W</span>
            <span className="w-[45px] text-right text-[#8E8E93] text-[11px] font-extrabold uppercase">ECON</span>
          </div>
          {(inning.bowling || []).map((b, i) => (
            <div key={i} className="flex p-4 border-b border-[rgba(255,255,255,0.08)] items-center">
              <span className="flex-[3] text-[#F5F5F7] text-[14px] font-bold break-words leading-snug pr-2">{decodeEntities(b.name || 'Bowler')}</span>
              <span className="w-[30px] text-center text-[#8E8E93] text-[14px] font-bold tabular-nums">{b.overs}</span>
              <span className="w-[30px] text-center text-[#8E8E93] text-[14px] font-bold tabular-nums">{b.maidens || 0}</span>
              <span className="w-[30px] text-center text-[#F5F5F7] text-[14px] font-bold tabular-nums">{b.runs}</span>
              <span className="w-[30px] text-center text-[#0A84FF] text-[14px] font-bold tabular-nums">{b.wickets}</span>
              <span className="w-[45px] text-right text-[#0A84FF] text-[14px] font-bold tabular-nums">{b.economy || b.econ || (b.runs / (b.overs || 1)).toFixed(1)}</span>
            </div>
          ))}
        </div>

        {partnerships.length > 0 && (
          <div className="bg-[#121212] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] mt-5">
            <div className="flex bg-[#1C1C1E] p-4 border-b border-[rgba(255,255,255,0.08)]">
              <span className="flex-1 text-[#8E8E93] text-[11px] font-extrabold uppercase">Partnerships</span>
              <span className="w-[45px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">Runs</span>
              <span className="w-[45px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">Balls</span>
            </div>
            {partnerships.map((p, i) => {
              let names = 'Batters';
              if (p.batter_1 && p.batter_2) names = `${p.batter_1} & ${p.batter_2}`;
              else if (p.players && Array.isArray(p.players)) names = p.players.map(pl => pl.name || pl).join(' & ');
              else if (p.player1 && p.player2) names = `${p.player1.name || p.player1} & ${p.player2.name || p.player2}`;
              else if (p.bat1_name && p.bat2_name) names = `${p.bat1_name} & ${p.bat2_name}`;
              return (
                <div key={i} className="flex p-4 border-b border-[rgba(255,255,255,0.08)] items-center">
                  <span className="flex-1 text-[#F5F5F7] text-[14px] font-bold pr-2 break-words leading-snug">{decodeEntities(names)}</span>
                  <span className="w-[45px] text-center text-[#F5F5F7] text-[14px] font-bold tabular-nums">{p.runs ?? '-'}</span>
                  <span className="w-[45px] text-center text-[#8E8E93] text-[14px] font-bold tabular-nums">{p.balls ?? '-'}</span>
                </div>
              );
            })}
          </div>
        )}

        {fow.length > 0 && (
          <div className="bg-[#121212] rounded-[24px] overflow-hidden border border-[rgba(255,255,255,0.08)] mt-5">
            <div className="flex bg-[#1C1C1E] p-4 border-b border-[rgba(255,255,255,0.08)]">
              <span className="flex-1 text-[#8E8E93] text-[11px] font-extrabold uppercase">Fall of Wickets</span>
              <span className="w-[55px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">Score</span>
              <span className="w-[45px] text-center text-[#8E8E93] text-[11px] font-extrabold uppercase">Over</span>
            </div>
            {fow.map((w, i) => (
              <div key={i} className="flex p-4 border-b border-[rgba(255,255,255,0.08)] items-center">
                <span className="flex-1 text-[#F5F5F7] text-[14px] font-bold pr-2 break-words leading-snug">{decodeEntities(w.player_name || 'Batter')}</span>
                <span className="w-[55px] text-center text-[#F5F5F7] text-[14px] font-bold tabular-nums">{w.score}-{w.wicket_number}</span>
                <span className="w-[45px] text-center text-[#8E8E93] text-[14px] font-bold tabular-nums">{w.overs}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  const renderSummaryTab = () => {
    if (!matchDetails || !matchDetails.innings || !matchGraphs) {
      return <EmptyState icon={BarChart2} title="Analysis Unavailable" message="Phase analysis requires match data." />;
    }
    const summaries = [null, null];
    const highestOver = Math.max(...matchGraphs.flatMap(g => g.over_by_over?.map(o => o.over) || [0]));
    const isODI = highestOver > 25;
    const ppLimit = isODI ? 10 : 6;
    const midLimit = isODI ? 40 : 15;
    const deathLimit = isODI ? 50 : 20;

    matchDetails.innings.forEach((inning, idx) => {
      if (idx > 1) return;
      const gData = matchGraphs.find(g => g.team_name === inning.team_name || g.innings_number === inning.innings_number)?.over_by_over || [];
      const pp_runs = gData.filter(o => o.over <= ppLimit).reduce((sum, o) => sum + o.runs_this_over, 0);
      const mid_runs = gData.filter(o => o.over > ppLimit && o.over <= midLimit).reduce((sum, o) => sum + o.runs_this_over, 0);
      const death_runs = gData.filter(o => o.over > midLimit).reduce((sum, o) => sum + o.runs_this_over, 0);
      const fours = (inning.batting || []).reduce((sum, b) => sum + (b.fours || 0), 0);
      const sixes = (inning.batting || []).reduce((sum, b) => sum + (b.sixes || 0), 0);
      const extras = inning.extras?.total || 0;
      const totalBallsFaced = (inning.batting || []).reduce((sum, b) => sum + (b.balls || 0), 0) || 120;
      const totalRunsFromBat = (inning.batting || []).reduce((sum, b) => sum + (b.runs || 0), 0);
      const nonBoundaryRuns = totalRunsFromBat - ((fours * 4) + (sixes * 6));
      const dotBalls = Math.max(0, totalBallsFaced - (fours + sixes + nonBoundaryRuns));
      const dotPercentage = ((dotBalls / totalBallsFaced) * 100).toFixed(1);
      summaries[idx] = { name: inning.team_name, pp_runs, mid_runs, death_runs, fours, sixes, extras, dotPercentage };
    });

    if (!summaries[0] || !summaries[1]) {
      return <EmptyState icon={BarChart2} title="Waiting for 2nd Innings" message="Match analysis compares both teams. Please wait for the second innings." />;
    }

    return (
      <div className="px-4 pb-10">
        <div className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)]">
          <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Match Analysis</span>
          <div className="flex justify-between mb-6 border-b border-[rgba(255,255,255,0.08)] pb-3">
            <span className="text-[13px] font-extrabold text-[#F5F5F7] flex-1 text-left break-words leading-snug pr-2">{summaries[0].name}</span>
            <span className="text-[13px] font-extrabold text-[#F5F5F7] flex-1 text-right break-words leading-snug pl-2">{summaries[1].name}</span>
          </div>
          <DuelStat label={`Powerplay (1-${ppLimit})`} homeVal={summaries[0].pp_runs} awayVal={summaries[1].pp_runs} />
          <DuelStat label={`Middle (${ppLimit + 1}-${midLimit})`} homeVal={summaries[0].mid_runs} awayVal={summaries[1].mid_runs} />
          <DuelStat label={`Death (${midLimit + 1}-${deathLimit})`} homeVal={summaries[0].death_runs} awayVal={summaries[1].death_runs} />
          <div className="h-[1px] bg-[rgba(255,255,255,0.08)] my-6" />
          <DuelStat label="Total 4s" homeVal={summaries[0].fours} awayVal={summaries[1].fours} />
          <DuelStat label="Total 6s" homeVal={summaries[0].sixes} awayVal={summaries[1].sixes} />
          <DuelStat label="Extras Conceded" homeVal={summaries[1].extras} awayVal={summaries[0].extras} />
          <DuelStat label="Dot Ball %" homeVal={`${summaries[0].dotPercentage}%`} awayVal={`${summaries[1].dotPercentage}%`} />
        </div>
      </div>
    );
  };

  const renderGraphsTab = () => {
    if (!matchGraphs || matchGraphs.length === 0) {
      return <EmptyState icon={TrendingUp} title="Graphs Unavailable" message="Over-by-over graph data has not been logged for this match." />;
    }
    const inningData = matchGraphs[activeInnings];
    if (!inningData || !inningData.over_by_over) return null;

    const highestOver = Math.max(...matchGraphs.flatMap(g => g.over_by_over?.map(o => o.over) || [0]));
    const maxOvers = highestOver <= 22 ? 20 : highestOver <= 52 ? 50 : Math.ceil(highestOver / 10) * 10;
    const validOvers = inningData.over_by_over.filter(ov => ov.over <= maxOvers);
    const maxRunsInAnOver = Math.max(...validOvers.map(o => o.runs_this_over || 0), 10);
    const yMax = Math.ceil(maxRunsInAnOver / 5) * 5 + 5;
    const GRAPH_HEIGHT = 240;
    const DRAW_HEIGHT = GRAPH_HEIGHT - 40;

    return (
      <div className="px-4 pb-10">
        <WormGraph graphs={matchGraphs} />
        <div className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)]">
          <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Runs Per Over (Manhattan)</span>
          <div className="flex h-[270px]">
            <div className="flex flex-col justify-between pr-3 pt-10" style={{ height: DRAW_HEIGHT }}>
              <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">{yMax}</span>
              <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">{Math.floor(yMax / 2)}</span>
              <span className="text-[10px] text-[#8E8E93] font-bold tabular-nums">0</span>
            </div>
            <div className="flex-1 overflow-x-auto flex items-end [&::-webkit-scrollbar]:hidden" style={{ height: GRAPH_HEIGHT }}>
              {validOvers.map((ov, index) => {
                const barHeight = Math.max((ov.runs_this_over / yMax) * DRAW_HEIGHT, 5);
                const isWicket = ov.wickets_this_over > 0;
                const barColor = activeInnings === 0 ? THEME.muted : THEME.accent;
                return (
                  <div key={index} className="flex flex-col items-center w-[24px] mx-1 shrink-0 relative">
                    <span className="text-[10px] text-[#F5F5F7] mb-1.5 font-extrabold tabular-nums">{ov.runs_this_over}</span>
                    {isWicket && (
                      <div className="mb-1 bg-[#FF453A] px-1.5 py-0.5 rounded-[6px] flex items-center justify-center">
                        <span className="text-[8px] font-black text-white">{ov.wickets_this_over > 1 ? `${ov.wickets_this_over}W` : 'W'}</span>
                      </div>
                    )}
                    <div className="w-[16px] rounded-t-[8px]" style={{ height: barHeight, backgroundColor: isWicket ? THEME.danger : barColor }} />
                    <span className="text-[10px] text-[#8E8E93] mt-2 font-bold tabular-nums">{ov.over}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/70 ios-backdrop-in flex flex-col justify-end">
      <div className="absolute inset-0" onClick={onClose} />
      <div className="relative h-[94vh] max-w-md w-full mx-auto pt-4 bg-[#000000] rounded-t-[40px] flex flex-col overflow-hidden border-t border-[rgba(255,255,255,0.12)] ios-sheet-up transform-gpu">
        <div className="w-full h-[30px] flex items-center justify-center cursor-pointer shrink-0" onClick={onClose}>
          <div className="w-[48px] h-[5px] bg-[rgba(255,255,255,0.08)] rounded-[3px]" />
        </div>

        {renderCricketModalHero()}

        {detailsLoading && !matchDetails ? (
          <WhitePillLoader className="mt-12 py-6" />
        ) : (
          <div className="flex-1 flex flex-col min-h-0">
            {matchDetails?.innings && matchDetails.innings.length > 0 && (
              <div className="grid grid-cols-2 gap-2.5 px-4 mb-3 shrink-0">
                {matchDetails.innings.map((inn, idx) => {
                  const matchTeam = match.teams.find(t => t.name === inn.team_name || t.short_name === inn.team_name);
                  const displayName = matchTeam ? matchTeam.short_name : inn.team_name;
                  const active = activeInnings === idx;
                  return (
                    <button
                      key={idx}
                      onClick={() => setActiveInnings(idx)}
                      className={`py-3 px-2 rounded-[16px] text-[13px] border break-words leading-tight text-center transition-colors ${active ? 'bg-[#1C1C1E] border-[#F5F5F7] text-[#F5F5F7] font-extrabold' : 'bg-[#121212] border-[rgba(255,255,255,0.08)] text-[#8E8E93] font-bold'}`}
                    >
                      {displayName}
                    </button>
                  );
                })}
              </div>
            )}

            {/* Equal 5-Column Grid Tab Bar so Info, Scorecard, Summary, Overs, and Graphs align symmetrically */}
            <div className="grid grid-cols-5 items-center bg-[#1C1C1E] rounded-[16px] p-1 mx-4 mb-4 border border-[rgba(255,255,255,0.08)] shrink-0">
              {CRICKET_MATCH_TABS.map(t => {
                const active = activeTab === t.id;
                return (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`min-w-0 py-2.5 px-1 rounded-[12px] text-[11px] leading-none text-center truncate transition-all ${active ? 'bg-[#2C2C2E] text-[#F5F5F7] font-extrabold shadow-sm' : 'text-[#8E8E93] font-bold'}`}
                  >
                    {t.label}
                  </button>
                );
              })}
            </div>

            <div className="flex-1 overflow-y-auto [&::-webkit-scrollbar]:hidden">
              {activeTab === 'info' && renderInfoTab()}
              {activeTab === 'scorecard' && renderScorecardTab()}
              {activeTab === 'summary' && renderSummaryTab()}
              {activeTab === 'graphs' && renderGraphsTab()}
              {activeTab === 'overs' && (
                groupedOvers.length === 0 ? (
                  <EmptyState icon={History} title="No Overs Logged" message="Ball-by-ball commentary has not begun." />
                ) : (
                  <div className="px-4 pb-10">
                    {groupedOvers.map((item, idx) => (
                      <div key={idx} className="bg-[#121212] rounded-[24px] p-5 mb-4 border border-[rgba(255,255,255,0.08)]">
                        <div className="flex justify-between mb-3 border-b border-[rgba(255,255,255,0.08)] pb-2.5">
                          <span className="text-[#F5F5F7] text-[12px] font-extrabold">OVER {item.num}</span>
                          <span className="text-[#8E8E93] text-[12px] font-bold">{item.bowler}</span>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                          {item.balls.map((b, i) => (
                            <div key={i} className="w-[36px] h-[36px] rounded-full flex items-center justify-center" style={{ backgroundColor: b.bg }}>
                              <span className="text-[13px] font-extrabold tabular-nums" style={{ color: b.txt }}>{b.val}</span>
                            </div>
                          ))}
                        </div>
                        {item.highlights.length > 0 && (
                          <div className="mt-4 pt-3 border-t border-[rgba(255,255,255,0.08)]">
                            {item.highlights.map((h, i) => (
                              <div key={i} className="flex items-start mb-3 last:mb-0">
                                <span className="text-[10px] font-black tracking-[0.5px] w-[60px] mt-0.5 shrink-0" style={{ color: h.color }}>{h.event}</span>
                                <span className="flex-1 text-[#F5F5F7] text-[13px] leading-[18px] font-medium">{h.desc}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// ==========================================
// ⚽ SOCCER MATCH MODAL
// ==========================================

const FootballMatchModal = ({ match, onClose, onOpenTeam }) => {
  const leaguePrefix = match?._leagueId && match._leagueId !== 'custom' ? match._leagueId : 'all';
  const sumUrl = `${API_SOCCER_SCORE_BASE}/${leaguePrefix}/summary?event=${match?.id}`;
  const fallbackSumUrl = `${API_SOCCER_SCORE_BASE}/all/summary?event=${match?.id}`;
  const [summary, setSummary] = useState(() =>
    match?.id ? (getCachedSync(sumUrl) || getCachedSync(fallbackSumUrl)) : null
  );
  const [tab, setTab] = useState('lineup');

  const fetchActiveDetails = useCallback(async (isSilent = false) => {
    if (!match?.id) return;
    try {
      let data = await fetchWithCache(sumUrl, isSilent).catch(() => null);
      if (!data?.rosters && sumUrl !== fallbackSumUrl) {
        data = await fetchWithCache(fallbackSumUrl, isSilent).catch(() => data);
      }
      if (data) setSummary(data);
      else if (!isSilent) setSummary(prev => prev || {});
    } catch {
      if (!isSilent) setSummary(prev => prev || {});
    }
  }, [match?.id, sumUrl, fallbackSumUrl]);

  useEffect(() => {
    fetchActiveDetails(false);
    const interval = setInterval(() => fetchActiveDetails(true), 10000);
    return () => clearInterval(interval);
  }, [fetchActiveDetails]);

  const hComp = match?.competitions?.[0]?.competitors?.find(c => c.homeAway === 'home');
  const aComp = match?.competitions?.[0]?.competitors?.find(c => c.homeAway === 'away');
  let hScore = getSafeFootballScore(hComp?.score);
  let aScore = getSafeFootballScore(aComp?.score);
  if (summary?.header?.competitions?.[0]?.competitors) {
    const sumH = summary.header.competitions[0].competitors.find(c => c.team.id === hComp?.team?.id);
    const sumA = summary.header.competitions[0].competitors.find(c => c.team.id === aComp?.team?.id);
    if (sumH && sumH.score !== undefined) hScore = getSafeFootballScore(sumH.score);
    if (sumA && sumA.score !== undefined) aScore = getSafeFootballScore(sumA.score);
  }

  return (
    <div className="fixed inset-0 z-50 bg-black/70 ios-backdrop-in flex flex-col justify-end">
      <div className="absolute inset-0" onClick={onClose} />
      <div className="relative h-[94vh] max-w-md w-full mx-auto pt-4 bg-[#000000] rounded-t-[40px] flex flex-col overflow-hidden border-t border-[rgba(255,255,255,0.12)] ios-sheet-up transform-gpu">
        <div className="w-full h-[30px] flex items-center justify-center cursor-pointer shrink-0" onClick={onClose}>
          <div className="w-[48px] h-[5px] bg-[rgba(255,255,255,0.08)] rounded-[3px]" />
        </div>

        <div className="flex justify-between px-5 pt-2 pb-4 w-full items-start shrink-0">
          <div className="w-[38%] flex flex-col items-center gap-1.5 cursor-pointer" onClick={() => onOpenTeam(hComp?.team, match._leagueId, null, 'soccer')}>
            <img src={getSafeFootballLogo(hComp?.team)} onError={(e) => handleImageError(e, hComp?.team?.shortDisplayName)} className="w-[68px] h-[68px] object-contain" alt="" />
            <span className="text-[13px] font-bold text-[#F5F5F7] text-center mt-0.5 line-clamp-2">{hComp?.team?.shortDisplayName}</span>
            <div className="h-[46px] flex flex-col items-center justify-start">
              <span className="text-[30px] font-extrabold text-[#F5F5F7] text-center tabular-nums leading-none">{hScore}</span>
            </div>
          </div>

          <div className="w-[24%] flex flex-col items-center justify-center pt-5">
            <span className="text-[#8E8E93] text-[11px] font-bold text-center">{match?.status?.type?.shortDetail || 'Match'}</span>
          </div>

          <div className="w-[38%] flex flex-col items-center gap-1.5 cursor-pointer" onClick={() => onOpenTeam(aComp?.team, match._leagueId, null, 'soccer')}>
            <img src={getSafeFootballLogo(aComp?.team)} onError={(e) => handleImageError(e, aComp?.team?.shortDisplayName)} className="w-[68px] h-[68px] object-contain" alt="" />
            <span className="text-[13px] font-bold text-[#F5F5F7] text-center mt-0.5 line-clamp-2">{aComp?.team?.shortDisplayName}</span>
            <div className="h-[46px] flex flex-col items-center justify-start">
              <span className="text-[30px] font-extrabold text-[#F5F5F7] text-center tabular-nums leading-none">{aScore}</span>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-3 items-center bg-[#1C1C1E] rounded-[16px] p-1 mx-4 mb-4 border border-[rgba(255,255,255,0.08)] shrink-0">
          {['lineup', 'commentary', 'stats'].map(t => {
            const active = tab === t;
            return (
              <button
                key={t}
                onClick={() => setTab(t)}
                className={`py-2.5 px-2 rounded-[12px] text-[12px] leading-none text-center truncate transition-all ${active ? 'bg-[#2C2C2E] text-[#F5F5F7] font-extrabold shadow-sm' : 'text-[#8E8E93] font-bold'}`}
              >
                {capitalize(t)}
              </button>
            );
          })}
        </div>

        <div className="flex-1 overflow-y-auto [&::-webkit-scrollbar]:hidden">
          {tab === 'lineup' && (
            <div className="pb-10">
              <TacticalPitch summary={summary} home={hComp} away={aComp} />
            </div>
          )}

          {tab === 'stats' && (
            <div className="px-4 pb-10">
              {!summary?.boxscore?.teams?.[0]?.statistics ? (
                <EmptyState icon={BarChart2} title="Stats Unavailable" message="Match statistics have not been populated yet." />
              ) : (
                <div className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)]">
                  {summary.boxscore.teams[0].statistics.map((s, i) => (
                    <DuelStat key={i} label={s.label} homeVal={s.displayValue} awayVal={summary?.boxscore?.teams?.[1]?.statistics?.[i]?.displayValue} />
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === 'commentary' && (
            (!summary?.commentary && !summary?.keyEvents) ? (
              <EmptyState icon={MessageSquare} title="No Commentary" message="Live commentary stream is offline." />
            ) : (
              <div className="px-5 pb-10">
                {(() => {
                  const rawList = [...(summary?.commentary || summary?.keyEvents || [])];
                  const parseMin = (it) => {
                    const t = extractFootballTime(it).replace(/[’']/g, '');
                    const parts = t.split('+').map(n => parseInt(n, 10) || 0);
                    return (parts[0] || 0) * 100 + (parts[1] || 0);
                  };
                  if (rawList.length > 1 && parseMin(rawList[0]) < parseMin(rawList[rawList.length - 1])) {
                    rawList.reverse();
                  }
                  return rawList;
                })().map((item, index) => {
                  const txt = String(item.text || item.shortText || "").toLowerCase();
                  const time = extractFootballTime(item);
                  let meta = { icon: Clock, color: THEME.muted, label: 'Match' };
                  if (txt.includes('goal')) meta = { icon: CircleDashed, color: THEME.accent, label: 'Goal' };
                  else if (txt.includes('free kick')) meta = { icon: Mic, color: THEME.freekick, label: 'Free Kick' };
                  else if (txt.includes('miss') || txt.includes('shot')) meta = { icon: Target, color: THEME.shot, label: 'Chance' };
                  else if (txt.includes('yellow')) meta = { icon: Square, color: THEME.warning, label: 'Caution' };
                  else if (txt.includes('red')) meta = { icon: Square, color: THEME.danger, label: 'Red Card' };
                  else if (txt.includes('substitut')) meta = { icon: ArrowRightLeft, color: THEME.muted, label: 'Sub' };
                  else if (txt.includes('offside')) meta = { icon: Flag, color: THEME.offside, label: 'Offside' };
                  else if (txt.includes('foul')) meta = { icon: AlertCircle, color: THEME.danger, label: 'Foul' };
                  const IconComp = meta.icon;

                  const minuteStamp = time || "0’";

                  return (
                    <div key={index} className={`flex gap-4 ${index === 0 ? 'mt-2.5' : ''}`}>
                      <div className="flex flex-col items-center w-[52px] shrink-0">
                        <div className="w-[34px] h-[34px] rounded-[12px] bg-[#1C1C1E] border border-[rgba(255,255,255,0.08)] flex items-center justify-center z-10 shrink-0">
                          <IconComp size={15} color={meta.color} />
                        </div>
                        <span className="text-[11px] font-extrabold text-[#F5F5F7] tabular-nums mt-1.5 mb-1.5 tracking-[0.2px]">{minuteStamp}</span>
                        <div className="flex-1 w-[2px] bg-[rgba(255,255,255,0.08)]" />
                      </div>
                      <div className="flex-1 bg-[#121212] p-5 rounded-[24px] mb-6 border border-[rgba(255,255,255,0.08)]">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="text-[11px] font-extrabold uppercase break-words" style={{ color: meta.color }}>{meta.label}</span>
                        </div>
                        <p className="text-[#F5F5F7] text-[14px] leading-[22px] font-medium text-left">{item.text || item.shortText}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            )
          )}
        </div>
      </div>
    </div>
  );
};

// ==========================================
// 🏏 CRICKET TEAM HUB MODAL (ALIGNED RECENT FORM GRID)
// ==========================================

const CricketTeamModal = ({ team, existingStats, favorites, onToggleFavorite, onClose, onOpenMatch }) => {
  const [teamTab, setTeamTab] = useState('squad');
  const [teamData, setTeamData] = useState(() => {
    const teamIdStr = team.team_id || team.id;
    const cachedProf = teamIdStr ? getCachedSync(`${API_CRICKET_BASE}/team/${teamIdStr}`) : null;
    const cachedStd = getCachedSync(`${API_CRICKET_BASE}/standings`) || [];
    const cachedSched = getCachedSync(`${API_CRICKET_BASE}/schedule?days_past=3&days_ahead=4`) || [];

    let foundStats = existingStats || cachedProf?.stats || null;
    let leagueName = stripSeasonYear(existingStats?._leagueTitle || team._leagueTitle || '');
    if (!foundStats && Array.isArray(cachedStd)) {
      cachedStd.forEach(lg => {
        (lg.tables || []).forEach(tbl => {
          (tbl.rows || []).forEach((row, idx) => {
            if (doesCricketTeamMatch(row, team)) {
              foundStats = { ...row.stats, rank: row.stats?.rank || idx + 1 };
              leagueName = stripSeasonYear(lg.league || tbl.name || 'Tournament Standings');
            }
          });
        });
      });
    }
    const { formItems, completedMatches } = deriveCricketRecentForm(team, cachedSched, cachedProf, foundStats);
    return {
      ...team,
      displayName: cachedProf?.team_name || team.name || team.short_name || 'Team Info',
      upcoming: [],
      completedMatches,
      stats: foundStats,
      leagueName,
      squad: cachedProf?.squad || [],
      recentForm: formItems
    };
  });

  useEffect(() => {
    let active = true;
    const teamIdStr = team.team_id || team.id;

    Promise.all([
      teamIdStr ? fetchWithCache(`${API_CRICKET_BASE}/team/${teamIdStr}`).catch(() => null) : Promise.resolve(null),
      fetchWithCache(`${API_CRICKET_BASE}/standings`).catch(() => []),
      fetchWithCache(`${API_CRICKET_BASE}/schedule?days_past=45&days_ahead=30`).catch(() => [])
    ]).then(([teamProf, stdRes, schedRes]) => {
      if (!active) return;
      const allSched = Array.isArray(schedRes) ? schedRes : [];
      const upcoming = allSched.filter(m => {
        const isTeamMatch = (m.teams || []).some(t => doesCricketTeamMatch(t, team));
        return isTeamMatch && (m.status === 'PRE' || m.status === 'SCHEDULED' || new Date(m.start_time) > new Date());
      }).sort((a, b) => new Date(a.start_time) - new Date(b.start_time)).slice(0, 5);

      let teamStats = existingStats || teamProf?.stats || null;
      let leagueName = stripSeasonYear(existingStats?._leagueTitle || team._leagueTitle || '');
      if (!teamStats && Array.isArray(stdRes)) {
        stdRes.forEach(lg => {
          (lg.tables || []).forEach(tbl => {
            (tbl.rows || []).forEach((row, idx) => {
              if (doesCricketTeamMatch(row, team)) {
                teamStats = { ...row.stats, rank: row.stats?.rank || idx + 1 };
                leagueName = stripSeasonYear(lg.league || tbl.name || 'Tournament Standings');
              }
            });
          });
        });
      }

      const { formItems, completedMatches } = deriveCricketRecentForm(team, allSched, teamProf, teamStats);

      setTeamData({
        ...team,
        displayName: teamProf?.team_name || team.name || team.short_name || 'Team Info',
        upcoming,
        completedMatches,
        stats: teamStats,
        leagueName,
        squad: teamProf?.squad || [],
        recentForm: formItems
      });

      (completedMatches || []).slice(0, 3).forEach(cm => {
        if (!cm.match_id) return;
        const hasScores = cm.teams?.[0]?.score && cm.teams?.[1]?.score;
        if (!hasScores) {
          fetchWithCache(`${API_CRICKET_BASE}/match/${cm.match_id}`).then(det => {
            if (!active || !det?.innings?.length) return;
            setTeamData(prev => {
              if (!prev) return prev;
              const updatedCompleted = (prev.completedMatches || []).map(item => {
                if (item.match_id !== cm.match_id) return item;
                const newTeams = (item.teams || []).map(t => {
                  const inn = det.innings.filter(i => i.team_name === t.name || i.team_name === t.short_name).pop();
                  return inn ? { ...t, score: `${inn.runs}/${inn.wickets} (${inn.overs} ov)` } : t;
                });
                return { ...item, teams: newTeams, status_text: det.status_text || item.status_text };
              });
              return { ...prev, completedMatches: updatedCompleted };
            });
          }).catch(() => {});
        }
      });
    });

    return () => { active = false; };
  }, [team, existingStats]);

  const squadGroups = useMemo(() => {
    if (!teamData?.squad) return [];
    const groups = { Batters: [], AllRounders: [], Wicketkeepers: [], Bowlers: [] };
    teamData.squad.forEach(p => {
      const role = String(p.playing_role || '').toUpperCase();
      if (role === 'AR') groups.AllRounders.push(p);
      else if (role === 'WK') groups.Wicketkeepers.push(p);
      else if (role === 'BL') groups.Bowlers.push(p);
      else groups.Batters.push(p);
    });
    return [
      { title: 'Batters', icon: Zap, color: THEME.fwd, data: groups.Batters },
      { title: 'All-Rounders', icon: Star, color: THEME.mid, data: groups.AllRounders },
      { title: 'Wicketkeepers', icon: Hand, color: THEME.warning, data: groups.Wicketkeepers },
      { title: 'Bowlers', icon: CircleDashed, color: THEME.def, data: groups.Bowlers }
    ].filter(g => g.data.length > 0);
  }, [teamData]);

  const renderCricketTeamStats = () => {
    const stats = teamData?.stats;
    const formList = teamData?.recentForm || [];
    const completed = teamData?.completedMatches || [];

    const winsCount = formList.filter(f => f.result === 'W').length;
    const lossCount = formList.filter(f => f.result === 'L').length;
    const winRate = formList.length > 0 ? Math.round((winsCount / formList.length) * 100) : 0;

    return (
      <div className="w-full">
        <div className="bg-[#121212] p-5 rounded-[32px] border border-[rgba(255,255,255,0.08)] mb-6">
          <div className="flex justify-between items-center mb-4 px-1">
            <span className="text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] uppercase">Recent Form</span>
            <span className="text-[10px] font-bold text-[#8E8E93] uppercase tracking-[1px]">Latest First</span>
          </div>

          {formList.length > 0 ? (
            <>
              <div className="grid grid-cols-5 gap-2 mb-4">
                {formList.map((item, i) => {
                  const res = item.result;
                  let bgColor = THEME.surfaceHighlight;
                  let color = THEME.text;
                  if (res === 'W') { bgColor = `${THEME.success}20`; color = THEME.success; }
                  else if (res === 'L') { bgColor = `${THEME.danger}20`; color = THEME.danger; }
                  else if (res === 'D' || res === 'NR' || res === 'T') { bgColor = `${THEME.warning}20`; color = THEME.warning; }

                  return (
                    <div key={i} className="bg-[#1C1C1E] rounded-[16px] py-2.5 px-1.5 flex flex-col items-center justify-between border border-[rgba(255,255,255,0.08)] min-h-[86px]">
                      <span className={`text-[7px] font-black tracking-[0.6px] uppercase h-[10px] leading-none ${i === 0 ? 'text-[#0A84FF]' : 'text-transparent'}`}>
                        LATEST
                      </span>
                      <div className="w-[34px] h-[34px] rounded-[10px] flex items-center justify-center border my-1" style={{ backgroundColor: bgColor, borderColor: color }}>
                        <span className="font-black text-[13px] leading-none" style={{ color }}>{res}</span>
                      </div>
                      <span className="text-[9px] font-bold text-[#8E8E93] text-center truncate w-full leading-tight">
                        {item.opp ? `vs ${item.opp}` : `M${i + 1}`}
                      </span>
                    </div>
                  );
                })}
              </div>

              <div className="grid grid-cols-3 gap-2 pt-3 border-t border-[rgba(255,255,255,0.08)]">
                <div className="bg-[#1C1C1E] rounded-[14px] py-2.5 px-2 text-center">
                  <span className="block text-[9px] font-extrabold text-[#8E8E93] tracking-[1px] uppercase mb-0.5">WINS</span>
                  <span className="text-[16px] font-extrabold text-[#32D74B] tabular-nums">{winsCount}</span>
                </div>
                <div className="bg-[#1C1C1E] rounded-[14px] py-2.5 px-2 text-center">
                  <span className="block text-[9px] font-extrabold text-[#8E8E93] tracking-[1px] uppercase mb-0.5">LOSSES</span>
                  <span className="text-[16px] font-extrabold text-[#FF453A] tabular-nums">{lossCount}</span>
                </div>
                <div className="bg-[#1C1C1E] rounded-[14px] py-2.5 px-2 text-center">
                  <span className="block text-[9px] font-extrabold text-[#8E8E93] tracking-[1px] uppercase mb-0.5">WIN RATE</span>
                  <span className="text-[16px] font-extrabold text-[#0A84FF] tabular-nums">{winRate}%</span>
                </div>
              </div>
            </>
          ) : (
            <span className="block text-[#8E8E93] text-[12px] italic px-1">No recent form fixtures recorded in the current window.</span>
          )}
        </div>

        {stats && (
          <div className="bg-[#121212] p-6 rounded-[32px] border border-[rgba(255,255,255,0.08)] mb-6">
            {teamData.leagueName && (
              <div className="w-full mb-5 flex flex-col items-center">
                <span className="text-[#8E8E93] text-[11px] font-extrabold tracking-[1.5px] uppercase mb-1.5 text-center">{teamData.leagueName}</span>
                {stats.rank && <span className="text-[#0A84FF] text-[16px] font-extrabold">Position #{stats.rank}</span>}
              </div>
            )}
            <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase">Tournament Standings</span>
            <div className="grid grid-cols-2 gap-3 mb-3">
              <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                <Activity size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">PLAYED</span>
                <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{stats.matchesplayed || stats.played || 0}</span>
              </div>
              <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                <Trophy size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">WINS</span>
                <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{stats.matcheswon || stats.wins || 0}</span>
              </div>
              <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                <XCircle size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">LOSSES</span>
                <span className="text-[#F5F5F7] text-[24px] font-extrabold tabular-nums">{stats.matcheslost || stats.losses || 0}</span>
              </div>
              <div className="bg-[#1C1C1E] py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border border-[rgba(255,255,255,0.08)]">
                <TrendingUp size={16} color={THEME.muted} className="mb-1.5 shrink-0" />
                <span className="text-[#8E8E93] text-[10px] font-extrabold tracking-[1.5px] mb-1">NRR</span>
                <span className="text-[24px] font-extrabold tabular-nums" style={{ color: parseFloat(stats.netrr || stats.nrr || 0) >= 0 ? THEME.success : THEME.danger }}>
                  {stats.netrr || stats.nrr || '0.00'}
                </span>
              </div>
            </div>
            <div className="w-full py-4 px-3 rounded-[20px] flex flex-col items-center justify-center border mt-3" style={{ backgroundColor: THEME.accentMuted, borderColor: THEME.accent }}>
              <Star size={18} color={THEME.accent} className="mb-1.5 shrink-0" />
              <span className="text-[10px] font-extrabold tracking-[1.5px] mb-1" style={{ color: THEME.accent }}>TOTAL POINTS</span>
              <span className="text-[24px] font-extrabold tabular-nums" style={{ color: THEME.accent }}>{stats.matchpoints || stats.points || 0}</span>
            </div>
          </div>
        )}

        {completed.length > 0 && (
          <div className="mb-6">
            <span className="block text-[#8E8E93] text-[12px] font-extrabold tracking-[1.5px] mb-4 uppercase px-1">Recently Completed</span>
            {completed.map((m, idx) => {
              const h = m.teams[0];
              const a = m.teams[1];
              const hScore = formatCricketScore(h.score);
              const aScore = formatCricketScore(a.score);
              const { detailedStatus } = getCricketMatchStatus(m, new Date());
              return (
                <div
                  key={m.match_id || idx}
                  onClick={() => onOpenMatch({ ...m, _sport: 'cricket' })}
                  className="bg-[#121212] rounded-[24px] p-4 mb-3 border border-[rgba(255,255,255,0.08)] cursor-pointer active:opacity-80"
                >
                  <div className="flex justify-between items-center mb-3 pb-2 border-b border-[rgba(255,255,255,0.08)]">
                    <span className="text-[10px] font-extrabold text-[#0A84FF] uppercase tracking-[0.5px] break-words leading-tight">{getShortLeagueName(m.league || m.title)}</span>
                    <span className="text-[10px] font-bold text-[#8E8E93]">{getFavFormattedDate(m.start_time, false)}</span>
                  </div>
                  <div className="flex items-center justify-between py-1">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <img src={getCricketLogo(h)} onError={(e) => handleImageError(e, h.short_name || h.name)} className="w-6 h-6 object-contain shrink-0" alt="" />
                      <span className="text-[14px] font-bold text-[#F5F5F7] break-words leading-snug">{h.short_name || h.name}</span>
                    </div>
                    <div className="text-right">
                      <span className="text-[14px] font-extrabold text-[#F5F5F7] tabular-nums">{hScore.runs || '—'}</span>
                      {hScore.overs && <span className="text-[11px] text-[#8E8E93] font-semibold ml-1.5">{hScore.overs}</span>}
                    </div>
                  </div>
                  <div className="flex items-center justify-between py-1 mt-1">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <img src={getCricketLogo(a)} onError={(e) => handleImageError(e, a.short_name || a.name)} className="w-6 h-6 object-contain shrink-0" alt="" />
                      <span className="text-[14px] font-bold text-[#F5F5F7] break-words leading-snug">{a.short_name || a.name}</span>
                    </div>
                    <div className="text-right">
                      <span className="text-[14px] font-extrabold text-[#F5F5F7] tabular-nums">{aScore.runs || '—'}</span>
                      {aScore.overs && <span className="text-[11px] text-[#8E8E93] font-semibold ml-1.5">{aScore.overs}</span>}
                    </div>
                  </div>
                  {(detailedStatus || m.status_text) && (
                    <div className="mt-2.5 pt-2 border-t border-[rgba(255,255,255,0.08)] flex items-center justify-between">
                      <span className="text-[11px] font-bold text-[#32D74B] break-words leading-snug">{detailedStatus || m.status_text}</span>
                      <span className="text-[10px] font-extrabold text-[#8E8E93] uppercase">Scorecard →</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  const favKey = String(teamData?.id || teamData?.team_id || teamData?.name || '');
  const isFav = favorites.includes(favKey);

  return (
    <div className="fixed inset-0 z-50 bg-black/70 ios-backdrop-in flex flex-col justify-end">
      <div className="absolute inset-0" onClick={onClose} />
      <div className="relative h-[94vh] max-w-md w-full mx-auto pt-4 bg-[#000000] rounded-t-[40px] flex flex-col overflow-hidden border-t border-[rgba(255,255,255,0.12)] ios-sheet-up transform-gpu">

            <h2 className="text-[22px] font-black text-[#F5F5F7] mb-4 text-center">{teamData.displayName}</h2>

            <div className="grid grid-cols-3 items-center bg-[#1C1C1E] rounded-[16px] p-1 w-full mb-5 border border-[rgba(255,255,255,0.08)]">

                return (

                    key={t}
                    onClick={() => setTeamTab(t)}

              squadGroups.length === 0 ? (
                <EmptyState icon={Users} title="Squad Pending" message="Roster data has not been published for this team yet." />
              ) : (
                squadGroups.map(g => {
                  const IconComp = g.icon;
                  return (
                    <div key={g.title} className="px-1 mb-8">
                      <div className="flex items-center gap-2.5 mb-5 pb-2.5 border-b border-[rgba(255,255,255,0.08)]">
                        <IconComp size={18} color={g.color} className="shrink-0" />
                        <span className="text-[14px] font-extrabold tracking-[1px] uppercase" style={{ color: g.color }}>{g.title}</span>
                      </div>
                      {g.data.map((p, idx) => {
                        const detailsList = [p.batting_style, p.bowling_style].filter(Boolean);
                        return (
                          <div key={p.id || idx} className="flex items-center bg-[#121212] p-4 rounded-[20px] mb-2.5 border border-[rgba(255,255,255,0.08)]">
                            <div className="w-[36px] h-[36px] rounded-full flex items-center justify-center mr-4 shrink-0" style={{ backgroundColor: `${g.color}20` }}>
                              <User size={16} color={g.color} />
                            </div>
                            <div className="flex-1 min-w-0">
                              <span className="block text-[#F5F5F7] text-[15px] font-bold break-words leading-snug">{p.name}</span>
